name: Barrier Atlas targeted hold closure v0.2

on:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - 'barrier_atlas/family_independence/**'
      - '.github/workflows/barrier-atlas-targeted-hold-closure-v02.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate additive hold closure
        run: python barrier_atlas/family_independence/validate_targeted_hold_closure_v0.2.py
      - name: Run targeted test
        run: |
          python -m pip install pytest
          python -m pytest -q barrier_atlas/family_independence/test_targeted_hold_closure_v0_2.py

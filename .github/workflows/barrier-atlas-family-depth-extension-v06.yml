name: Barrier Atlas family depth extension v0.6

on:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - 'barrier_atlas/family_independence/**'
      - '.github/workflows/barrier-atlas-family-depth-extension-v06.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate additive family-depth extension v0.6
        run: python barrier_atlas/family_independence/validate_family_depth_extension_v0_6.py
      - name: Run v0.6 regression tests
        run: |
          python -m pip install pytest
          python -m pytest -q barrier_atlas/family_independence/test_family_depth_extension_v0_6.py

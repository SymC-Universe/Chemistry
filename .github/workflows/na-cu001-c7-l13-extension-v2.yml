name: Na Cu001 C7 L13 strict holdout extension v2

on:
  workflow_dispatch:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - 'na_cu001_ci/c7_source_run_audit_v1.py'
      - 'na_cu001_ci/test_c7_source_run_audit_v1.py'
      - 'na_cu001_ci/slab_l13_extension_v1.py'
      - 'na_cu001_ci/test_slab_l13_extension_v1.py'
      - '.github/workflows/na-cu001-c7-l13-extension-v2.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: na-cu001-c7-l13-extension-v2-${{ github.sha }}
  cancel-in-progress: false

env:
  SOURCE_C7_RUN_ID: '30949901790'
  SOURCE_C7_COMMIT: '8ca3f708537886050ef18210315e79a43595d3f3'
  SOURCE_BASE_DIGEST: 'sha256:122e89a9b79d21cc1ba7c4fe5b87f271b709bc51457015db17582960ebe8f045'
  SOURCE_BASE_SIZE: '102658'
  SOURCE_QE_DIGEST: 'sha256:65f0f0e8a2f7b9a3528e2d78734fa114f6703401ac0aeaac02cf31d7853a66ae'
  SOURCE_QE_SIZE: '101484780'
  OMP_NUM_THREADS: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Audit all source attempts and immutable artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gh python3-numpy
          mkdir -p l13_provenance
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_C7_RUN_ID}" \
            > l13_provenance/source_run.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_C7_RUN_ID}/jobs?filter=all&per_page=100" \
            > l13_provenance/source_job_pages.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_C7_RUN_ID}/artifacts?per_page=100" \
            > l13_provenance/source_artifact_pages.json
          python3 -m py_compile \
            na_cu001_ci/c7_source_run_audit_v1.py \
            na_cu001_ci/test_c7_source_run_audit_v1.py \
            na_cu001_ci/slab_l13_extension_v1.py \
            na_cu001_ci/test_slab_l13_extension_v1.py
          (
            cd na_cu001_ci
            python3 test_c7_source_run_audit_v1.py
            python3 test_slab_l13_extension_v1.py
          )
          python3 na_cu001_ci/c7_source_run_audit_v1.py \
            --run l13_provenance/source_run.json \
            --job-pages l13_provenance/source_job_pages.json \
            --artifact-pages l13_provenance/source_artifact_pages.json \
            --source-run-id "$SOURCE_C7_RUN_ID" \
            --source-commit "$SOURCE_C7_COMMIT" \
            --source-base-digest "$SOURCE_BASE_DIGEST" \
            --source-base-size "$SOURCE_BASE_SIZE" \
            --source-qe-digest "$SOURCE_QE_DIGEST" \
            --source-qe-size "$SOURCE_QE_SIZE" \
            --out l13_provenance/SOURCE_C7_L13_PROVENANCE.json

      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-base
          path: base
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_C7_RUN_ID }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-qe
          path: qe_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_C7_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify source files, engine, pseudopotential, and bulk identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat base/COMPUTATIONAL_SOURCE_COMMIT.txt)" = "$SOURCE_C7_COMMIT"
          sha256sum -c base/SLAB_ENTRYPOINT_SOURCE_MANIFEST.sha256
          sha256sum -c qe_bundle/meta/engine_binaries.sha256
          echo 'b31028b2bae60cd9903260715a49b4c6d2b6dc654558c87023fa5206e427a16d  qe_bundle/pseudos/Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf' | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          handoff=json.loads(Path('base/BULK_HANDOFF.json').read_text())
          result=json.loads(Path('base/BULK_CONVERGENCE_RESULT.json').read_text())
          if handoff.get('scientific_status')!='bulk_convergence_passed_slab_not_yet_run' or result.get('gate')!='PASS':
              raise SystemExit('HOLD: frozen bulk source is not PASS')
          if (handoff.get('source_result') or {}).get('sha256') != sha('base/BULK_CONVERGENCE_RESULT.json'):
              raise SystemExit('HOLD: bulk result hash differs from handoff')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-base
          path: |
            base
            l13_provenance
          retention-days: 90
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-qe
          path: qe_bundle
          retention-days: 30
          if-no-files-found: error

  l13-cases:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        vacuum: [12, 16, 20, 24]
        kmesh: [16, 18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-base
          path: source_bundle
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-qe
          path: qe_bundle

      - name: Run one independently checkpointed L13 holdout SCF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            openmpi-bin libopenmpi-dev libopenblas-dev liblapack-dev libfftw3-dev python3-numpy
          chmod +x qe_bundle/bin/pw.x
          tag="l13_v${{ matrix.vacuum }}_k${{ matrix.kmesh }}"
          case_root="l13_outputs/$tag"
          mkdir -p "$case_root"
          set +e
          python3 na_cu001_ci/slab_l13_extension_v1.py run \
            --layers 13 \
            --vacuum '${{ matrix.vacuum }}' \
            --kmesh '${{ matrix.kmesh }}' \
            --handoff source_bundle/base/BULK_HANDOFF.json \
            --bulk-result source_bundle/base/BULK_CONVERGENCE_RESULT.json \
            --pw qe_bundle/bin/pw.x \
            --pseudo-dir qe_bundle/pseudos \
            --out "$case_root" \
            --np 2
          rc=$?
          set -e
          find "$case_root" -type d \( -name tmp -o -name '*.save' \) \
            -prune -exec rm -rf {} + 2>/dev/null || true
          find "$case_root" -type f \( \
            -name '*.wfc*' -o -name charge-density.dat -o -name data-file-schema.xml \
            \) -delete 2>/dev/null || true
          mapfile -d '' compact_files < <(
            find "$case_root" -type f \( \
              -name run_record.json -o -name 'cu001_*.in' -o -name 'cu001_*.out' \
              \) -print0 | sort -z
          )
          if (( ${#compact_files[@]} > 0 )); then
            printf '%s\0' "${compact_files[@]}" | xargs -0 sha256sum \
              > "$case_root/COMPACT_EVIDENCE.sha256"
          fi
          exit "$rc"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: na-cu001-c7-l13-v2-raw-v${{ matrix.vacuum }}_k${{ matrix.kmesh }}
          path: |
            l13_outputs/**/run_record.json
            l13_outputs/**/*.in
            l13_outputs/**/*.out
            l13_outputs/**/COMPACT_EVIDENCE.sha256
          retention-days: 30
          if-no-files-found: error

  l13-gate:
    needs: [prepare, l13-cases]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-base
          path: source_bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: na-cu001-c7-raw-slab-*
          path: source_records
          merge-multiple: true
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_C7_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: na-cu001-c7-l13-v2-raw-*
          path: l13_records
          merge-multiple: true

      - name: Independently resolve the strict layer holdout
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-numpy
          test "$(find source_records -type f -name run_record.json | wc -l)" -eq 64
          test "$(find source_records -type f -name 'cu001_*.in' | wc -l)" -eq 64
          test "$(find source_records -type f -name 'cu001_*.out' | wc -l)" -eq 64
          test "$(find l13_records -type f -name run_record.json | wc -l)" -eq 16
          test "$(find l13_records -type f -name 'cu001_*.in' | wc -l)" -eq 16
          test "$(find l13_records -type f -name 'cu001_*.out' | wc -l)" -eq 16
          mkdir -p l13_decision
          set +e
          python3 na_cu001_ci/slab_l13_extension_v1.py analyze \
            --source-records source_records \
            --extension-records l13_records \
            --source-result-out l13_decision/SOURCE_64_CLEAN_SLAB_RESULT.json \
            --out l13_decision/CLEAN_SLAB_L13_EXTENSION_RESULT.json \
            | tee l13_decision/CLEAN_SLAB_L13_EXTENSION_STDOUT.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Bind decision provenance and manifests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p l13_decision
          cp source_bundle/l13_provenance/SOURCE_C7_L13_PROVENANCE.json l13_decision/
          find source_records -type f \( \
            -name run_record.json -o -name 'cu001_*.in' -o -name 'cu001_*.out' \
            -o -name COMPACT_EVIDENCE.sha256 \
            \) -print0 | sort -z | xargs -0 sha256sum \
            > l13_decision/SOURCE_64_COMPACT_MANIFEST.sha256
          find l13_records -type f \( \
            -name run_record.json -o -name 'cu001_*.in' -o -name 'cu001_*.out' \
            -o -name COMPACT_EVIDENCE.sha256 \
            \) -print0 | sort -z | xargs -0 sha256sum \
            > l13_decision/L13_COMPACT_MANIFEST.sha256
          find l13_decision -type f -print0 | sort -z | xargs -0 sha256sum \
            > l13_decision/DECISION_MANIFEST.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: na-cu001-c7-l13-v2-extension-decision
          path: l13_decision
          retention-days: 90
          if-no-files-found: error

      - name: Enforce scientific decision
        if: always()
        shell: bash
        run: |
          test '${{ steps.analyze.outputs.rc }}' = '0'

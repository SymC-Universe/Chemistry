name: CO Cu111 PBE Stage A L26 larger-runner recovery v1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - '.github/workflows/co-cu111-pbe-stage-a-l26-large-runner-recovery-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: co-cu111-pbe-stage-a-l26-large-runner-recovery-v1
  cancel-in-progress: false

env:
  SOURCE_STAGE_A_RUN_ID: '31371043888'
  SOURCE_STAGE_A_COMMIT: 'd411a92c7a548524e7af598b909313f5b421faf9'
  SOURCE_ENGINE_ARTIFACT: 'co-cu111-pbe-stage-a-engine-v2'

  PRIOR_RECOVERY_RUN_ID: '31445411702'
  LARGE_RUNNER_SMOKE_RUN_ID: '31563024608'
  LARGE_RUNNER_SMOKE_JOB_ID: '94009144768'

  PROTOCOL: 'systems/co_cu111/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json'
  BUNDLE: 'systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json'
  FROZEN_RUNNER: 'systems/co_cu111/pbe_stage_a_runner_v1.py'
  RECOVERY_RUNNER: 'systems/co_cu111/pbe_stage_a_recovery_v1.py'
  RECOVERY_CONTRACT: 'systems/co_cu111/MECHANICAL_RECOVERY_CONTROLLER_v0.1.json'
  INFRA_HOLD: 'systems/co_cu111/STAGE_A_L26_MECHANICAL_INFRASTRUCTURE_HOLD_v0.1.json'

  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen science and L26 infrastructure hold
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile \
            "$FROZEN_RUNNER" \
            "$RECOVERY_RUNNER"

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          contract = json.loads(
              Path("systems/co_cu111/MECHANICAL_RECOVERY_CONTROLLER_v0.1.json").read_text()
          )
          hold = json.loads(
              Path("systems/co_cu111/STAGE_A_L26_MECHANICAL_INFRASTRUCTURE_HOLD_v0.1.json").read_text()
          )

          assert contract["schema"] == "co-cu111-stage-a-mechanical-recovery-v0.1"
          assert contract["status"] == "FROZEN_BEFORE_RECOVERY_RESULTS"
          assert contract["source_stage_a"]["run_id"] == 31371043888
          assert contract["source_stage_a"]["commit"] == "d411a92c7a548524e7af598b909313f5b421faf9"
          assert contract["frozen_inputs"]["mpi_ranks"] == 1
          assert contract["frozen_inputs"]["thread_environment"] == {
              "OMP_NUM_THREADS": 1,
              "OPENBLAS_NUM_THREADS": 1,
          }
          assert contract["provenance"]["scientific_settings_changed"] is False

          assert hold["schema"] == "co-cu111-stage-a-l26-mechanical-infrastructure-hold-v0.1"
          assert hold["status"] == "MECHANICAL_INFRASTRUCTURE_HOLD"
          assert hold["source_stage_a_run"] == 31371043888
          assert hold["recovery_run"] == 31445411702
          assert hold["standard_runner_eligible"] is False
          assert hold["same_runner_retry_forbidden"] is True
          assert hold["scientific_settings_changed"] is False

          failed = {
              row["member"]
              for row in hold["evidence"]["recovery_failures"]
          }
          assert failed == {"C1/L26", "C2/L26"}

          expected_blobs = {
              "systems/co_cu111/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json":
                  "2e1816ca8b1eda9fac3a97fe5eb3cd73f76de336",
              "systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json":
                  "4a23d19bbd4374e250582fb1d02419828a06eb5d",
              "systems/co_cu111/pbe_stage_a_runner_v1.py":
                  "13f457a7f8daaeb2ffccdb9fe6f01c1b0d3a1bdd",
              "systems/co_cu111/pbe_stage_a_recovery_v1.py":
                  "4463ec9ef3e4a4ffa8e8fc6d5bc1e0620a10e9ac",
              "systems/co_cu111/MECHANICAL_RECOVERY_CONTROLLER_v0.1.json":
                  "16923e4384420a8820442e8bcee738bc8eff75af",
              "systems/co_cu111/STAGE_A_L26_MECHANICAL_INFRASTRUCTURE_HOLD_v0.1.json":
                  "42a90598d11cb6cde8649841824e2cc023e94775",
          }

          for path, expected in expected_blobs.items():
              got = subprocess.check_output(
                  ["git", "hash-object", path],
                  text=True,
              ).strip()
              assert got == expected, (path, got, expected)

          print("FROZEN_L26_RESOURCE_ROUTE_VERIFIED")
          print("LARGER_RUNNER_SMOKE_RUN=31563024608")
          print("LARGER_RUNNER_SMOKE_JOB=94009144768")
          PY

      - name: Download exact source-run Stage A engine
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify source-run engine and frozen files
        shell: bash
        run: |
          set -euo pipefail

          sha256sum -c engine/meta/STAGE_A_ENGINE.sha256
          cmp "$PROTOCOL" engine/meta/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json
          cmp "$BUNDLE" engine/meta/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
          cmp "$FROZEN_RUNNER" engine/meta/pbe_stage_a_runner_v1.py

  recover-l26:
    needs: prepare
    runs-on: ubuntu-latest-m
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {cutoff: C1, box: 26, start: 0, end: 7}
          - {cutoff: C1, box: 26, start: 8, end: 15}
          - {cutoff: C1, box: 26, start: 16, end: 22}
          - {cutoff: C2, box: 26, start: 0, end: 7}
          - {cutoff: C2, box: 26, start: 8, end: 15}
          - {cutoff: C2, box: 26, start: 16, end: 22}

    steps:
      - uses: actions/checkout@v4

      - name: Record different execution resource class
        shell: bash
        run: |
          set -euo pipefail

          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "requested_runner_label=ubuntu-latest-m"
          echo "processors=$(nproc)"
          free -h

      - name: Install unchanged runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopenblas-dev \
            liblapack-dev \
            libfftw3-dev \
            libopenmpi-dev \
            openmpi-bin \
            python3-numpy

      - name: Download exact source-run Stage A engine
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ENGINE_ARTIFACT }}
          path: engine
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify exact frozen engine and science files
        shell: bash
        run: |
          set -euo pipefail

          sha256sum -c engine/meta/STAGE_A_ENGINE.sha256
          cmp "$PROTOCOL" engine/meta/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json
          cmp "$BUNDLE" engine/meta/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
          cmp "$FROZEN_RUNNER" engine/meta/pbe_stage_a_runner_v1.py

          chmod +x engine/bin/pw.x
          test -x engine/bin/pw.x

      - name: Attempt exact source-run seed reuse if an admissible artifact exists
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-v2-co-${{ matrix.cutoff }}-L${{ matrix.box }}
          path: seed
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Recover frozen L26 bond-point chunk
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p stageA

          python3 "$RECOVERY_RUNNER" co-chunk \
            --runner "$FROZEN_RUNNER" \
            --protocol "$PROTOCOL" \
            --bundle "$BUNDLE" \
            --contract "$RECOVERY_CONTRACT" \
            --pseudo-dir engine/pseudos \
            --pw engine/bin/pw.x \
            --cutoff-id '${{ matrix.cutoff }}' \
            --box '${{ matrix.box }}' \
            --start-index '${{ matrix.start }}' \
            --end-index '${{ matrix.end }}' \
            --seed-root seed \
            --out 'stageA/co_${{ matrix.cutoff }}_L${{ matrix.box }}'

      - name: Upload recoverable L26 chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-stage-a-l26-large-recovery-v1-${{ matrix.cutoff }}-L${{ matrix.box }}-i${{ matrix.start }}-${{ matrix.end }}
          path: stageA
          retention-days: 90
          if-no-files-found: warn

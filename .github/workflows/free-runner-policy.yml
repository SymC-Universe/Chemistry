name: GitHub-hosted runner policy

on:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-hosted-runner-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce personal-account standard-runner-only policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Hard personal-account infrastructure policy, frozen by user on
          # 2026-09-07 after unexpected larger-runner charges.
          # There are intentionally NO paid-runner exceptions.
          standard = re.compile(
              r"(?:ubuntu-(?:latest|24\.04|22\.04|20\.04)|"
              r"windows-(?:latest|2025|2022|2019)|"
              r"macos-(?:latest|15|14|13))"
          )

          violations = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              rel = path.as_posix()
              for line_number, line in enumerate(path.read_text().splitlines(), 1):
                  match = re.match(r"^\s*runs-on:\s*(.*?)\s*(?:#.*)?$", line)
                  if not match:
                      continue
                  label = match.group(1).strip().strip("'\"")
                  if not standard.fullmatch(label):
                      violations.append(f"{rel}:{line_number}: runs-on: {label}")

          if violations:
              raise SystemExit(
                  'NONSTANDARD_OR_PAID_RUNNER_BLOCKED\n' + '\n'.join(violations)
              )

          print('PERSONAL_ACCOUNT_STANDARD_RUNNERS_ONLY')
          print('PAID_RUNNER_EXCEPTIONS=0')
          print('GITHUB_HOSTED_RUNNER_POLICY_PASS')
          PY

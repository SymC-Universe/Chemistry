name: Na Cu001 C9 adsorption screen v1

on:
  workflow_dispatch:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/na-cu001-c9-adsorption-screen-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: na-cu001-c9-adsorption-screen-v1
  cancel-in-progress: false

env:
  SOURCE_C7_RUN_ID: '30949901790'
  SOURCE_C7_COMMIT: '8ca3f708537886050ef18210315e79a43595d3f3'
  SOURCE_BASE_ARTIFACT: 'na-cu001-c7-base'
  SOURCE_QE_ARTIFACT: 'na-cu001-c7-qe'
  PARITY_RUN_ID: '31230166557'
  PARITY_COMMIT: '66a3409469dd8559d11b145fb01c8e097bb693f2'
  PARITY_ARTIFACT: 'na-cu001-c7-electrostatic-consistency-recovery-v1'
  CLEAN_RUN_ID: '31292109177'
  CLEAN_COMMIT: 'd1a61eed0f75673ac5b4b451a2905bdcabc97c22'
  CLEAN_ARTIFACT: 'na-cu001-c8-clean-surface-timeout-recovery-v5'
  CASE_MAX_SECONDS: '18000'

jobs:
  adsorption-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mobility: [primary, expanded]
        site: [hollow, bridge, top]
        height: ['2.0', '2.5', '3.0']
    steps:
      - name: Checkout adsorption control
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout exact frozen C7 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_C7_COMMIT }}
          path: source_code

      - name: Verify frozen case contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source_code rev-parse HEAD)" = "$SOURCE_C7_COMMIT"
          python3 -m py_compile control/na_cu001_ci/adsorption_screen_case_v1.py source_code/na_cu001_ci/closure_engine.py source_code/na_cu001_ci/closure_engine_v2.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('source_code/na_cu001_ci/method_protocol_v0.2.json').read_text())
          s=p['surface']; e=s['registered_electrostatic_convention']
          assert p['schema']=='na-cu001-method-protocol-v0.2'
          assert p['status']=='FROZEN_BEFORE_DOWNSTREAM_RESULTS'
          assert float(s['force_tolerance_ev_per_angstrom'])==0.02
          assert s['adsorption_supercell']==[4,4]
          assert float(s['coverage_ml'])==0.0625
          assert s['adsorption_starts']['sites']==['hollow','bridge','top']
          assert [float(x) for x in s['adsorption_starts']['heights_angstrom']]==[2.0,2.5,3.0]
          assert set(s['mobility_models'])=={'primary','expanded'}
          assert e['assume_isolated']=='esm' and e['esm_bc']=='bc1'
          assert e['scope']=='all 64 slab cases and all downstream surface calculations'
          PY

      - name: Install QE runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gh openmpi-bin libopenmpi-dev libopenblas-dev liblapack-dev libfftw3-dev python3-numpy

      - name: Verify frozen upstream runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run_meta
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_C7_RUN_ID}" > run_meta/source.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PARITY_RUN_ID}" > run_meta/parity.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CLEAN_RUN_ID}" > run_meta/clean.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          source=json.loads(Path('run_meta/source.json').read_text())
          parity=json.loads(Path('run_meta/parity.json').read_text())
          clean=json.loads(Path('run_meta/clean.json').read_text())
          # The frozen C7 source run completed with an overall run-level failure
          # after producing the accepted 64/64 raw slab source artifacts. Bind
          # its exact historical state here; scientific admissibility is carried
          # by the independently audited downstream handoffs and artifact hashes.
          assert source['status']=='completed' and source['conclusion']=='failure' and source['head_sha']==os.environ['SOURCE_C7_COMMIT']
          assert parity['status']=='completed' and parity['conclusion']=='success' and parity['head_sha']==os.environ['PARITY_COMMIT']
          assert clean['status']=='completed' and clean['conclusion']=='success' and clean['head_sha']==os.environ['CLEAN_COMMIT']
          PY

      - name: Download frozen C7 base
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_BASE_ARTIFACT }}
          path: base_upstream
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_C7_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download frozen C7 QE bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_QE_ARTIFACT }}
          path: qe_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_C7_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download electrostatic PASS evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT }}
          path: parity_upstream
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.PARITY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download definitive clean-surface PASS
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CLEAN_ARTIFACT }}
          path: clean_upstream
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.CLEAN_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Bind adsorption inputs and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bound
          clean=$(find clean_upstream -type f -name RELAXED_CLEAN_SURFACE_HANDOFF.json -print -quit)
          parity=$(find parity_upstream -type f -name ELECTROSTATIC_CONSISTENCY.json -print -quit)
          na=$(find base_upstream -type f -name NA_PSEUDO_HANDOFF.json -print -quit)
          test -n "$clean" && test -n "$parity" && test -n "$na"
          cp "$clean" bound/RELAXED_CLEAN_SURFACE_HANDOFF.json
          cp "$parity" bound/ELECTROSTATIC_CONSISTENCY.json
          cp "$na" bound/NA_PSEUDO_HANDOFF.json
          test "$(tr -d '\r\n' < base_upstream/COMPUTATIONAL_SOURCE_COMMIT.txt)" = "$SOURCE_C7_COMMIT"
          chmod +x qe_bundle/bin/pw.x
          sha256sum -c qe_bundle/meta/engine_binaries.sha256
          echo 'b31028b2bae60cd9903260715a49b4c6d2b6dc654558c87023fa5206e427a16d  qe_bundle/pseudos/Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf' | sha256sum -c -
          echo '863f805310682887de6f2754858a1d3d2d3190107ea5b82aa9d0ab5ed5599139  qe_bundle/pseudos/Na.paw.pbe.z_9.ld1.psl.v0.2.upf' | sha256sum -c -
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          c=json.loads(Path('bound/RELAXED_CLEAN_SURFACE_HANDOFF.json').read_text())
          p=json.loads(Path('bound/ELECTROSTATIC_CONSISTENCY.json').read_text())
          n=json.loads(Path('bound/NA_PSEUDO_HANDOFF.json').read_text())
          assert c['schema']=='na-cu001-relaxed-clean-surface-handoff-v0.2' and c['status']=='PASS'
          assert c['method']['electrostatics']=={'assume_isolated':'esm','esm_bc':'bc1'}
          assert c['method']['coordinate_convention']=={'atomic_position_card':'angstrom','origin':'cartesian_z_zero'}
          assert len(c['atoms'])==11 and float(c['max_unconstrained_force_ev_per_angstrom'])<=0.02
          assert all(c['pass_checks'].values()) and c['next_gate']=='adsorption_site_screening'
          assert c['provenance']['source_c7_commit']==os.environ['SOURCE_C7_COMMIT']
          assert c['provenance']['electrostatic_consistency_commit']==os.environ['PARITY_COMMIT']
          assert c['provenance']['control_commit']==os.environ['CLEAN_COMMIT']
          assert c['provenance']['scientific_settings_changed'] is False
          assert p['schema']=='na-cu001-electrostatic-consistency-v0.3' and p['status']=='PASS'
          assert p['selected_convention']=={'assume_isolated':'esm','esm_bc':'bc1'}
          assert n['schema']=='na-cu001-na-pseudopotential-handoff-v0.2' and n['status']=='PASS'
          assert n['selected']['sha256']=='863f805310682887de6f2754858a1d3d2d3190107ea5b82aa9d0ab5ed5599139'
          assert n['selected_mixed_settings']['ecutwfc_ry']==90.0 and n['selected_mixed_settings']['ecutrho_ry']==270.0
          assert n['next_gate']=='adsorption_site_screening'
          PY
          sha256sum bound/RELAXED_CLEAN_SURFACE_HANDOFF.json bound/ELECTROSTATIC_CONSISTENCY.json bound/NA_PSEUDO_HANDOFF.json source_code/na_cu001_ci/method_protocol_v0.2.json control/na_cu001_ci/adsorption_screen_case_v1.py > bound/ADSORPTION_CASE_INPUTS.sha256

      - name: Run registered adsorption case
        id: adsorption
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ matrix.mobility }}_${{ matrix.site }}_${{ matrix.height }}'
          mkdir -p "case_output/$tag"
          set +e
          python3 control/na_cu001_ci/adsorption_screen_case_v1.py \
            --source-dir source_code/na_cu001_ci \
            --protocol source_code/na_cu001_ci/method_protocol_v0.2.json \
            --clean-handoff bound/RELAXED_CLEAN_SURFACE_HANDOFF.json \
            --na-handoff bound/NA_PSEUDO_HANDOFF.json \
            --parity-handoff bound/ELECTROSTATIC_CONSISTENCY.json \
            --pw qe_bundle/bin/pw.x \
            --pseudo-dir qe_bundle/pseudos \
            --mobility '${{ matrix.mobility }}' \
            --site '${{ matrix.site }}' \
            --height '${{ matrix.height }}' \
            --out-dir "case_output/$tag" \
            --np 1 \
            --max-seconds "$CASE_MAX_SECONDS" \
            --source-run-id "$SOURCE_C7_RUN_ID" \
            --source-commit "$SOURCE_C7_COMMIT" \
            --clean-run-id "$CLEAN_RUN_ID" \
            --clean-commit "$CLEAN_COMMIT" \
            --parity-run-id "$PARITY_RUN_ID" \
            --parity-commit "$PARITY_COMMIT" \
            --control-commit "$GITHUB_SHA"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "case_output/$tag/CASE_EXIT_CODE.txt"
          cp bound/ADSORPTION_CASE_INPUTS.sha256 "case_output/$tag/ADSORPTION_CASE_INPUTS.sha256"
          find "case_output/$tag" -type d -name tmp -prune -exec rm -rf {} + 2>/dev/null || true
          find "case_output/$tag" -type f \( -name '*.in' -o -name '*.out' -o -name '*.json' \) -print0 | sort -z | xargs -0 -r sha256sum > "case_output/$tag/ADSORPTION_RAW_MANIFEST.sha256"
          exit 0

      - name: Upload adsorption PASS or checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c9-ads-${{ matrix.mobility }}-${{ matrix.site }}-${{ matrix.height }}
          path: case_output
          retention-days: 90
          if-no-files-found: error

      - name: Enforce case result
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ matrix.mobility }}_${{ matrix.site }}_${{ matrix.height }}'
          rc=$(cat "case_output/$tag/CASE_EXIT_CODE.txt")
          if [[ "$rc" -eq 75 ]]; then
            echo 'Mechanical adsorption checkpoint reached before the frozen 0.02 eV/A BFGS gate converged.' >&2
            exit 75
          fi
          test "$rc" -eq 0
          python3 - <<PY
          import json
          from pathlib import Path
          r=json.loads(Path('case_output/$tag/run_record.json').read_text())
          assert r['schema']=='na-cu001-adsorption-case-v0.2' and r['status']=='PASS'
          assert r['pass_checks']['bfgs_finished'] is True
          assert r['pass_checks']['actual_total_force_block_present'] is True
          assert r['pass_checks']['max_force_le_tolerance'] is True
          assert r['provenance']['scientific_settings_changed'] is False
          PY

  adsorption-gate:
    needs: adsorption-cases
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frozen C7 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_C7_COMMIT }}
          path: source_code

      - name: Install analysis dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-numpy

      - name: Download all converged adsorption records
        uses: actions/download-artifact@v4
        with:
          pattern: na-cu001-c9-ads-*
          path: ads_records
          merge-multiple: true

      - name: Download frozen C7 base
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_BASE_ARTIFACT }}
          path: base_upstream
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_C7_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download electrostatic PASS evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT }}
          path: parity_upstream
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.PARITY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download definitive clean-surface PASS
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CLEAN_ARTIFACT }}
          path: clean_upstream
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.CLEAN_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Analyze complete preregistered adsorption matrix
        shell: bash
        run: |
          set -euo pipefail
          test "$(find ads_records -type f -name run_record.json | wc -l)" -eq 18
          mkdir -p bound stage6
          cp "$(find clean_upstream -type f -name RELAXED_CLEAN_SURFACE_HANDOFF.json -print -quit)" bound/RELAXED_CLEAN_SURFACE_HANDOFF.json
          cp "$(find parity_upstream -type f -name ELECTROSTATIC_CONSISTENCY.json -print -quit)" bound/ELECTROSTATIC_CONSISTENCY.json
          cp "$(find base_upstream -type f -name NA_PSEUDO_HANDOFF.json -print -quit)" bound/NA_PSEUDO_HANDOFF.json
          set +e
          python3 source_code/na_cu001_ci/closure_engine_v2.py adsorption-analyze \
            --protocol source_code/na_cu001_ci/method_protocol_v0.2.json \
            --records ads_records \
            --clean-handoff bound/RELAXED_CLEAN_SURFACE_HANDOFF.json \
            --na-handoff bound/NA_PSEUDO_HANDOFF.json \
            --parity-handoff bound/ELECTROSTATIC_CONSISTENCY.json \
            --out stage6/ADSORPTION_SITE_HANDOFF.json
          rc=$?
          set -e
          printf '%s\n' "$rc" > stage6/ADSORPTION_GATE_EXIT_CODE.txt
          find ads_records -type f -name run_record.json -print0 | sort -z | xargs -0 sha256sum > stage6/ADSORPTION_CASE_RECORDS.sha256
          exit 0

      - name: Upload adsorption gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c9-adsorption-site-handoff-v1
          path: stage6
          retention-days: 90
          if-no-files-found: error

      - name: Enforce adsorption mechanism gate
        shell: bash
        run: |
          set -euo pipefail
          rc=$(cat stage6/ADSORPTION_GATE_EXIT_CODE.txt)
          test "$rc" -eq 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stage6/ADSORPTION_SITE_HANDOFF.json').read_text())
          assert r['schema']=='na-cu001-adsorption-site-handoff-v0.2' and r['status']=='PASS'
          assert set(r['mobility_analyses'])=={'primary','expanded'}
          assert all(v['all_starts_converged'] for v in r['mobility_analyses'].values())
          assert all(v['mechanism_state']=='REGISTERED_HOLLOW_ROUTE' for v in r['mobility_analyses'].values())
          assert r['next_gate']=='endpoint_geometry_verification'
          PY
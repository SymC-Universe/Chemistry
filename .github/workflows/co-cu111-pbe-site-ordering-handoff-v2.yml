name: CO Cu111 PBE site ordering handoff v2

on:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - 'systems/co_cu111/SYSTEM2_PBE_SITE_ORDERING_START_v0.2.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: co-cu111-pbe-site-ordering-handoff-v2
  cancel-in-progress: false

env:
  HANDOFF: systems/co_cu111/SYSTEM2_PBE_SITE_ORDERING_HANDOFF_v0.2.json
  SURFACE_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_SITE_ORDERING_PROTOCOL_v0.1.json
  RUNNER: systems/co_cu111/pbe_surface_site_ordering_v1.py
  TEST: systems/co_cu111/test_pbe_surface_site_ordering_v1.py
  BUNDLE: systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
  METHOD_PROTOCOL: systems/co_cu111/SYSTEM2_METHOD_SELECTION_PROTOCOL_v0.1.json
  STAGE_A_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json
  STAGE_A_EXTENSION: systems/co_cu111/SYSTEM2_PBE_STAGE_A_NUMERICAL_EXTENSION_v0.1.json
  EXT_GATE_RUN_ID: '33390385236'
  EXT_GATE_ARTIFACT: co-cu111-l15-native-postrelax-gate-v1
  STAGE_A_RUN_ID: '31887006685'
  STAGE_A_ARTIFACT: co-cu111-pbe-stage-a-numerical-extension-decision-v1
  ENGINE_RUN_ID: '31371043888'
  ENGINE_ARTIFACT: co-cu111-pbe-stage-a-engine-v2
  SOURCE_SURFACE_RUN_ID: '31922544540'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  prepare:
    name: verify-L15-PASS-and-build-site-handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      gate_status: ${{ steps.gate.outputs.status }}
      selected_case: ${{ steps.gate.outputs.selected_case }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify unchanged frozen repository and prospective handoff contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RUNNER" "$TEST"
          python3 "$RUNNER" self-test --protocol "$SURFACE_PROTOCOL"
          python3 "$TEST" -v
          test "$(git hash-object "$METHOD_PROTOCOL")" = "44f0514a2c3421139d33ad4094fac541ee4bbd9f"
          test "$(git hash-object "$STAGE_A_PROTOCOL")" = "2e1816ca8b1eda9fac3a97fe5eb3cd73f76de336"
          test "$(git hash-object "$BUNDLE")" = "4a23d19bbd4374e250582fb1d02419828a06eb5d"
          test "$(git hash-object "$STAGE_A_EXTENSION")" = "fb5bae726bb35bfaa10106714250d3e0ad458307"
          test "$(git hash-object "$SURFACE_PROTOCOL")" = "95ced1096e4dbc3c0a75c5a4f7aa6b9693cdb924"
          test "$(git hash-object "$RUNNER")" = "d65050b77527de8453d42a77c2c45a0629a07fd3"
          test "$(git hash-object "$TEST")" = "b9c065af878713f128223b14b7b60ead97cae0f6"
          echo '1bb01d81beade1642da46449770638967a103f43ee63081b3ae5b8509f1c156f  '$SURFACE_PROTOCOL | sha256sum -c -
          echo 'f5dd93f6b714c061fc664c045884fc4cd3975e7db01154f667221df158689d6b  '$RUNNER | sha256sum -c -
          echo '0f15e3ad0ffcbb622273b9ea394a0c04336403ecdbbde54948698e4c036f76fe  '$TEST | sha256sum -c -
          python3 - <<'PY'
          import json
          h=json.load(open('systems/co_cu111/SYSTEM2_PBE_SITE_ORDERING_HANDOFF_v0.2.json'))
          assert h['schema']=='co-cu111-pbe-site-ordering-handoff-v0.2'
          assert h['status']=='FROZEN_BEFORE_L15_EXTENSION_GATE_RESULT'
          a=h['authoritative_current_audit']
          assert a['workflow_run_id']==33390385236
          assert a['workflow_head_sha']=='264585c766141a55d90f8e9ae33204787a71c9a6'
          assert a['protocol_sha256']=='518583a18ec5a26b442523601e325b2b525fd5a374f37c255eb9c5fff163ebd7'
          assert a['required_gate_artifact']=='co-cu111-l15-native-postrelax-gate-v1'
          assert a['required_gate_schema']=='co-cu111-pbe-surface-convergence-extension-gate-v0.1'
          assert a['required_gate_status']=='CLEAN_SURFACE_PASS'
          assert a['required_next_gate']=='PBE_CO_SITE_ORDERING_SCREEN'
          assert h['compatibility_bridge']['reinterpretation_authorized'] is False
          assert h['compatibility_bridge']['candidate_reselection_authorized'] is False
          assert h['provenance']['kinetic_inputs_used'] is False
          assert h['provenance']['scientific_settings_changed'] is False
          assert h['provenance']['clean_surface_recomputation_authorized'] is False
          print('L15_TO_SITE_ORDERING_HANDOFF_CONTRACT_VERIFIED')
          PY

      - name: Verify explicit start marker when push-triggered
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='systems/co_cu111/SYSTEM2_PBE_SITE_ORDERING_START_v0.2.json'
          r=json.load(open(p))
          assert r['schema']=='co-cu111-pbe-site-ordering-start-v0.2'
          assert r['status']=='AUTHORIZED_BY_VERIFIED_L15_CLEAN_SURFACE_PASS'
          assert r['source_run_id']==33390385236
          assert r['source_artifact']=='co-cu111-l15-native-postrelax-gate-v1'
          assert r['scientific_settings_changed'] is False
          assert r['kinetic_inputs_used'] is False
          print('EXPLICIT_GATE_START_MARKER_VERIFIED')
          PY

      - name: Download authoritative L15 extension gate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXT_GATE_ARTIFACT }}
          path: extension_gate
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.EXT_GATE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Require L15 clean-surface PASS and build non-reinterpreting compatibility bridge
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clean_gate
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          src=Path('extension_gate/SURFACE_CONVERGENCE_EXTENSION_GATE.json')
          ext=json.loads(src.read_text())
          assert ext['schema']=='co-cu111-pbe-surface-convergence-extension-gate-v0.1'
          assert ext['status']=='CLEAN_SURFACE_PASS'
          assert ext['next_gate']=='PBE_CO_SITE_ORDERING_SCREEN'
          assert ext['extension_reference_audit_pass'] is True
          assert ext['candidates_adjudicated'] is True
          assert ext.get('selected') and ext['selected'].get('case_id')
          prov=ext['provenance']
          assert prov['force_gate_changed'] is False
          assert prov['reproduction_gate_changed'] is False
          assert prov['surface_excess_gate_changed'] is False
          assert prov['candidate_selection_rule_changed'] is False
          assert prov['scientific_settings_changed'] is False
          assert prov['scientific_settings_changed_after_extension_freeze'] is False
          assert prov['kinetic_inputs_used'] is False
          digest=hashlib.sha256(src.read_bytes()).hexdigest()
          bridge={
            'schema':'co-cu111-pbe-clean-surface-gate-v0.1',
            'status':ext['status'],
            'reference_audit_pass':ext['extension_reference_audit_pass'],
            'reference_audit_delta_ev_per_surface_atom':ext['extension_reference_audit_delta_ev_per_surface_atom'],
            'reference':ext['extension_reference'],
            'audit':ext['extension_audit'],
            'candidates':ext['candidates'],
            'selected':ext['selected'],
            'next_gate':ext['next_gate'],
            'extension_gate_context':{
              'source_schema':ext['schema'],
              'source_sha256':digest,
              'prior_failure':ext['prior_failure'],
              'extension_reference_audit_threshold_ev_per_surface_atom':ext['extension_reference_audit_threshold_ev_per_surface_atom'],
              'candidate_force_reaudit_ev_per_angstrom':ext['candidate_force_reaudit_ev_per_angstrom'],
              'source_provenance':ext['provenance'],
              'bridge_reinterpreted_values':False,
              'candidate_reselected':False,
              'thresholds_changed':False
            },
            'provenance':{
              'extension_gate_sha256':digest,
              'surface_protocol_sha256':prov['surface_protocol_sha256'],
              'stage_a_result_sha256':prov['stage_a_result_sha256'],
              'scientific_settings_changed':False,
              'kinetic_inputs_used':False
            }
          }
          Path('clean_gate/CLEAN_SURFACE_GATE.json').write_text(json.dumps(bridge,indent=2,sort_keys=True)+'\n')
          print('AUTHORITATIVE_EXTENSION_GATE_SHA256='+digest)
          print('SELECTED_CASE='+ext['selected']['case_id'])
          print('L13_L15_DELTA_EV_PER_SURFACE_ATOM='+str(ext['extension_reference_audit_delta_ev_per_surface_atom']))
          PY
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('clean_gate/CLEAN_SURFACE_GATE.json'))
          print('status='+r['status'])
          print('selected_case='+r['selected']['case_id'])
          PY

      - name: Download immutable original clean candidates
        uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-pbe-clean-v1-*
          path: clean_candidates
          merge-multiple: false
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_SURFACE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify selected clean candidate exists exactly once
        shell: bash
        env:
          SELECTED_CASE: ${{ steps.gate.outputs.selected_case }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          selected=os.environ['SELECTED_CASE']
          hits=[]
          for p in Path('clean_candidates').rglob('summary.json'):
              try: s=json.loads(p.read_text())
              except Exception: continue
              if s.get('case_id')==selected:
                  hits.append((p,s))
          assert len(hits)==1, (selected, [str(x[0]) for x in hits])
          p,s=hits[0]
          assert s.get('status')=='COMPLETE'
          assert s.get('role')=='candidate'
          assert s.get('mechanical_pass') is True
          assert s.get('provenance',{}).get('kinetic_inputs_used') is False
          print('SELECTED_CLEAN_CASE_VERIFIED='+selected)
          print('SELECTED_SUMMARY='+str(p))
          PY

      - name: Download exact Stage A engine
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify exact Stage A engine
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c engine/meta/STAGE_A_ENGINE.sha256
          cmp "$STAGE_A_PROTOCOL" engine/meta/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json
          cmp "$BUNDLE" engine/meta/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json

      - name: Preserve exact L15 extension gate alongside compatibility bridge
        shell: bash
        run: |
          set -euo pipefail
          cp "$HANDOFF" clean_gate/SYSTEM2_PBE_SITE_ORDERING_HANDOFF_v0.2.json
          sha256sum extension_gate/SURFACE_CONVERGENCE_EXTENSION_GATE.json clean_gate/CLEAN_SURFACE_GATE.json "$HANDOFF" > clean_gate/L15_TO_SITE_ORDERING_HANDOFF.sha256

      - name: Publish verified handoff inputs
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-site-ordering-handoff-inputs-v2
          path: |
            extension_gate
            clean_gate
            clean_candidates
            engine
          retention-days: 90
          if-no-files-found: error

  site_relax:
    name: relax-${{ matrix.site }}
    needs: prepare
    if: ${{ needs.prepare.outputs.gate_status == 'CLEAN_SURFACE_PASS' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site: [top, bridge, fcc_hollow, hcp_hollow]
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-site-ordering-handoff-inputs-v2
          path: handoff_inputs
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Relax frozen adsorption site and independently reproduce primary energy
        shell: bash
        run: |
          set -euo pipefail
          chmod +x handoff_inputs/engine/bin/pw.x
          python3 "$RUNNER" site-run \
            --protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --clean-gate handoff_inputs/clean_gate/CLEAN_SURFACE_GATE.json \
            --clean-root handoff_inputs/clean_candidates \
            --bundle "$BUNDLE" \
            --pseudo-dir handoff_inputs/engine/pseudos \
            --pw handoff_inputs/engine/bin/pw.x \
            --site '${{ matrix.site }}' \
            --out 'site_primary/${{ matrix.site }}'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-site-primary-handoff-v2-${{ matrix.site }}
          path: site_primary/${{ matrix.site }}
          retention-days: 90
          if-no-files-found: error

  site_audit:
    name: audit-${{ matrix.site }}
    needs: [prepare, site_relax]
    if: ${{ needs.prepare.outputs.gate_status == 'CLEAN_SURFACE_PASS' && needs.site_relax.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site: [top, bridge, fcc_hollow, hcp_hollow]
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-site-ordering-handoff-inputs-v2
          path: handoff_inputs
      - uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-site-primary-handoff-v2-${{ matrix.site }}
          path: primary
      - name: Run unchanged independent k6 site-energy audit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x handoff_inputs/engine/bin/pw.x
          python3 "$RUNNER" site-audit \
            --protocol "$SURFACE_PROTOCOL" \
            --bundle "$BUNDLE" \
            --pseudo-dir handoff_inputs/engine/pseudos \
            --pw handoff_inputs/engine/bin/pw.x \
            --primary primary/summary.json \
            --out 'site_audit/${{ matrix.site }}'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-site-audit-handoff-v2-${{ matrix.site }}
          path: site_audit/${{ matrix.site }}
          retention-days: 90
          if-no-files-found: error

  finalize:
    name: finalize-site-ordering
    needs: [prepare, site_relax, site_audit]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.gate_status == 'CLEAN_SURFACE_PASS' && needs.site_relax.result == 'success' && needs.site_audit.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-site-ordering-handoff-inputs-v2
          path: handoff_inputs
      - uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-pbe-site-primary-handoff-v2-*
          path: site_collected/primary
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-pbe-site-audit-handoff-v2-*
          path: site_collected/audit
          merge-multiple: false
      - name: Finalize unchanged site-ordering decision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          python3 "$RUNNER" finalize \
            --protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --clean-gate handoff_inputs/clean_gate/CLEAN_SURFACE_GATE.json \
            --site-root site_collected \
            --out final/PBE_SURFACE_SITE_ORDERING_RESULT.json \
            > final/PBE_SURFACE_SITE_ORDERING_STDOUT.txt
          cat final/PBE_SURFACE_SITE_ORDERING_STDOUT.txt
          cp handoff_inputs/extension_gate/SURFACE_CONVERGENCE_EXTENSION_GATE.json final/SURFACE_CONVERGENCE_EXTENSION_GATE.json
          cp handoff_inputs/clean_gate/CLEAN_SURFACE_GATE.json final/CLEAN_SURFACE_GATE_COMPATIBILITY_BRIDGE.json
          sha256sum \
            "$HANDOFF" "$METHOD_PROTOCOL" "$STAGE_A_PROTOCOL" "$STAGE_A_EXTENSION" "$BUNDLE" \
            "$SURFACE_PROTOCOL" "$RUNNER" \
            stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            handoff_inputs/extension_gate/SURFACE_CONVERGENCE_EXTENSION_GATE.json \
            handoff_inputs/clean_gate/CLEAN_SURFACE_GATE.json \
            final/PBE_SURFACE_SITE_ORDERING_RESULT.json \
            > final/SITE_ORDERING_HANDOFF_INPUTS_AND_RESULT.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-site-ordering-handoff-decision-v2
          path: final
          retention-days: 90
          if-no-files-found: error

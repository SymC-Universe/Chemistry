name: Na Cu001 C8 clean surface timeout recovery v1

on:
  workflow_dispatch:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - 'na_cu001_ci/clean_surface_timeout_recovery_v1.py'
      - '.github/workflows/na-cu001-c8-clean-surface-timeout-recovery-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: na-cu001-c8-clean-surface-timeout-recovery-v1
  cancel-in-progress: false

env:
  SOURCE_C7_RUN_ID: '30949901790'
  SOURCE_C7_COMMIT: '8ca3f708537886050ef18210315e79a43595d3f3'
  PARITY_RUN_ID: '31230166557'
  PARITY_COMMIT: '66a3409469dd8559d11b145fb01c8e097bb693f2'
  PARITY_ARTIFACT: 'na-cu001-c7-electrostatic-consistency-recovery-v1'
  ORIGINAL_CLEAN_RUN_ID: '31230183860'
  ORIGINAL_CLEAN_COMMIT: '3cd72619a5cbf4b6d2b428525ede75bd9812fd06'
  ORIGINAL_CLEAN_ARTIFACT: 'na-cu001-c8-clean-surface-recovery-v1'

jobs:
  continue-clean-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout timeout-recovery control commit
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout exact frozen C7 source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_C7_COMMIT }}
          path: source_code

      - name: Verify frozen recovery control
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source_code rev-parse HEAD)" = "$SOURCE_C7_COMMIT"
          python3 -m py_compile \
            control/na_cu001_ci/clean_surface_centered_v1.py \
            control/na_cu001_ci/clean_surface_timeout_recovery_v1.py \
            source_code/na_cu001_ci/closure_engine.py \
            source_code/na_cu001_ci/closure_engine_v2.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('source_code/na_cu001_ci/method_protocol_v0.2.json').read_text())
          assert p['schema']=='na-cu001-method-protocol-v0.2'
          assert p['status']=='FROZEN_BEFORE_DOWNSTREAM_RESULTS'
          assert float(p['surface']['force_tolerance_ev_per_angstrom'])==0.02
          assert float(p['surface']['energy_reproduction_tolerance_ev'])==0.001
          assert p['surface']['registered_electrostatic_convention']['assume_isolated']=='esm'
          assert p['surface']['registered_electrostatic_convention']['esm_bc']=='bc1'
          PY

      - name: Install QE runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gh openmpi-bin libopenmpi-dev libopenblas-dev liblapack-dev libfftw3-dev python3-numpy

      - name: Verify original clean timeout and parity PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run_meta
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGINAL_CLEAN_RUN_ID}" > run_meta/original_clean_run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGINAL_CLEAN_RUN_ID}/jobs?filter=latest&per_page=100" > run_meta/original_clean_jobs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PARITY_RUN_ID}" > run_meta/parity_run.json
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          clean=json.loads(Path('run_meta/original_clean_run.json').read_text())
          parity=json.loads(Path('run_meta/parity_run.json').read_text())
          jobs=json.loads(Path('run_meta/original_clean_jobs.json').read_text())['jobs']
          assert clean['status']=='completed' and clean['conclusion']=='cancelled'
          assert clean['head_sha']==os.environ['ORIGINAL_CLEAN_COMMIT']
          assert parity['status']=='completed' and parity['conclusion']=='success'
          assert parity['head_sha']==os.environ['PARITY_COMMIT']
          matches=[j for j in jobs if j['name']=='clean-surface']
          assert len(matches)==1 and matches[0]['conclusion']=='cancelled'
          steps={s['name']:s for s in matches[0]['steps']}
          assert steps['Verify recovered parity and QE provenance']['conclusion']=='success'
          assert steps['Execute centered clean-surface gate']['conclusion']=='cancelled'
          started=datetime.fromisoformat(matches[0]['started_at'].replace('Z','+00:00'))
          completed=datetime.fromisoformat(matches[0]['completed_at'].replace('Z','+00:00'))
          assert (completed-started).total_seconds() >= 21500
          PY

      - name: Download interrupted clean-surface checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ORIGINAL_CLEAN_ARTIFACT }}
          path: partial_clean
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.ORIGINAL_CLEAN_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download definitive electrostatic PASS evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT }}
          path: parity_upstream
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.PARITY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download original C7 QE bundle
        uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-qe
          path: qe_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_C7_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify checkpoint scope and immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bound
          partial_input=$(find partial_clean -type f -path '*/clean_raw/relax/clean_relax.in' -print -quit)
          partial_output=$(find partial_clean -type f -path '*/clean_raw/relax/clean_relax.out' -print -quit)
          parity=$(find parity_upstream -type f -name ELECTROSTATIC_CONSISTENCY.json -print -quit)
          slab=$(find parity_upstream -type f -name SLAB_HANDOFF.json -print -quit)
          test -n "$partial_input" && test -n "$partial_output" && test -n "$parity" && test -n "$slab"
          cp "$parity" bound/ELECTROSTATIC_CONSISTENCY.json
          cp "$slab" bound/SLAB_HANDOFF.json
          cp "$partial_input" bound/INTERRUPTED_CLEAN_RELAX.in
          cp "$partial_output" bound/INTERRUPTED_CLEAN_RELAX.out
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=json.loads(Path('bound/ELECTROSTATIC_CONSISTENCY.json').read_text())
          s=json.loads(Path('bound/SLAB_HANDOFF.json').read_text())
          assert p['schema']=='na-cu001-electrostatic-consistency-v0.3' and p['status']=='PASS'
          assert p['selected_slab']=={'layers':11,'vacuum_angstrom':12.0,'kmesh_inplane':16}
          assert p['selected_convention']=={'assume_isolated':'esm','esm_bc':'bc1'}
          assert p['coordinate_convention']=={'atomic_position_card':'angstrom','origin':'cartesian_z_zero'}
          assert float(p['tolerance_mev_per_surface_atom'])==1.0
          assert p['pass_checks']['periodic_diagnostic_nonselecting'] is True
          assert s['status']=='PASS'
          inp=Path('bound/INTERRUPTED_CLEAN_RELAX.in').read_text()
          out=Path('bound/INTERRUPTED_CLEAN_RELAX.out').read_text(errors='replace')
          assert "calculation = 'relax'" in inp
          assert "assume_isolated = 'esm'" in inp and "esm_bc = 'bc1'" in inp
          assert 'ATOMIC_POSITIONS angstrom' in inp
          assert '90.00000000' in inp and '270.00000000' in inp
          assert re.search(r'^16 16 1 0 0 0$', inp, re.M)
          assert 'JOB DONE.' not in out and 'End of BFGS Geometry Optimization' not in out
          assert 'number of bfgs steps    =   5' in out
          PY
          chmod +x qe_bundle/bin/pw.x
          sha256sum -c qe_bundle/meta/engine_binaries.sha256
          echo 'b31028b2bae60cd9903260715a49b4c6d2b6dc654558c87023fa5206e427a16d  qe_bundle/pseudos/Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf' | sha256sum -c -
          sha256sum bound/INTERRUPTED_CLEAN_RELAX.in bound/INTERRUPTED_CLEAN_RELAX.out bound/ELECTROSTATIC_CONSISTENCY.json bound/SLAB_HANDOFF.json > bound/TIMEOUT_RECOVERY_INPUTS.sha256

      - name: Continue last accepted clean geometry and enforce frozen gate
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clean_recovery
          set +e
          python3 control/na_cu001_ci/clean_surface_timeout_recovery_v1.py \
            --source-dir source_code/na_cu001_ci \
            --control-dir control/na_cu001_ci \
            --partial-output bound/INTERRUPTED_CLEAN_RELAX.out \
            --partial-input bound/INTERRUPTED_CLEAN_RELAX.in \
            --slab-handoff bound/SLAB_HANDOFF.json \
            --parity-handoff bound/ELECTROSTATIC_CONSISTENCY.json \
            --protocol source_code/na_cu001_ci/method_protocol_v0.2.json \
            --pw qe_bundle/bin/pw.x \
            --pseudo-dir qe_bundle/pseudos \
            --out-dir clean_recovery/raw \
            --out clean_recovery/RELAXED_CLEAN_SURFACE_HANDOFF.json \
            --np 2 \
            --max-seconds 12000 \
            --source-run-id "$SOURCE_C7_RUN_ID" \
            --source-commit "$SOURCE_C7_COMMIT" \
            --parity-run-id "$PARITY_RUN_ID" \
            --parity-commit "$PARITY_COMMIT" \
            --original-clean-run-id "$ORIGINAL_CLEAN_RUN_ID" \
            --original-clean-commit "$ORIGINAL_CLEAN_COMMIT" \
            --control-commit "$GITHUB_SHA"
          rc=$?
          set -e
          printf '%s\n' "$rc" > clean_recovery/RECOVERY_EXIT_CODE.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -eq 0 ]]; then
            find clean_recovery/raw -type d -name tmp -prune -exec rm -rf {} + 2>/dev/null || true
          fi
          find clean_recovery/raw -type f \( -name '*.in' -o -name '*.out' -o -name '*.json' \) -print0 | sort -z | xargs -0 -r sha256sum > clean_recovery/CLEAN_RECOVERY_RAW_MANIFEST.sha256
          sha256sum control/na_cu001_ci/clean_surface_timeout_recovery_v1.py source_code/na_cu001_ci/method_protocol_v0.2.json bound/TIMEOUT_RECOVERY_INPUTS.sha256 > clean_recovery/CLEAN_RECOVERY_CONTROL_MANIFEST.sha256
          exit 0

      - name: Upload clean-surface timeout recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c8-clean-surface-timeout-recovery-v1
          path: |
            clean_recovery
            bound
            run_meta
          retention-days: 90
          if-no-files-found: error

      - name: Enforce timeout recovery result
        shell: bash
        run: |
          set -euo pipefail
          rc=$(cat clean_recovery/RECOVERY_EXIT_CODE.txt)
          if [[ "$rc" -eq 75 ]]; then
            echo 'Mechanical continuation reached its clean QE max_seconds checkpoint before the frozen clean-surface gate converged.' >&2
            exit 75
          fi
          test "$rc" -eq 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('clean_recovery/RELAXED_CLEAN_SURFACE_HANDOFF.json').read_text())
          assert r['schema']=='na-cu001-relaxed-clean-surface-handoff-v0.2' and r['status']=='PASS'
          assert r['method']['electrostatics']=={'assume_isolated':'esm','esm_bc':'bc1'}
          assert r['method']['coordinate_convention']=={'atomic_position_card':'angstrom','origin':'cartesian_z_zero'}
          assert r['pass_checks']['max_force_le_0p02_ev_per_angstrom'] is True
          assert r['pass_checks']['mirror_pair_error_le_0p01_angstrom'] is True
          assert r['pass_checks']['independent_energy_reproduction_le_0p001_ev'] is True
          assert r['provenance']['scientific_settings_changed'] is False
          assert r['provenance']['mechanical_timeout_recovery_only'] is True
          assert r['next_gate']=='adsorption_site_screening'
          PY

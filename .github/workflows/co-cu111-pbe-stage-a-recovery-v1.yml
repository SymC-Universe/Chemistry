name: CO Cu111 PBE Stage A mechanical recovery v1

on:
  workflow_dispatch:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/co-cu111-pbe-stage-a-recovery-v1.yml'
      - 'systems/co_cu111/pbe_stage_a_recovery_v1.py'
      - 'systems/co_cu111/MECHANICAL_RECOVERY_CONTROLLER_v0.1.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: co-cu111-pbe-stage-a-recovery-v1
  cancel-in-progress: false

env:
  SOURCE_STAGE_A_RUN_ID: '31371043888'
  SOURCE_STAGE_A_COMMIT: 'd411a92c7a548524e7af598b909313f5b421faf9'
  SOURCE_ENGINE_ARTIFACT: 'co-cu111-pbe-stage-a-engine-v2'
  PROTOCOL: 'systems/co_cu111/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json'
  BUNDLE: 'systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json'
  FROZEN_RUNNER: 'systems/co_cu111/pbe_stage_a_runner_v1.py'
  RECOVERY_RUNNER: 'systems/co_cu111/pbe_stage_a_recovery_v1.py'
  RECOVERY_CONTRACT: 'systems/co_cu111/MECHANICAL_RECOVERY_CONTROLLER_v0.1.json'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen science and preregistered recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$FROZEN_RUNNER" "$RECOVERY_RUNNER"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          c=json.loads(Path('systems/co_cu111/MECHANICAL_RECOVERY_CONTROLLER_v0.1.json').read_text())
          assert c['schema']=='co-cu111-stage-a-mechanical-recovery-v0.1'
          assert c['status']=='FROZEN_BEFORE_RECOVERY_RESULTS'
          assert c['source_stage_a']['run_id']==31371043888
          assert c['source_stage_a']['commit']=='d411a92c7a548524e7af598b909313f5b421faf9'
          for key,path_key,sha_key in (
              ('protocol','protocol','protocol_git_blob_sha'),
              ('bundle','bundle','bundle_git_blob_sha'),
              ('runner','runner','runner_git_blob_sha')):
              p=c['frozen_inputs'][path_key]
              got=subprocess.check_output(['git','hash-object',p],text=True).strip()
              assert got==c['frozen_inputs'][sha_key], (key,got,c['frozen_inputs'][sha_key])
          assert c['frozen_inputs']['mpi_ranks']==1
          assert c['frozen_inputs']['thread_environment']=={'OMP_NUM_THREADS':1,'OPENBLAS_NUM_THREADS':1}
          assert [(x['start_index'],x['end_index']) for x in c['bond_point_chunks']]==[(0,7),(8,15),(16,22)]
          assert len(c['recovery_targets'])==6
          assert c['provenance']['scientific_settings_changed'] is False
          PY
      - name: Download exact source-run Stage A engine
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ENGINE_ARTIFACT }}
          path: engine
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify source-run engine and frozen files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c engine/meta/STAGE_A_ENGINE.sha256
          cmp "$PROTOCOL" engine/meta/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json
          cmp "$BUNDLE" engine/meta/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
          cmp "$FROZEN_RUNNER" engine/meta/pbe_stage_a_runner_v1.py
          chmod +x engine/bin/pw.x
          test -x engine/bin/pw.x

  recover:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {cutoff: C0, box: 26, start: 0, end: 7}
          - {cutoff: C0, box: 26, start: 8, end: 15}
          - {cutoff: C0, box: 26, start: 16, end: 22}
          - {cutoff: C1, box: 22, start: 0, end: 7}
          - {cutoff: C1, box: 22, start: 8, end: 15}
          - {cutoff: C1, box: 22, start: 16, end: 22}
          - {cutoff: C1, box: 26, start: 0, end: 7}
          - {cutoff: C1, box: 26, start: 8, end: 15}
          - {cutoff: C1, box: 26, start: 16, end: 22}
          - {cutoff: C2, box: 18, start: 0, end: 7}
          - {cutoff: C2, box: 18, start: 8, end: 15}
          - {cutoff: C2, box: 18, start: 16, end: 22}
          - {cutoff: C2, box: 22, start: 0, end: 7}
          - {cutoff: C2, box: 22, start: 8, end: 15}
          - {cutoff: C2, box: 22, start: 16, end: 22}
          - {cutoff: C2, box: 26, start: 0, end: 7}
          - {cutoff: C2, box: 26, start: 8, end: 15}
          - {cutoff: C2, box: 26, start: 16, end: 22}
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin python3-numpy
      - name: Download exact source-run Stage A engine
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ENGINE_ARTIFACT }}
          path: engine
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify exact frozen engine and science files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c engine/meta/STAGE_A_ENGINE.sha256
          cmp "$PROTOCOL" engine/meta/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json
          cmp "$BUNDLE" engine/meta/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
          cmp "$FROZEN_RUNNER" engine/meta/pbe_stage_a_runner_v1.py
          chmod +x engine/bin/pw.x
          test -x engine/bin/pw.x
      - name: Download reusable source-run partial member when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-v2-co-${{ matrix.cutoff }}-L${{ matrix.box }}
          path: seed
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Recover frozen bond-point chunk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stageA
          python3 "$RECOVERY_RUNNER" co-chunk \
            --runner "$FROZEN_RUNNER" \
            --protocol "$PROTOCOL" \
            --bundle "$BUNDLE" \
            --contract "$RECOVERY_CONTRACT" \
            --pseudo-dir engine/pseudos \
            --pw engine/bin/pw.x \
            --cutoff-id '${{ matrix.cutoff }}' \
            --box '${{ matrix.box }}' \
            --start-index '${{ matrix.start }}' \
            --end-index '${{ matrix.end }}' \
            --seed-root seed \
            --out 'stageA/co_${{ matrix.cutoff }}_L${{ matrix.box }}'
      - name: Upload recoverable chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-stage-a-recovery-v1-chunk-${{ matrix.cutoff }}-L${{ matrix.box }}-i${{ matrix.start }}-${{ matrix.end }}
          path: stageA
          retention-days: 90
          if-no-files-found: warn

  assemble-and-analyze:
    needs: [prepare, recover]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis runtime
        run: sudo apt-get update && sudo apt-get install -y python3-numpy
      - name: Download all recovery chunks that exist
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-stage-a-recovery-v1-chunk-*
          path: recovered
          merge-multiple: true
      - name: Assemble complete recovered members or emit mechanical state
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          set +e
          python3 "$RECOVERY_RUNNER" assemble-all \
            --runner "$FROZEN_RUNNER" \
            --protocol "$PROTOCOL" \
            --bundle "$BUNDLE" \
            --contract "$RECOVERY_CONTRACT" \
            --root recovered \
            --state-out state/MECHANICAL_RECOVERY_STATE.json
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" > state/ASSEMBLY_EXIT_CODE.txt
      - name: Upload recovery state and assembled members
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-stage-a-mechanical-recovery-v1-state
          path: |
            state
            recovered
          retention-days: 90
          if-no-files-found: warn
      - name: Download original complete bulk members
        if: steps.assemble.outputs.rc == '0'
        uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-pbe-stage-a-v2-bulk-*
          path: collected/original_bulk
          merge-multiple: false
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download original CO members
        if: steps.assemble.outputs.rc == '0'
        uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-pbe-stage-a-v2-co-*
          path: collected/original_co
          merge-multiple: false
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Bind recovered members without overwriting source artifacts
        if: steps.assemble.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p collected/recovery
          cp -a recovered/. collected/recovery/
      - name: Run unchanged frozen Stage A analyzer
        if: steps.assemble.outputs.rc == '0'
        id: analyze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p decision
          set +e
          python3 "$FROZEN_RUNNER" analyze \
            --protocol "$PROTOCOL" \
            --bundle "$BUNDLE" \
            --root collected \
            --out decision/PBE_STAGE_A_RESULT.json \
            > decision/PBE_STAGE_A_STDOUT.txt 2>&1
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$rc" > decision/PBE_STAGE_A_EXIT_CODE.txt
          sha256sum "$PROTOCOL" "$BUNDLE" "$FROZEN_RUNNER" "$RECOVERY_CONTRACT" > decision/BOUND_INPUTS.sha256
      - name: Upload Stage A decision
        if: always() && steps.assemble.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-recovery-v1-decision
          path: decision
          retention-days: 90
          if-no-files-found: warn
      - name: Enforce mechanical completeness and scientific result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.assemble.outputs.rc }}' != '0' ]; then
            echo 'MECHANICAL_INCOMPLETE: recovery chunks are not all complete.'
            exit 3
          fi
          if [ '${{ steps.analyze.outputs.rc }}' != '0' ]; then
            echo 'SCIENTIFIC_STAGE_A_HOLD_OR_REJECTION: inspect decision artifact.'
            exit 2
          fi
          echo 'PBE_STAGE_A_PASS'

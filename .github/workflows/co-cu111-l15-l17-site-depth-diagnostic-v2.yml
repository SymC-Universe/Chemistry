        shell: bash
        run: |
          set -euo pipefail
          chmod +x inputs/engine/bin/pw.x
          python3 "$RUNNER" scf-segment --protocol "$PROTOCOL" --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result inputs/stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json --bundle "$BUNDLE" --pseudo-dir inputs/engine/pseudos --pw inputs/engine/bin/pw.x --l15-root inputs/source_l15 --l17-root inputs/source_l17_relax --depth '${{ matrix.depth }}' --site '${{ matrix.site }}' --segment 6 --prior-root prior --out screen
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-l15-l17-site-depth-v2-${{ matrix.depth }}-${{ matrix.site }}-seg06
          path: screen
          retention-days: 30
          if-no-files-found: error

  adjudicate:
    name: Apply v0.2 L15-L17 site-depth diagnostic gate
    needs: screen_6
    if: ${{ always() && needs.screen_6.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-l15-l17-site-depth-v2-*-seg06
          path: final_states
          merge-multiple: false
      - name: Adjudicate diagnostic without upgrading any prior claim
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          python3 "$RUNNER" adjudicate --protocol "$PROTOCOL" --root final_states --out result/L15_L17_SITE_DEPTH_DIAGNOSTIC_RESULT.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-l15-l17-site-depth-diagnostic-result-v2
          path: result
          retention-days: 90
          if-no-files-found: error

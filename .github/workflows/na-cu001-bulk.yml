name: Na Cu001 preregistered bulk convergence

on:
  push:
    branches:
      - agent/na-cu001-run
    paths:
      - 'na_cu001_ci/**'
      - '.github/workflows/na-cu001-bulk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'na_cu001_ci/**'
      - '.github/workflows/na-cu001-bulk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: na-cu001-bulk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bulk-convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make m4 perl wget curl ca-certificates \
            libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Download and build exact Quantum ESPRESSO 7.6 PWscf
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/qe-src" "$GITHUB_WORKSPACE/qe_bundle/bin" "$GITHUB_WORKSPACE/qe_bundle/meta"
          curl -L --retry 5 --retry-delay 5 \
            https://gitlab.com/QEF/q-e/-/archive/qe-7.6/q-e-qe-7.6.tar.gz \
            -o "$RUNNER_TEMP/qe-7.6.tar.gz"
          sha256sum "$RUNNER_TEMP/qe-7.6.tar.gz" | tee "$GITHUB_WORKSPACE/qe_bundle/meta/qe_source.sha256"
          tar -xzf "$RUNNER_TEMP/qe-7.6.tar.gz" -C "$RUNNER_TEMP/qe-src" --strip-components=1
          cd "$RUNNER_TEMP/qe-src"
          ./configure MPIF90=mpif90 F90=gfortran CC=mpicc
          make -j2 pw
          cp bin/pw.x "$GITHUB_WORKSPACE/qe_bundle/bin/pw.x"
          ./bin/pw.x -h > "$GITHUB_WORKSPACE/qe_bundle/meta/pw_help.txt" 2>&1 || true
          grep -R "version_number = '7.6'" include/qe_version.h | tee "$GITHUB_WORKSPACE/qe_bundle/meta/qe_version_source.txt"
          ldd bin/pw.x > "$GITHUB_WORKSPACE/qe_bundle/meta/pw_ldd.txt"
          (cd "$GITHUB_WORKSPACE/qe_bundle" && sha256sum bin/pw.x > meta/pw_x.sha256)
      - name: Download pinned SSSP v2 PBE-efficiency Cu pseudopotential
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p qe_bundle/pseudos qe_bundle/meta/sssp_archive
          curl -L --retry 5 --retry-delay 5 \
            https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/refs/heads/main/2-experiments/finalized_scripts/010-extract-eff-lib/SSSP-lib-pbe-eff-v2.tar.gz \
            -o qe_bundle/meta/SSSP-lib-pbe-eff-v2.tar.gz
          sha256sum qe_bundle/meta/SSSP-lib-pbe-eff-v2.tar.gz | tee qe_bundle/meta/sssp_archive.sha256
          tar -xzf qe_bundle/meta/SSSP-lib-pbe-eff-v2.tar.gz -C qe_bundle/meta/sssp_archive
          find qe_bundle/meta/sssp_archive -type f -name 'Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf' -print -quit > qe_bundle/meta/cu_pseudo_path.txt
          test -s qe_bundle/meta/cu_pseudo_path.txt
          cp "$(cat qe_bundle/meta/cu_pseudo_path.txt)" qe_bundle/pseudos/
          (cd qe_bundle && sha256sum pseudos/Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf > meta/cu_pseudo.sha256)
      - name: Verify engine and pseudopotential
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x qe_bundle/bin/pw.x
          (cd qe_bundle && sha256sum -c meta/pw_x.sha256)
          (cd qe_bundle && sha256sum -c meta/cu_pseudo.sha256)
          test -x qe_bundle/bin/pw.x
          test -s qe_bundle/pseudos/Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf
      - name: Run complete preregistered 120-SCF matrix
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
        run: |
          set -euxo pipefail
          mkdir -p bulk_outputs
          for ecut in 50 55 60 65 70; do
            for kmesh in 8 10 12 14; do
              python3 na_cu001_ci/bulk_runner.py run \
                --ecut "$ecut" \
                --kmesh "$kmesh" \
                --pw "$GITHUB_WORKSPACE/qe_bundle/bin/pw.x" \
                --pseudo-dir "$GITHUB_WORKSPACE/qe_bundle/pseudos" \
                --out "$GITHUB_WORKSPACE/bulk_outputs/e${ecut}_k${kmesh}" \
                --np 2
            done
          done
      - name: Apply preregistered convergence rule
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p final_results
          python3 na_cu001_ci/bulk_runner.py analyze \
            --summaries bulk_outputs \
            --out final_results/BULK_CONVERGENCE_RESULT.json | tee final_results/BULK_CONVERGENCE_STDOUT.txt
          cp -r bulk_outputs final_results/raw_matrix_outputs
          cp -r qe_bundle/meta final_results/qe_and_pseudo_identity
          find final_results -type f -print0 | sort -z | xargs -0 sha256sum > final_results/MANIFEST.sha256
          python3 - <<'PY'
          import json
          p='final_results/BULK_CONVERGENCE_RESULT.json'
          d=json.load(open(p))
          print('GATE:',d['gate'])
          print('SELECTED:',json.dumps(d['recommended_smallest'],indent=2))
          if d['gate'] != 'PASS':
              raise SystemExit(2)
          PY
      - name: Build compact bulk-to-slab handoff
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          result_path = Path('final_results/BULK_CONVERGENCE_RESULT.json')
          if not result_path.is_file():
              print('Bulk convergence result is absent; no handoff can be built.')
              raise SystemExit(0)

          result_bytes = result_path.read_bytes()
          result = json.loads(result_bytes)
          selected = result.get('recommended_smallest')
          if result.get('gate') != 'PASS' or not selected:
              raise SystemExit('Refusing to publish a slab handoff from a non-PASS bulk result')

          fit = selected['fit']
          handoff = {
              'schema': 'na-cu001-bulk-to-slab-handoff-v0.1',
              'scientific_status': 'bulk_convergence_passed_slab_not_yet_run',
              'source_result': {
                  'path': str(result_path),
                  'sha256': hashlib.sha256(result_bytes).hexdigest(),
                  'selection_rule': result['selection_rule'],
              },
              'selected_bulk_settings': {
                  'ecutwfc_ry': selected['ecutwfc_ry'],
                  'ecutrho_ry': selected['ecutrho_ry'],
                  'kmesh_cubic': [selected['kmesh']] * 3,
                  'equilibrium_lattice_constant_angstrom': fit['a0_angstrom'],
                  'equilibrium_energy_ev_per_atom': fit['e0_ev_per_atom'],
                  'quadratic_fit_rms_residual_mev_per_atom': fit['rms_residual_mev_per_atom'],
              },
              'frozen_method': {
                  'code': 'Quantum ESPRESSO PWscf',
                  'code_version': '7.6',
                  'exchange_correlation': 'PBE',
                  'pseudopotential': 'Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf',
                  'ecutrho_multiplier': 3,
                  'occupations': 'smearing',
                  'smearing': 'mv',
                  'degauss_ry': 0.02,
                  'bulk_lattice_grid_angstrom': [3.55, 3.58, 3.61, 3.64, 3.67, 3.70],
                  'bulk_cutoff_grid_ry': [50, 55, 60, 65, 70],
                  'bulk_kmesh_grid': [8, 10, 12, 14],
              },
              'run_provenance': {
                  'repository': os.environ.get('GITHUB_REPOSITORY'),
                  'workflow': os.environ.get('GITHUB_WORKFLOW'),
                  'run_id': os.environ.get('GITHUB_RUN_ID'),
                  'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
                  'commit_sha': os.environ.get('GITHUB_SHA'),
                  'ref': os.environ.get('GITHUB_REF'),
              },
              'next_gate': 'explicit_preregistered_cu001_slab_convergence',
          }
          out = Path('final_results/BULK_HANDOFF.json')
          out.write_text(json.dumps(handoff, indent=2) + '\n')
          Path('final_results/BULK_HANDOFF.sha256').write_text(
              hashlib.sha256(out.read_bytes()).hexdigest() + '  BULK_HANDOFF.json\n'
          )
          print(json.dumps(handoff, indent=2))
          PY
      - name: Publish bulk decision to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## NA-CU001 bulk convergence decision'
            echo
            if [[ -f final_results/BULK_HANDOFF.json ]]; then
              echo '```json'
              cat final_results/BULK_HANDOFF.json
              echo '```'
            else
              echo '_No PASS-qualified bulk handoff was generated._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compact bulk decision handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-cu001-bulk-decision-handoff
          path: |
            final_results/BULK_CONVERGENCE_RESULT.json
            final_results/BULK_CONVERGENCE_STDOUT.txt
            final_results/BULK_HANDOFF.json
            final_results/BULK_HANDOFF.sha256
            final_results/MANIFEST.sha256
            final_results/qe_and_pseudo_identity
            bulk_outputs/**/summary_e*_k*.json
          retention-days: 90
          if-no-files-found: warn
      - name: Upload complete raw and analyzed result
        uses: actions/upload-artifact@v4
        with:
          name: na-cu001-bulk-convergence-final
          path: final_results
          retention-days: 90
          if-no-files-found: error

name: CO Cu111 L17 exact QE restart convergence v1

on:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - '.github/workflows/co-cu111-l17-exact-qe-restart-v1.yml'
      - 'systems/co_cu111/SYSTEM2_PBE_SURFACE_CONVERGENCE_L17_v0.1.json'
      - 'systems/co_cu111/pbe_surface_convergence_l17_v1.py'
      - 'systems/co_cu111/test_pbe_surface_convergence_l17_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: co-cu111-l17-exact-qe-restart-v1
  cancel-in-progress: false

env:
  PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_CONVERGENCE_L17_v0.1.json
  RUNNER: systems/co_cu111/pbe_surface_convergence_l17_v1.py
  TEST: systems/co_cu111/test_pbe_surface_convergence_l17_v1.py
  SURFACE_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_SITE_ORDERING_PROTOCOL_v0.1.json
  BUNDLE: systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
  L15_RUN_ID: '33712992505'
  L15_ARTIFACT: co-cu111-l15-native-postrelax-reproduced-v1
  ENGINE_RUN_ID: '31371043888'
  ENGINE_ARTIFACT: co-cu111-pbe-stage-a-engine-v2
  STAGE_A_RUN_ID: '31887006685'
  STAGE_A_ARTIFACT: co-cu111-pbe-stage-a-numerical-extension-decision-v1
  SELECTION_RUN_ID: '32915640451'
  SELECTION_ARTIFACT: co-cu111-pbe-surface-audit-rank-selection-v1
  RECOVERY_RUN_ID: '33942175805'
  RECOVERY_ARTIFACT: co-cu111-l17-exact-restart-relax-01
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  preflight:
    name: Freeze and verify L17 exact-restart contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen L17 files and tests
        shell: bash
        run: |
          set -euo pipefail
          echo '69659623872c45c4408c2db86052818cb821bf825d5fc48db6f7aa8eec316c07  systems/co_cu111/SYSTEM2_PBE_SURFACE_CONVERGENCE_L17_v0.1.json' | sha256sum -c -
          echo '102a0ef3d60812fdebced291583e05a02c3e5adfe847ea6744ea17fe4c3316c1  systems/co_cu111/pbe_surface_convergence_l17_v1.py' | sha256sum -c -
          echo '8f1e0764131bb66956f4f76b2492d63f3cc60a6df784ee2370f15df4321f7ef7  systems/co_cu111/test_pbe_surface_convergence_l17_v1.py' | sha256sum -c -
          python3 -m py_compile "$RUNNER" "$TEST"
          python3 "$TEST"
          python3 "$RUNNER" self-test --protocol "$PROTOCOL"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.L15_ARTIFACT }}
          path: l15_reference
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.L15_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Pin exact L15 source evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f l15_reference/l15_audit/summary.json
          echo '34b0290260dc6f59a596f34a15ef75f5af48674a9bf33f8f686a47618b379e2e  l15_reference/l15_audit/summary.json' | sha256sum -c -
          python3 - <<'PY'
          import json
          r=json.load(open('l15_reference/l15_audit/summary.json'))
          assert r['case_id']=='L15-V32-K28-extension-audit'
          assert r['status']=='COMPLETE' and r['mechanical_pass'] is True
          assert r['layers']==15 and r['vacuum_angstrom']==32.0 and r['kmesh']==28
          print('PINNED_L15_REFERENCE_VERIFIED')
          print('PRIOR_L13_L15_GATE_REMAINS_FAIL=true')
          print('NEW_RUNG=L17-V36-K32')
          print('APPROXIMATE_RESTART_ALLOWED=false')
          PY

  relax_1:
    name: L17 relax exact-restart segment 1 of 6
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.ENGINE_ARTIFACT }}', path: engine, repository: SymC-Universe/Chemistry, run-id: '${{ env.ENGINE_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.STAGE_A_ARTIFACT }}', path: stage_a_decision, repository: SymC-Universe/Chemistry, run-id: '${{ env.STAGE_A_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.SELECTION_ARTIFACT }}', path: selection, repository: SymC-Universe/Chemistry, run-id: '${{ env.SELECTION_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.L15_ARTIFACT }}', path: l15_reference, repository: SymC-Universe/Chemistry, run-id: '${{ env.L15_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.RECOVERY_ARTIFACT }}', path: state, repository: SymC-Universe/Chemistry, run-id: '${{ env.RECOVERY_RUN_ID }}', github-token: '${{ github.token }}'}
      - name: Recover preserved segment-1 checkpoint metadata
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$RUNNER" recover-relax-state --protocol "$PROTOCOL" --l15-root l15_reference --segment 1 --out state \
            --source-run-id 33942175805 --source-job-id 101241623145 --source-artifact-id 9965875189 \
            --source-artifact-sha256 8eae43d5dbadad959d5d38f3262830d94f43c4a1100eb8b74167b2cdf6e3c681 \
            --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x --selection selection/RANK_SELECTION_RESULT.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: co-cu111-l17-exact-restart-relax-01, path: state, retention-days: 90, if-no-files-found: error}

  relax_2:
    name: L17 relax exact-restart segment 2 of 6
    needs: relax_1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-l17-exact-restart-relax-01, path: prior}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.ENGINE_ARTIFACT }}', path: engine, repository: SymC-Universe/Chemistry, run-id: '${{ env.ENGINE_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.STAGE_A_ARTIFACT }}', path: stage_a_decision, repository: SymC-Universe/Chemistry, run-id: '${{ env.STAGE_A_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.SELECTION_ARTIFACT }}', path: selection, repository: SymC-Universe/Chemistry, run-id: '${{ env.SELECTION_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.L15_ARTIFACT }}', path: l15_reference, repository: SymC-Universe/Chemistry, run-id: '${{ env.L15_RUN_ID }}', github-token: '${{ github.token }}'}
      - name: Resume exact QE relaxation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$RUNNER" relax-segment --protocol "$PROTOCOL" --l15-root l15_reference --prior-root prior --segment 2 --out state \
            --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x --selection selection/RANK_SELECTION_RESULT.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: co-cu111-l17-exact-restart-relax-02, path: state, retention-days: 90, if-no-files-found: error}

  relax_3:
    name: L17 relax exact-restart segment 3 of 6
    needs: relax_2
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-l17-exact-restart-relax-02, path: prior}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.ENGINE_ARTIFACT }}', path: engine, repository: SymC-Universe/Chemistry, run-id: '${{ env.ENGINE_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.STAGE_A_ARTIFACT }}', path: stage_a_decision, repository: SymC-Universe/Chemistry, run-id: '${{ env.STAGE_A_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.SELECTION_ARTIFACT }}', path: selection, repository: SymC-Universe/Chemistry, run-id: '${{ env.SELECTION_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.L15_ARTIFACT }}', path: l15_reference, repository: SymC-Universe/Chemistry, run-id: '${{ env.L15_RUN_ID }}', github-token: '${{ github.token }}'}
      - name: Resume exact QE relaxation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$RUNNER" relax-segment --protocol "$PROTOCOL" --l15-root l15_reference --prior-root prior --segment 3 --out state \
            --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x --selection selection/RANK_SELECTION_RESULT.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: co-cu111-l17-exact-restart-relax-03, path: state, retention-days: 90, if-no-files-found: error}

  relax_4:
    name: L17 relax exact-restart segment 4 of 6
    needs: relax_3
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-l17-exact-restart-relax-03, path: prior}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.ENGINE_ARTIFACT }}', path: engine, repository: SymC-Universe/Chemistry, run-id: '${{ env.ENGINE_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.STAGE_A_ARTIFACT }}', path: stage_a_decision, repository: SymC-Universe/Chemistry, run-id: '${{ env.STAGE_A_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.SELECTION_ARTIFACT }}', path: selection, repository: SymC-Universe/Chemistry, run-id: '${{ env.SELECTION_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.L15_ARTIFACT }}', path: l15_reference, repository: SymC-Universe/Chemistry, run-id: '${{ env.L15_RUN_ID }}', github-token: '${{ github.token }}'}
      - name: Resume exact QE relaxation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$RUNNER" relax-segment --protocol "$PROTOCOL" --l15-root l15_reference --prior-root prior --segment 4 --out state \
            --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x --selection selection/RANK_SELECTION_RESULT.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: co-cu111-l17-exact-restart-relax-04, path: state, retention-days: 90, if-no-files-found: error}

  relax_5:
    name: L17 relax exact-restart segment 5 of 6
    needs: relax_4
    runs-on: ubuntu-24.04
    timeout-minutes: 360

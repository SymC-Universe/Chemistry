        with: {name: co-cu111-l17-exact-restart-scf-03, path: prior}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.ENGINE_ARTIFACT }}', path: engine, repository: SymC-Universe/Chemistry, run-id: '${{ env.ENGINE_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.STAGE_A_ARTIFACT }}', path: stage_a_decision, repository: SymC-Universe/Chemistry, run-id: '${{ env.STAGE_A_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.SELECTION_ARTIFACT }}', path: selection, repository: SymC-Universe/Chemistry, run-id: '${{ env.SELECTION_RUN_ID }}', github-token: '${{ github.token }}'}
      - name: Resume exact QE SCF checkpoint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$RUNNER" scf-segment --protocol "$PROTOCOL" --prior-root prior --segment 4 --out state \
            --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x --selection selection/RANK_SELECTION_RESULT.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: co-cu111-l17-exact-restart-scf-04, path: state, retention-days: 90, if-no-files-found: error}

  adjudicate:
    name: Apply unchanged L15-L17 1 meV gate
    needs: scf_4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.L15_ARTIFACT }}', path: l15_reference, repository: SymC-Universe/Chemistry, run-id: '${{ env.L15_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-l17-exact-restart-relax-06, path: final_relax}
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-l17-exact-restart-scf-04, path: final_scf}
      - name: Adjudicate L17 without retuning
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          python3 "$RUNNER" adjudicate --protocol "$PROTOCOL" --l15-root l15_reference --relax-root final_relax --scf-root final_scf --out result/L17_CONVERGENCE_RESULT.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: co-cu111-l17-convergence-result-v1, path: result, retention-days: 90, if-no-files-found: error}

name: Barrier Atlas MC04 H-ethylene audit v0.1

on:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - 'barrier_atlas/family_independence/MC04_H_ETHYLENE_ADDITION_SOURCE_AUDIT_v0.1.json'
      - 'barrier_atlas/family_independence/validate_mc04_h_ethylene_addition_v0_1.py'
      - 'barrier_atlas/family_independence/test_mc04_h_ethylene_addition_v0_1.py'
      - '.github/workflows/barrier-atlas-mc04-h-ethylene-audit-v0.1.yml'
  pull_request:
    paths:
      - 'barrier_atlas/family_independence/MC04_H_ETHYLENE_ADDITION_SOURCE_AUDIT_v0.1.json'
      - 'barrier_atlas/family_independence/validate_mc04_h_ethylene_addition_v0_1.py'
      - 'barrier_atlas/family_independence/test_mc04_h_ethylene_addition_v0_1.py'
      - '.github/workflows/barrier-atlas-mc04-h-ethylene-audit-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mc04-h-ethylene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fail-closed validator
        run: python barrier_atlas/family_independence/validate_mc04_h_ethylene_addition_v0_1.py

      - name: Run regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q barrier_atlas/family_independence/test_mc04_h_ethylene_addition_v0_1.py

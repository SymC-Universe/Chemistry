name: CO Cu111 PBE surface convergence extension v1

on:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - '.github/workflows/co-cu111-pbe-surface-convergence-extension-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: co-cu111-pbe-surface-convergence-extension-v1
  cancel-in-progress: false

env:
  EXT_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_CONVERGENCE_EXTENSION_v0.1.json
  EXT_RUNNER: systems/co_cu111/pbe_surface_convergence_extension_v1.py
  EXT_TEST: systems/co_cu111/test_pbe_surface_convergence_extension_v1.py
  SURFACE_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_SITE_ORDERING_PROTOCOL_v0.1.json
  BUNDLE: systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
  SOURCE_HOLD_RUN_ID: '33306112961'
  SOURCE_HOLD_ARTIFACT: co-cu111-pbe-clean-surface-gate-recovery-v1
  L13_REFERENCE_RUN_ID: '33296522880'
  L13_REFERENCE_ARTIFACT: co-cu111-pbe-clean-audit-reproduction-recovery-v2-L13-V28-K24
  SELECTION_RUN_ID: '32915640451'
  SELECTION_ARTIFACT: co-cu111-pbe-surface-audit-rank-selection-v1
  ENGINE_RUN_ID: '31371043888'
  ENGINE_ARTIFACT: co-cu111-pbe-stage-a-engine-v2
  STAGE_A_RUN_ID: '31887006685'
  STAGE_A_ARTIFACT: co-cu111-pbe-stage-a-numerical-extension-decision-v1
  SOURCE_SURFACE_RUN_ID: '31922544540'
  CONTINUATION_RUNTIME_CAP_S: '19800'
  REPRO_RUNTIME_CAP_S: '19200'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen extension contract and repository sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$EXT_RUNNER" "$EXT_TEST"
          test "$(git hash-object "$EXT_PROTOCOL")" = '0cf59a7974b769f619b2684ea10966e6789dd546'
          test "$(git hash-object "$EXT_RUNNER")" = 'bf5526692f2ce55311e71516f1cf336ce9250b87'
          test "$(git hash-object "$EXT_TEST")" = '7c4830b590fb8b851dcab37c093e6533823c569c'
          echo '518583a18ec5a26b442523601e325b2b525fd5a374f37c255eb9c5fff163ebd7  '$EXT_PROTOCOL | sha256sum -c -
          echo '00f32beaa072ca474125e2296ad610215457f936faab2e03b5675ccf21453fbb  '$EXT_RUNNER | sha256sum -c -
          echo '83145d7f50b1597801426ea647115e94c2467250a1f5ea907d201d0ad9053871  '$EXT_TEST | sha256sum -c -
          echo '1bb01d81beade1642da46449770638967a103f43ee63081b3ae5b8509f1c156f  '$SURFACE_PROTOCOL | sha256sum -c -
          echo 'f5dd93f6b714c061fc664c045884fc4cd3975e7db01154f667221df158689d6b  systems/co_cu111/pbe_surface_site_ordering_v1.py' | sha256sum -c -
          echo '00260df6730d3812b4d1543654b491a3eaeb118a196ed1b4f53a71cde74099b5  systems/co_cu111/pbe_surface_audit_rank_fallback_recovery_v1.py' | sha256sum -c -
          echo '33d1620e3af2a072e1f14e4f2fefa72cf7c5f53ff247b0fb394aa72130764696  systems/co_cu111/pbe_surface_audit_proposal_relay_v1.py' | sha256sum -c -
          echo '6a2216a776cbe3bf8a08e1f7215bcf0ff77caf96a2f2529875a0157f4bbfed3f  '$BUNDLE | sha256sum -c -
          python3 "$EXT_RUNNER" self-test --protocol "$EXT_PROTOCOL"
          python3 "$EXT_TEST" -v
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_HOLD_ARTIFACT }}
          path: source_hold
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_HOLD_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.L13_REFERENCE_ARTIFACT }}
          path: l13_reference
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.L13_REFERENCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SELECTION_ARTIFACT }}
          path: selection
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SELECTION_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify immutable HOLD, L13 reference and rank selection
        shell: bash
        env:
          CO_CU111_HOLD_FIXTURE: ${{ github.workspace }}/source_hold
          CO_CU111_L13_FIXTURE: ${{ github.workspace }}/l13_reference
        run: |
          set -euo pipefail
          echo 'afa8239acbb6ed08b92fcff881bbf4f33f95cb196c595c1f1940a100fab251b3  source_hold/CLEAN_SURFACE_GATE.json' | sha256sum -c -
          echo 'f199a2a26e1465a8cff815a0568ea2d1eb24b31a74868a061523b93c09859ddc  l13_reference/summary.json' | sha256sum -c -
          echo 'e8b99f660762724922a9be153b374ccf9fc7f269744570b978d5d2e2b15de0a4  selection/RANK_SELECTION_RESULT.json' | sha256sum -c -
          python3 "$EXT_TEST" -v
          python3 "$EXT_RUNNER" verify-sources --protocol "$EXT_PROTOCOL" --hold-root source_hold --l13-root l13_reference
          python3 - <<'PY'
          import json
          r=json.load(open('selection/RANK_SELECTION_RESULT.json'))
          assert r['status']=='PASS'
          assert r['selected_execution_mode']=='DIRECT_ONE_RANK'
          assert r['selected_mpi_ranks']==1
          assert r['four_rank_excluded'] is True
          assert r['scientific_settings_changed'] is False
          assert r['kinetic_inputs_used'] is False
          print('DIRECT_ONE_RANK_SELECTION_VERIFIED')
          PY

  continue_1:
    name: continue-1 / L15 logical-1
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      SEGMENT: '1'
      PREV_SEGMENT: '0'
    steps: &continuation_steps
      - uses: actions/checkout@v4
      - if: env.SEGMENT == '1'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.L13_REFERENCE_ARTIFACT }}
          path: prior
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.L13_REFERENCE_RUN_ID }}
          github-token: ${{ github.token }}
      - if: env.SEGMENT != '1'
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-surface-convergence-extension-L15-V32-K28-seg${{ env.PREV_SEGMENT }}
          path: prior
      - name: Inspect prior checkpoint
        id: prior
        shell: bash
        run: |
          set -euo pipefail
          info="$(python3 "$EXT_RUNNER" inspect-prior --protocol "$EXT_PROTOCOL" --prior-root prior --segment "$SEGMENT")"
          echo "$info"
          carry="$(printf '%s\n' "$info" | awk -F= '/^CARRY=/{print $2}')"
          test "$carry" = true -o "$carry" = false
          echo "carry=$carry" >> "$GITHUB_OUTPUT"
      - if: steps.prior.outputs.carry != 'true'
        name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - if: steps.prior.outputs.carry != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - if: steps.prior.outputs.carry != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - if: steps.prior.outputs.carry != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SELECTION_ARTIFACT }}
          path: selection
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SELECTION_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Continue frozen L15 audit
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.prior.outputs.carry }}" = true ]; then
            python3 "$EXT_RUNNER" continue --protocol "$EXT_PROTOCOL" --prior-root prior --segment "$SEGMENT" --runtime-cap-s "$CONTINUATION_RUNTIME_CAP_S" --out segment_out
          else
            chmod +x engine/bin/pw.x
            python3 "$EXT_RUNNER" continue --protocol "$EXT_PROTOCOL" --prior-root prior --segment "$SEGMENT" \
              --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
              --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
              --selection selection/RANK_SELECTION_RESULT.json --runtime-cap-s "$CONTINUATION_RUNTIME_CAP_S" --out segment_out
          fi
          python3 - <<'PY'
          import json
          r=json.load(open('segment_out/SURFACE_CONVERGENCE_EXTENSION_SEGMENT.json'))
          print('SEGMENT_STATUS='+r['status'])
          print('L15_LOGICAL_SEGMENT='+str(r['logical_segment']))
          print('L15_FORCE_EV_A='+str(r['latest_authoritative_max_movable_force_ev_per_angstrom']))
          print('CARRIED_FORWARD='+str(r['carried_forward_without_recomputation']).lower())
          print('SCIENTIFIC_SETTINGS_CHANGED='+str(r['scientific_settings_changed']).lower())
          print('THRESHOLDS_CHANGED='+str(r['thresholds_changed']).lower())
          print('KINETIC_INPUTS_USED='+str(r['kinetic_inputs_used']).lower())
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-surface-convergence-extension-L15-V32-K28-seg${{ env.SEGMENT }}
          path: segment_out
          retention-days: 90
          if-no-files-found: error

  continue_2:
    name: continue-2 / L15 logical-2
    needs: continue_1
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env: {SEGMENT: '2', PREV_SEGMENT: '1'}
    steps: *continuation_steps

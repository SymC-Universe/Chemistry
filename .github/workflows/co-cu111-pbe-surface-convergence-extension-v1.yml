  reproduce_audit:
    name: reproduce-L15-audit
    needs: continue_36
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-surface-convergence-extension-L15-V32-K28-seg36
          path: prior
      - name: Confirm frozen runway reached a completed L15 state
        shell: bash
        run: |
          set -euo pipefail
          python3 "$EXT_RUNNER" inspect-prior --protocol "$EXT_PROTOCOL" --prior-root prior --segment 37 | tee prior_status.txt
          grep -q '^CARRY=true$' prior_status.txt || { echo 'MECHANICAL_INCOMPLETE: L15 did not converge within frozen 36-segment runway'; exit 1; }
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SELECTION_ARTIFACT }}
          path: selection
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SELECTION_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Independently reproduce completed L15 audit geometry
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$EXT_RUNNER" reproduce --protocol "$EXT_PROTOCOL" --prior-root prior \
            --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
            --selection selection/RANK_SELECTION_RESULT.json --runtime-cap-s "$REPRO_RUNTIME_CAP_S" --out l15_audit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-surface-convergence-extension-L15-V32-K28-reproduced
          path: l15_audit
          retention-days: 90
          if-no-files-found: error

  extension_gate:
    name: extension-clean-surface-gate
    needs: reproduce_audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_HOLD_ARTIFACT }}
          path: source_hold
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_HOLD_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.L13_REFERENCE_ARTIFACT }}
          path: l13_reference
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.L13_REFERENCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-surface-convergence-extension-L15-V32-K28-reproduced
          path: l15_audit
      - uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-pbe-clean-v1-*
          path: candidates
          merge-multiple: false
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_SURFACE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Apply prospectively frozen extension gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extension_gate
          python3 "$EXT_RUNNER" gate --protocol "$EXT_PROTOCOL" --hold-root source_hold --l13-root l13_reference --l15-root l15_audit \
            --candidate-root candidates --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --out extension_gate/SURFACE_CONVERGENCE_EXTENSION_GATE.json \
            > extension_gate/SURFACE_CONVERGENCE_EXTENSION_GATE_STDOUT.txt
          cat extension_gate/SURFACE_CONVERGENCE_EXTENSION_GATE_STDOUT.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-surface-convergence-extension-gate-v1
          path: extension_gate
          retention-days: 90

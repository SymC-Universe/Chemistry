name: CO Cu111 PBE surface audit proposal relay v1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - '.github/workflows/co-cu111-pbe-surface-audit-proposal-relay-v1.yml'
      - 'systems/co_cu111/SYSTEM2_PBE_SURFACE_AUDIT_PROPOSAL_RELAY_v0.1.json'
      - 'systems/co_cu111/pbe_surface_audit_proposal_relay_v1.py'
      - 'systems/co_cu111/test_pbe_surface_audit_proposal_relay_v1.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: co-cu111-pbe-surface-audit-proposal-relay-v1
  cancel-in-progress: false

env:
  RELAY_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_AUDIT_PROPOSAL_RELAY_v0.1.json
  RELAY_RUNNER: systems/co_cu111/pbe_surface_audit_proposal_relay_v1.py
  RELAY_TEST: systems/co_cu111/test_pbe_surface_audit_proposal_relay_v1.py
  ORIGINAL_RECOVERY_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_TIMEOUT_RECOVERY_v0.1.json
  ORIGINAL_RECOVERY_RUNNER: systems/co_cu111/pbe_surface_timeout_recovery_v1.py
  SURFACE_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_SITE_ORDERING_PROTOCOL_v0.1.json
  SURFACE_RUNNER: systems/co_cu111/pbe_surface_site_ordering_v1.py
  SURFACE_TEST: systems/co_cu111/test_pbe_surface_site_ordering_v1.py
  BUNDLE: systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json

  PARENT_RECOVERY_RUN_ID: '32435777875'
  PARENT_AUDIT_ARTIFACT: co-cu111-pbe-clean-timeout-recovery-L13-V28-K24-audit-seg4
  COMPLETED_REFERENCE_ARTIFACT: co-cu111-pbe-clean-timeout-recovery-repro1-L11-V24-K20-reference
  SOURCE_SURFACE_RUN_ID: '31922544540'

  STAGE_A_RUN_ID: '31887006685'
  STAGE_A_ARTIFACT: co-cu111-pbe-stage-a-numerical-extension-decision-v1
  STAGE_A_RESULT_SHA256: 2f77135848bbfb90904cbbf54eeb3ef4e8de3629f5ddcc0b7157a26c6f31fff3
  ENGINE_RUN_ID: '31371043888'
  ENGINE_ARTIFACT: co-cu111-pbe-stage-a-engine-v2

  SEGMENT_RUNTIME_CAP_S: '16200'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen relay and repository contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RELAY_RUNNER" "$RELAY_TEST" "$ORIGINAL_RECOVERY_RUNNER" "$SURFACE_RUNNER" "$SURFACE_TEST"

          echo '921505fa9cd881f3d6b5dd160b4d6365e2ebb220eaa90920cc863b075c92390b  '"$RELAY_PROTOCOL" | sha256sum -c -
          echo '33d1620e3af2a072e1f14e4f2fefa72cf7c5f53ff247b0fb394aa72130764696  '"$RELAY_RUNNER" | sha256sum -c -
          echo 'd8e1aa3d9b478def460400ef10abf39e8743168139250093ee00a766ab4390d3  '"$RELAY_TEST" | sha256sum -c -
          echo '8fa1fefb20162bc29af10c3df0d502872e84711409bb66aeec302a3a998b1466  '"$ORIGINAL_RECOVERY_PROTOCOL" | sha256sum -c -
          echo '45a1427de9e0e450291b795f9d98159a43e51879f0d7958f222db7bb85314fd2  '"$ORIGINAL_RECOVERY_RUNNER" | sha256sum -c -
          echo '1bb01d81beade1642da46449770638967a103f43ee63081b3ae5b8509f1c156f  '"$SURFACE_PROTOCOL" | sha256sum -c -
          echo 'f5dd93f6b714c061fc664c045884fc4cd3975e7db01154f667221df158689d6b  '"$SURFACE_RUNNER" | sha256sum -c -
          echo '0f15e3ad0ffcbb622273b9ea394a0c04336403ecdbbde54948698e4c036f76fe  '"$SURFACE_TEST" | sha256sum -c -

          python3 "$RELAY_RUNNER" self-test --relay-protocol "$RELAY_PROTOCOL"

      - name: Download immutable v1 audit segment 4
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARENT_AUDIT_ARTIFACT }}
          path: parent_audit
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.PARENT_RECOVERY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify non-progress loop and admissible next BFGS trial
        shell: bash
        env:
          CO_CU111_AUDIT_SEG4: ${{ github.workspace }}/parent_audit
        run: |
          set -euo pipefail
          echo 'd051e8d48be5f894c35ff8b2ea63ea36675ee8d43734927252b98d1017438f6f  parent_audit/RECOVERY_SEGMENT.json' | sha256sum -c -
          echo 'ae4500de79def31303cc1fede2fcffb3576811b1abdbc3b9a3dc50dc8f02cc98  parent_audit/relax/clean_relax.out' | sha256sum -c -
          python3 "$RELAY_RUNNER" verify-seed --relay-protocol "$RELAY_PROTOCOL" --parent-root parent_audit
          python3 "$RELAY_TEST" -v

      - name: Download completed immutable L11 reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COMPLETED_REFERENCE_ARTIFACT }}
          path: completed_reference
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.PARENT_RECOVERY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify completed L11 reference for later gate reuse
        shell: bash
        run: |
          set -euo pipefail
          echo '88b0df1455d2d34963b6503a980fb79260e93c3785b94ba4cefab110fcfc0245  completed_reference/summary.json' | sha256sum -c -
          python3 - <<'PY'
          import json
          r=json.load(open('completed_reference/summary.json'))
          assert r['schema']=='co-cu111-pbe-clean-surface-case-v0.1'
          assert r['case_id']=='L11-V24-K20-reference'
          assert r['role']=='reference'
          assert r['status']=='COMPLETE'
          assert r['mechanical_pass'] is True
          assert r['provenance']['kinetic_inputs_used'] is False
          assert r['provenance']['scientific_settings_changed'] is False
          assert r['provenance']['protocol_sha256']=='1bb01d81beade1642da46449770638967a103f43ee63081b3ae5b8509f1c156f'
          assert r['provenance']['pw_sha256']=='2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855'
          print('COMPLETED_REFERENCE_VERIFIED_FOR_REUSE')
          PY

  relay-1:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARENT_AUDIT_ARTIFACT }}
          path: prior
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.PARENT_RECOVERY_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Evaluate prior BFGS trial in relay segment 1
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$RELAY_RUNNER" relay \
            --relay-protocol "$RELAY_PROTOCOL" --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
            --prior-root prior --relay-segment 1 --runtime-cap-s "$SEGMENT_RUNTIME_CAP_S" \
            --out relay_out
      - name: Upload relay segment 5 checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-clean-audit-proposal-relay-L13-V28-K24-seg5
          path: relay_out
          retention-days: 90
          if-no-files-found: error

  relay-2:
    needs: relay-1
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-pbe-clean-audit-proposal-relay-L13-V28-K24-seg5, path: prior}
      - name: Continue audit proposal relay segment 2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$RELAY_RUNNER" relay \
            --relay-protocol "$RELAY_PROTOCOL" --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
            --prior-root prior --relay-segment 2 --runtime-cap-s "$SEGMENT_RUNTIME_CAP_S" \
            --out relay_out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-clean-audit-proposal-relay-L13-V28-K24-seg6
          path: relay_out
          retention-days: 90
          if-no-files-found: error

  relay-3:
    needs: relay-2
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-pbe-clean-audit-proposal-relay-L13-V28-K24-seg6, path: prior}
      - name: Continue audit proposal relay segment 3
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$RELAY_RUNNER" relay \
            --relay-protocol "$RELAY_PROTOCOL" --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
            --prior-root prior --relay-segment 3 --runtime-cap-s "$SEGMENT_RUNTIME_CAP_S" \
            --out relay_out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-clean-audit-proposal-relay-L13-V28-K24-seg7
          path: relay_out
          retention-days: 90
          if-no-files-found: error

  relay-4:
    needs: relay-3
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-pbe-clean-audit-proposal-relay-L13-V28-K24-seg7, path: prior}
      - name: Continue audit proposal relay segment 4
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$RELAY_RUNNER" relay \
            --relay-protocol "$RELAY_PROTOCOL" --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
            --prior-root prior --relay-segment 4 --runtime-cap-s "$SEGMENT_RUNTIME_CAP_S" \
            --out relay_out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-clean-audit-proposal-relay-L13-V28-K24-seg8
          path: relay_out
          retention-days: 90
          if-no-files-found: error

  reproduce-audit:
    needs: relay-4
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-pbe-clean-audit-proposal-relay-L13-V28-K24-seg8, path: relax_final}
      - name: Independent fixed-geometry reproduction of completed L13 audit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$RELAY_RUNNER" reproduce \
            --relay-protocol "$RELAY_PROTOCOL" --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
            --relax-root relax_final --runtime-cap-s "$SEGMENT_RUNTIME_CAP_S" \
            --out audit_final
      - name: Upload final recovered L13 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-clean-audit-proposal-relay-final-L13-V28-K24-audit
          path: audit_final
          retention-days: 90
          if-no-files-found: error

  clean-gate:
    needs: reproduce-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Re-verify unchanged scientific gate implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '1bb01d81beade1642da46449770638967a103f43ee63081b3ae5b8509f1c156f  '"$SURFACE_PROTOCOL" | sha256sum -c -
          echo 'f5dd93f6b714c061fc664c045884fc4cd3975e7db01154f667221df158689d6b  '"$SURFACE_RUNNER" | sha256sum -c -

      - name: Download eight immutable candidate cases and historical partial terminals
        uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-pbe-clean-v1-*
          path: clean_collected/source
          merge-multiple: false
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_SURFACE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download immutable completed L11 reference
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COMPLETED_REFERENCE_ARTIFACT }}
          path: clean_collected/reference
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.PARENT_RECOVERY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download completed L13 audit from this relay
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-clean-audit-proposal-relay-final-L13-V28-K24-audit
          path: clean_collected/audit

      - name: Download authorizing Stage A PASS decision
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Apply unchanged ten-case clean-surface gate
        shell: bash
        run: |
          set -euo pipefail
          echo '88b0df1455d2d34963b6503a980fb79260e93c3785b94ba4cefab110fcfc0245  clean_collected/reference/summary.json' | sha256sum -c -
          mkdir -p clean_gate
          python3 "$SURFACE_RUNNER" clean-gate \
            --protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --root clean_collected \
            --out clean_gate/CLEAN_SURFACE_GATE.json \
            > clean_gate/CLEAN_SURFACE_GATE_STDOUT.txt
          cat clean_gate/CLEAN_SURFACE_GATE_STDOUT.txt
          python3 - <<'PY'
          import json
          r=json.load(open('clean_gate/CLEAN_SURFACE_GATE.json'))
          assert r['provenance']['kinetic_inputs_used'] is False
          print('CLEAN_SURFACE_STATUS='+r['status'])
          print('NEXT_GATE='+r['next_gate'])
          print('SCIENTIFIC_SETTINGS_CHANGED=false')
          print('KINETIC_INPUTS_USED=false')
          if r['status']=='NUMERICAL_HOLD':
              print('SCIENTIFIC_HOLD=true')
          PY

      - name: Upload unchanged clean-surface adjudication
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-clean-surface-audit-proposal-relay-gate-v1
          path: clean_gate
          retention-days: 90
          if-no-files-found: error

name: Na Cu001 C7 retarget definitive audit
on:
  workflow_dispatch:
  push:
    branches: [agent/na-cu001-integration]
    paths: ['.github/workflows/na-cu001-c7-retarget-audit.yml']
permissions:
  contents: write
jobs:
  retarget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Retarget audit and register replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/na-cu001-c7-definitive-audit.yml')
          text=path.read_text()
          replacements={
              "SOURCE_C7_RUN_ID: '30868933678'":"SOURCE_C7_RUN_ID: '30884387608'",
              "SOURCE_C7_COMMIT: 'd1a3fe747c8f3975575999f47d346471bdf7e7cc'":"SOURCE_C7_COMMIT: '73c0fdfe411d30bab9135fe2e76aafef1eebf820'",
          }
          for old,new in replacements.items():
              if text.count(old)!=1:
                  raise SystemExit(f'exact audit retarget anchor count is {text.count(old)}, expected 1: {old}')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
          git add .github/workflows/na-cu001-c7-definitive-audit.yml
          git commit -m 'chore(na-cu001): retarget audit to timeout-safe C7 run'
          audit_sha=$(git rev-parse HEAD)
          git push
          python3 - "$audit_sha" <<'PY'
          from pathlib import Path
          import sys
          audit_sha=sys.argv[1]
          path=Path('.github/workflows/na-cu001-c7-definitive-audit-run-locator.yml')
          text=path.read_text()
          old='          AUDIT_SHA: d05c7e8b54d87aa4eec3c242411a7d42a4ff5475'
          new=f'          AUDIT_SHA: {audit_sha}'
          if text.count(old)!=1:
              raise SystemExit(f'exact audit locator anchor count is {text.count(old)}, expected 1')
          text=text.replace(old,new,1)
          text=text.replace("git commit -m 'chore(na-cu001): record dependency-fixed C7 audit run'", "git commit -m 'chore(na-cu001): record timeout-safe C7 audit run'", 1)
          path.write_text(text)
          PY
          git add .github/workflows/na-cu001-c7-definitive-audit-run-locator.yml
          git commit -m 'chore(na-cu001): locate timeout-safe C7 audit'
          git push

name: Na Cu001 C7 audit run locator

on:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/na-cu001-c7-audit-locator.yml'

permissions:
  contents: write
  actions: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record definitive audit run
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCH_SHA: 166ac10bd2d9218dc10612a797659ef04a89de7a
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            result=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Na Cu001 C7 definitive slab audit" \
              --commit "$LAUNCH_SHA" \
              --limit 10 \
              --json databaseId,status,conclusion,headSha,url,createdAt \
              --jq '.[0] // empty')
            if [[ -n "$result" ]]; then break; fi
            sleep 10
          done
          [[ -n "$result" ]]
          mkdir -p na_cu001_ci/checkpoints
          printf '%s\n' "$result" > na_cu001_ci/checkpoints/C7_DEFINITIVE_AUDIT_RUN.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add na_cu001_ci/checkpoints/C7_DEFINITIVE_AUDIT_RUN.json
          git commit -m 'chore(na-cu001): record strict-holdout C7 audit run'
          git push

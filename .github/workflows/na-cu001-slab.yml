name: Na Cu001 preregistered clean-slab convergence

on:
  push:
    branches:
      - agent/na-cu001-slab
    paths:
      - 'na_cu001_ci/frozen_bulk_input/BULK_HANDOFF.json'
      - 'na_cu001_ci/frozen_bulk_input/BULK_CONVERGENCE_RESULT.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: na-cu001-slab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean-slab-convergence:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen bulk inputs exist
        shell: bash
        run: |
          set -euxo pipefail
          test -s na_cu001_ci/frozen_bulk_input/BULK_HANDOFF.json
          test -s na_cu001_ci/frozen_bulk_input/BULK_CONVERGENCE_RESULT.json
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make m4 perl curl ca-certificates \
            libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - name: Download and build exact Quantum ESPRESSO 7.6 PWscf
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/qe-src" qe_bundle/bin qe_bundle/meta
          curl -L --retry 5 --retry-delay 5 \
            https://gitlab.com/QEF/q-e/-/archive/qe-7.6/q-e-qe-7.6.tar.gz \
            -o "$RUNNER_TEMP/qe-7.6.tar.gz"
          sha256sum "$RUNNER_TEMP/qe-7.6.tar.gz" | tee qe_bundle/meta/qe_source.sha256
          tar -xzf "$RUNNER_TEMP/qe-7.6.tar.gz" -C "$RUNNER_TEMP/qe-src" --strip-components=1
          cd "$RUNNER_TEMP/qe-src"
          ./configure MPIF90=mpif90 F90=gfortran CC=mpicc
          make -j2 pw
          cp bin/pw.x "$GITHUB_WORKSPACE/qe_bundle/bin/pw.x"
          grep -R "version_number = '7.6'" include/qe_version.h | tee "$GITHUB_WORKSPACE/qe_bundle/meta/qe_version_source.txt"
          (cd "$GITHUB_WORKSPACE/qe_bundle" && sha256sum bin/pw.x > meta/pw_x.sha256)
      - name: Download pinned SSSP v2 PBE-efficiency Cu pseudopotential
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p qe_bundle/pseudos qe_bundle/meta/sssp_archive
          curl -L --retry 5 --retry-delay 5 \
            https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/refs/heads/main/2-experiments/finalized_scripts/010-extract-eff-lib/SSSP-lib-pbe-eff-v2.tar.gz \
            -o qe_bundle/meta/SSSP-lib-pbe-eff-v2.tar.gz
          sha256sum qe_bundle/meta/SSSP-lib-pbe-eff-v2.tar.gz | tee qe_bundle/meta/sssp_archive.sha256
          tar -xzf qe_bundle/meta/SSSP-lib-pbe-eff-v2.tar.gz -C qe_bundle/meta/sssp_archive
          find qe_bundle/meta/sssp_archive -type f -name 'Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf' -print -quit > qe_bundle/meta/cu_pseudo_path.txt
          test -s qe_bundle/meta/cu_pseudo_path.txt
          cp "$(cat qe_bundle/meta/cu_pseudo_path.txt)" qe_bundle/pseudos/
          (cd qe_bundle && sha256sum pseudos/Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf > meta/cu_pseudo.sha256)
      - name: Derive registered surface k meshes
        id: grid
        shell: bash
        run: |
          set -euxo pipefail
          KMESHES=$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'na_cu001_ci')
          from slab_runner import load_bulk, registered_kmeshes
          b = load_bulk(
              Path('na_cu001_ci/frozen_bulk_input/BULK_HANDOFF.json'),
              Path('na_cu001_ci/frozen_bulk_input/BULK_CONVERGENCE_RESULT.json'),
          )
          print(' '.join(map(str, registered_kmeshes(b['bulk_kmesh']))))
          PY
          )
          echo "kmeshes=$KMESHES" >> "$GITHUB_OUTPUT"
          echo "Registered k meshes: $KMESHES"
      - name: Run complete preregistered 64-SCF clean-slab matrix
        shell: bash
        env:
          OMP_NUM_THREADS: '1'
          KMESHES: ${{ steps.grid.outputs.kmeshes }}
        run: |
          set -euxo pipefail
          mkdir -p slab_outputs
          for layers in 5 7 9 11; do
            for vacuum in 12 16 20 24; do
              for kmesh in $KMESHES; do
                python3 na_cu001_ci/slab_runner.py run \
                  --layers "$layers" --vacuum "$vacuum" --kmesh "$kmesh" \
                  --handoff na_cu001_ci/frozen_bulk_input/BULK_HANDOFF.json \
                  --bulk-result na_cu001_ci/frozen_bulk_input/BULK_CONVERGENCE_RESULT.json \
                  --pw "$GITHUB_WORKSPACE/qe_bundle/bin/pw.x" \
                  --pseudo-dir "$GITHUB_WORKSPACE/qe_bundle/pseudos" \
                  --out "$GITHUB_WORKSPACE/slab_outputs" --np 2
              done
            done
          done
      - name: Apply preregistered clean-slab convergence gate
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p final_results
          python3 na_cu001_ci/slab_runner.py analyze \
            --records slab_outputs \
            --out final_results/CLEAN_SLAB_CONVERGENCE_RESULT.json \
            | tee final_results/CLEAN_SLAB_CONVERGENCE_STDOUT.txt
          cp na_cu001_ci/frozen_bulk_input/*.json final_results/
          cp -r qe_bundle/meta final_results/qe_and_pseudo_identity
          find final_results -type f -print0 | sort -z | xargs -0 sha256sum > final_results/MANIFEST.sha256
      - name: Publish clean-slab decision to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Na/Cu(001) clean-slab convergence decision'
            echo
            if [[ -f final_results/CLEAN_SLAB_CONVERGENCE_RESULT.json ]]; then
              echo '```json'
              python3 - <<'PY'
          import json
          d=json.load(open('final_results/CLEAN_SLAB_CONVERGENCE_RESULT.json'))
          print(json.dumps({
              'gate': d['gate'],
              'recommended_smallest': d['recommended_smallest'],
              'bulk_gate_revalidation': d['bulk_provenance']['bulk_gate_revalidation'],
          }, indent=2))
          PY
              echo '```'
            else
              echo '_No clean-slab result was generated._'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compact clean-slab result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-cu001-clean-slab-decision
          path: final_results
          retention-days: 90
          if-no-files-found: warn
      - name: Upload raw clean-slab outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-cu001-clean-slab-raw
          path: slab_outputs
          retention-days: 30
          if-no-files-found: warn

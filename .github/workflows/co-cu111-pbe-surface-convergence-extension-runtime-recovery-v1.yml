name: CO Cu111 PBE surface convergence extension runtime recovery v1

on:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/co-cu111-pbe-surface-convergence-extension-runtime-recovery-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: co-cu111-pbe-surface-convergence-extension-runtime-recovery-v1
  cancel-in-progress: false

env:
  EXT_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_CONVERGENCE_EXTENSION_v0.1.json
  RECOVERY_AMENDMENT: systems/co_cu111/SYSTEM2_PBE_SURFACE_CONVERGENCE_EXTENSION_RUNTIME_RECOVERY_v0.1.json
  EXT_RUNNER: systems/co_cu111/pbe_surface_convergence_extension_v1.py
  EXT_TEST: systems/co_cu111/test_pbe_surface_convergence_extension_v1.py
  SURFACE_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_SITE_ORDERING_PROTOCOL_v0.1.json
  BUNDLE: systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
  FAILED_RUN_ID: '33313295522'
  FAILED_ARTIFACT: co-cu111-pbe-surface-convergence-extension-L15-V32-K28-seg1
  SOURCE_HOLD_RUN_ID: '33306112961'
  SOURCE_HOLD_ARTIFACT: co-cu111-pbe-clean-surface-gate-recovery-v1
  L13_REFERENCE_RUN_ID: '33296522880'
  L13_REFERENCE_ARTIFACT: co-cu111-pbe-clean-audit-reproduction-recovery-v2-L13-V28-K24
  SELECTION_RUN_ID: '32915640451'
  SELECTION_ARTIFACT: co-cu111-pbe-surface-audit-rank-selection-v1
  ENGINE_RUN_ID: '31371043888'
  ENGINE_ARTIFACT: co-cu111-pbe-stage-a-engine-v2
  STAGE_A_RUN_ID: '31887006685'
  STAGE_A_ARTIFACT: co-cu111-pbe-stage-a-numerical-extension-decision-v1
  SOURCE_SURFACE_RUN_ID: '31922544540'
  CONTINUATION_RUNTIME_CAP_S: '21420'
  REPRO_RUNTIME_CAP_S: '19200'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  prepare:
    name: prepare-runtime-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen code and runtime amendment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$EXT_RUNNER" "$EXT_TEST"
          echo '518583a18ec5a26b442523601e325b2b525fd5a374f37c255eb9c5fff163ebd7  '$EXT_PROTOCOL | sha256sum -c -
          echo 'c424ce5fb94b442f603fda79a64fcb2540aef11ba59a7e5fc960d64aa790750c  '$RECOVERY_AMENDMENT | sha256sum -c -
          echo '00f32beaa072ca474125e2296ad610215457f936faab2e03b5675ccf21453fbb  '$EXT_RUNNER | sha256sum -c -
          echo '83145d7f50b1597801426ea647115e94c2467250a1f5ea907d201d0ad9053871  '$EXT_TEST | sha256sum -c -
          echo '1bb01d81beade1642da46449770638967a103f43ee63081b3ae5b8509f1c156f  '$SURFACE_PROTOCOL | sha256sum -c -
          echo '6a2216a776cbe3bf8a08e1f7215bcf0ff77caf96a2f2529875a0157f4bbfed3f  '$BUNDLE | sha256sum -c -
          python3 "$EXT_RUNNER" self-test --protocol "$EXT_PROTOCOL"
          python3 "$EXT_TEST" -v
          python3 - <<'PY'
          import json,os
          a=json.load(open(os.environ['RECOVERY_AMENDMENT']))
          assert a['status']=='FROZEN_BEFORE_RUNTIME_RECOVERY_RESULTS'
          assert a['mechanical_change']['original_continuation_runtime_cap_seconds']==19800
          assert a['mechanical_change']['recovery_continuation_runtime_cap_seconds']==21420
          assert a['mechanical_change']['electronic_scratch_reused'] is False
          assert a['unchanged_scientific_contract']['scientific_settings_changed'] is False
          assert a['unchanged_scientific_contract']['thresholds_changed'] is False
          assert a['unchanged_scientific_contract']['mpi_requalification_allowed'] is False
          print('RUNTIME_RECOVERY_AMENDMENT_VERIFIED')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.FAILED_ARTIFACT }}
          path: failed_segment1
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.FAILED_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify source failure is pre-force and pre-BFGS
        shell: bash
        run: |
          set -euo pipefail
          echo '983b11054b322660b72229bfdb62b2de2676815bef8b9a1efb9dea093b23a64d  failed_segment1/relax/clean_relax.in' | sha256sum -c -
          echo 'd713bdf2bc81b522969687b2c9f2b78e904be87d1720e8235ed227ecb53a7875  failed_segment1/relax/clean_relax.out' | sha256sum -c -
          test ! -e failed_segment1/SURFACE_CONVERGENCE_EXTENSION_SEGMENT.json
          test "$(grep -c 'Forces acting on atoms' failed_segment1/relax/clean_relax.out || true)" = 0
          test "$(grep -ci 'bfgs' failed_segment1/relax/clean_relax.out || true)" = 0
          grep -q 'iteration # 28' failed_segment1/relax/clean_relax.out
          if grep -q 'JOB DONE' failed_segment1/relax/clean_relax.out; then exit 1; fi
          echo SOURCE_FAILURE_CLASS=MECHANICAL_PRE_BFGS_SCF_TIMEOUT
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_HOLD_ARTIFACT }}
          path: source_hold
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_HOLD_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.L13_REFERENCE_ARTIFACT }}
          path: l13_reference
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.L13_REFERENCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SELECTION_ARTIFACT }}
          path: selection
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SELECTION_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Reverify immutable scientific inputs
        shell: bash
        env:
          CO_CU111_HOLD_FIXTURE: ${{ github.workspace }}/source_hold
          CO_CU111_L13_FIXTURE: ${{ github.workspace }}/l13_reference
        run: |
          set -euo pipefail
          echo 'afa8239acbb6ed08b92fcff881bbf4f33f95cb196c595c1f1940a100fab251b3  source_hold/CLEAN_SURFACE_GATE.json' | sha256sum -c -
          echo 'f199a2a26e1465a8cff815a0568ea2d1eb24b31a74868a061523b93c09859ddc  l13_reference/summary.json' | sha256sum -c -
          echo 'e8b99f660762724922a9be153b374ccf9fc7f269744570b978d5d2e2b15de0a4  selection/RANK_SELECTION_RESULT.json' | sha256sum -c -
          python3 "$EXT_RUNNER" verify-sources --protocol "$EXT_PROTOCOL" --hold-root source_hold --l13-root l13_reference
          python3 - <<'PY'
          import json
          r=json.load(open('selection/RANK_SELECTION_RESULT.json'))
          assert r['status']=='PASS' and r['selected_execution_mode']=='DIRECT_ONE_RANK' and r['selected_mpi_ranks']==1
          assert r['four_rank_excluded'] is True and r['scientific_settings_changed'] is False and r['kinetic_inputs_used'] is False
          print('DIRECT_ONE_RANK_SELECTION_REVERIFIED')
          PY

  continue_1:
    name: continue-1 / L15 logical-1
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env: {SEGMENT: '1', PREV_SEGMENT: '0'}
    steps: &continuation_steps
      - uses: actions/checkout@v4
      - if: env.SEGMENT == '1'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.L13_REFERENCE_ARTIFACT }}
          path: prior
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.L13_REFERENCE_RUN_ID }}
          github-token: ${{ github.token }}
      - if: env.SEGMENT != '1'
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-surface-convergence-extension-runtime-recovery-v1-L15-V32-K28-seg${{ env.PREV_SEGMENT }}
          path: prior
      - name: Inspect prior checkpoint
        id: prior
        shell: bash
        run: |
          set -euo pipefail
          info="$(python3 "$EXT_RUNNER" inspect-prior --protocol "$EXT_PROTOCOL" --prior-root prior --segment "$SEGMENT")"
          echo "$info"
          carry="$(printf '%s\n' "$info" | awk -F= '/^CARRY=/{print $2}')"
          test "$carry" = true -o "$carry" = false
          echo "carry=$carry" >> "$GITHUB_OUTPUT"
      - if: steps.prior.outputs.carry != 'true'
        name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - if: steps.prior.outputs.carry != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - if: steps.prior.outputs.carry != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - if: steps.prior.outputs.carry != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SELECTION_ARTIFACT }}
          path: selection
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SELECTION_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Continue unchanged L15 audit with runtime recovery
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.prior.outputs.carry }}" = true ]; then
            python3 "$EXT_RUNNER" continue --protocol "$EXT_PROTOCOL" --prior-root prior --segment "$SEGMENT" --runtime-cap-s "$CONTINUATION_RUNTIME_CAP_S" --out segment_out
          else
            chmod +x engine/bin/pw.x
            python3 "$EXT_RUNNER" continue --protocol "$EXT_PROTOCOL" --prior-root prior --segment "$SEGMENT" \
              --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
              --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
              --selection selection/RANK_SELECTION_RESULT.json --runtime-cap-s "$CONTINUATION_RUNTIME_CAP_S" --out segment_out
          fi
          cp "$RECOVERY_AMENDMENT" segment_out/RUNTIME_RECOVERY_AMENDMENT.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('segment_out/SURFACE_CONVERGENCE_EXTENSION_SEGMENT.json'))
          print('SEGMENT_STATUS='+r['status'])
          print('L15_LOGICAL_SEGMENT='+str(r['logical_segment']))
          print('L15_FORCE_EV_A='+str(r['latest_authoritative_max_movable_force_ev_per_angstrom']))
          print('CARRIED_FORWARD='+str(r['carried_forward_without_recomputation']).lower())
          print('EFFECTIVE_RUNTIME_CAP_S='+os.environ['CONTINUATION_RUNTIME_CAP_S'])
          print('SCIENTIFIC_SETTINGS_CHANGED='+str(r['scientific_settings_changed']).lower())
          print('THRESHOLDS_CHANGED='+str(r['thresholds_changed']).lower())
          print('KINETIC_INPUTS_USED='+str(r['kinetic_inputs_used']).lower())
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-surface-convergence-extension-runtime-recovery-v1-L15-V32-K28-seg${{ env.SEGMENT }}
          path: segment_out
          retention-days: 90
          if-no-files-found: error

  continue_2: {name: 'continue-2 / L15 logical-2', needs: continue_1, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '2', PREV_SEGMENT: '1'}, steps: *continuation_steps}
  continue_3: {name: 'continue-3 / L15 logical-3', needs: continue_2, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '3', PREV_SEGMENT: '2'}, steps: *continuation_steps}
  continue_4: {name: 'continue-4 / L15 logical-4', needs: continue_3, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '4', PREV_SEGMENT: '3'}, steps: *continuation_steps}
  continue_5: {name: 'continue-5 / L15 logical-5', needs: continue_4, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '5', PREV_SEGMENT: '4'}, steps: *continuation_steps}
  continue_6: {name: 'continue-6 / L15 logical-6', needs: continue_5, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '6', PREV_SEGMENT: '5'}, steps: *continuation_steps}
  continue_7: {name: 'continue-7 / L15 logical-7', needs: continue_6, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '7', PREV_SEGMENT: '6'}, steps: *continuation_steps}
  continue_8: {name: 'continue-8 / L15 logical-8', needs: continue_7, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '8', PREV_SEGMENT: '7'}, steps: *continuation_steps}
  continue_9: {name: 'continue-9 / L15 logical-9', needs: continue_8, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '9', PREV_SEGMENT: '8'}, steps: *continuation_steps}
  continue_10: {name: 'continue-10 / L15 logical-10', needs: continue_9, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '10', PREV_SEGMENT: '9'}, steps: *continuation_steps}
  continue_11: {name: 'continue-11 / L15 logical-11', needs: continue_10, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '11', PREV_SEGMENT: '10'}, steps: *continuation_steps}
  continue_12: {name: 'continue-12 / L15 logical-12', needs: continue_11, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '12', PREV_SEGMENT: '11'}, steps: *continuation_steps}
  continue_13: {name: 'continue-13 / L15 logical-13', needs: continue_12, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '13', PREV_SEGMENT: '12'}, steps: *continuation_steps}
  continue_14: {name: 'continue-14 / L15 logical-14', needs: continue_13, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '14', PREV_SEGMENT: '13'}, steps: *continuation_steps}
  continue_15: {name: 'continue-15 / L15 logical-15', needs: continue_14, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '15', PREV_SEGMENT: '14'}, steps: *continuation_steps}
  continue_16: {name: 'continue-16 / L15 logical-16', needs: continue_15, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '16', PREV_SEGMENT: '15'}, steps: *continuation_steps}
  continue_17: {name: 'continue-17 / L15 logical-17', needs: continue_16, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '17', PREV_SEGMENT: '16'}, steps: *continuation_steps}
  continue_18: {name: 'continue-18 / L15 logical-18', needs: continue_17, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '18', PREV_SEGMENT: '17'}, steps: *continuation_steps}
  continue_19: {name: 'continue-19 / L15 logical-19', needs: continue_18, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '19', PREV_SEGMENT: '18'}, steps: *continuation_steps}
  continue_20: {name: 'continue-20 / L15 logical-20', needs: continue_19, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '20', PREV_SEGMENT: '19'}, steps: *continuation_steps}
  continue_21: {name: 'continue-21 / L15 logical-21', needs: continue_20, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '21', PREV_SEGMENT: '20'}, steps: *continuation_steps}
  continue_22: {name: 'continue-22 / L15 logical-22', needs: continue_21, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '22', PREV_SEGMENT: '21'}, steps: *continuation_steps}
  continue_23: {name: 'continue-23 / L15 logical-23', needs: continue_22, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '23', PREV_SEGMENT: '22'}, steps: *continuation_steps}
  continue_24: {name: 'continue-24 / L15 logical-24', needs: continue_23, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '24', PREV_SEGMENT: '23'}, steps: *continuation_steps}
  continue_25: {name: 'continue-25 / L15 logical-25', needs: continue_24, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '25', PREV_SEGMENT: '24'}, steps: *continuation_steps}
  continue_26: {name: 'continue-26 / L15 logical-26', needs: continue_25, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '26', PREV_SEGMENT: '25'}, steps: *continuation_steps}
  continue_27: {name: 'continue-27 / L15 logical-27', needs: continue_26, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '27', PREV_SEGMENT: '26'}, steps: *continuation_steps}
  continue_28: {name: 'continue-28 / L15 logical-28', needs: continue_27, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '28', PREV_SEGMENT: '27'}, steps: *continuation_steps}
  continue_29: {name: 'continue-29 / L15 logical-29', needs: continue_28, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '29', PREV_SEGMENT: '28'}, steps: *continuation_steps}
  continue_30: {name: 'continue-30 / L15 logical-30', needs: continue_29, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '30', PREV_SEGMENT: '29'}, steps: *continuation_steps}
  continue_31: {name: 'continue-31 / L15 logical-31', needs: continue_30, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '31', PREV_SEGMENT: '30'}, steps: *continuation_steps}
  continue_32: {name: 'continue-32 / L15 logical-32', needs: continue_31, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '32', PREV_SEGMENT: '31'}, steps: *continuation_steps}
  continue_33: {name: 'continue-33 / L15 logical-33', needs: continue_32, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '33', PREV_SEGMENT: '32'}, steps: *continuation_steps}
  continue_34: {name: 'continue-34 / L15 logical-34', needs: continue_33, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '34', PREV_SEGMENT: '33'}, steps: *continuation_steps}
  continue_35: {name: 'continue-35 / L15 logical-35', needs: continue_34, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '35', PREV_SEGMENT: '34'}, steps: *continuation_steps}
  continue_36: {name: 'continue-36 / L15 logical-36', needs: continue_35, runs-on: ubuntu-24.04, timeout-minutes: 360, env: {SEGMENT: '36', PREV_SEGMENT: '35'}, steps: *continuation_steps}

  reproduce_l15_audit:
    name: reproduce-L15-audit
    needs: continue_36
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-pbe-surface-convergence-extension-runtime-recovery-v1-L15-V32-K28-seg36, path: prior}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.ENGINE_ARTIFACT }}', path: engine, repository: SymC-Universe/Chemistry, run-id: '${{ env.ENGINE_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.STAGE_A_ARTIFACT }}', path: stage_a_decision, repository: SymC-Universe/Chemistry, run-id: '${{ env.STAGE_A_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.SELECTION_ARTIFACT }}', path: selection, repository: SymC-Universe/Chemistry, run-id: '${{ env.SELECTION_RUN_ID }}', github-token: '${{ github.token }}'}
      - name: Fresh independent L15 SCF reproduction
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$EXT_RUNNER" reproduce --protocol "$EXT_PROTOCOL" --prior-root prior \
            --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
            --selection selection/RANK_SELECTION_RESULT.json --runtime-cap-s "$REPRO_RUNTIME_CAP_S" --out l15_reproduced
          cp "$RECOVERY_AMENDMENT" l15_reproduced/RUNTIME_RECOVERY_AMENDMENT.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: co-cu111-pbe-surface-convergence-extension-runtime-recovery-v1-L15-reproduced, path: l15_reproduced, retention-days: 90, if-no-files-found: error}

  extension_clean_surface_gate:
    name: extension-clean-surface-gate
    needs: reproduce_l15_audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.SOURCE_HOLD_ARTIFACT }}', path: source_hold, repository: SymC-Universe/Chemistry, run-id: '${{ env.SOURCE_HOLD_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.L13_REFERENCE_ARTIFACT }}', path: l13_reference, repository: SymC-Universe/Chemistry, run-id: '${{ env.L13_REFERENCE_RUN_ID }}', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: co-cu111-pbe-surface-convergence-extension-runtime-recovery-v1-L15-reproduced, path: l15_reproduced}
      - uses: actions/download-artifact@v4
        with:
          pattern: 'co-cu111-pbe-clean-v1-*'
          path: candidates
          merge-multiple: false
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_SURFACE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with: {name: '${{ env.STAGE_A_ARTIFACT }}', path: stage_a_decision, repository: SymC-Universe/Chemistry, run-id: '${{ env.STAGE_A_RUN_ID }}', github-token: '${{ github.token }}'}
      - name: Apply unchanged L13-L15 and candidate gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extension_gate
          python3 "$EXT_RUNNER" gate --protocol "$EXT_PROTOCOL" \
            --hold-root source_hold --l13-root l13_reference --l15-root l15_reproduced --candidate-root candidates \
            --surface-protocol "$SURFACE_PROTOCOL" --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --out extension_gate/SURFACE_CONVERGENCE_EXTENSION_GATE.json
          cp "$RECOVERY_AMENDMENT" extension_gate/RUNTIME_RECOVERY_AMENDMENT.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: co-cu111-pbe-surface-convergence-extension-runtime-recovery-v1-final-gate, path: extension_gate, retention-days: 90, if-no-files-found: error}

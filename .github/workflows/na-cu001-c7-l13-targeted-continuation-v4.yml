name: Na Cu001 C7 L13 targeted continuation v4

on:
  workflow_dispatch:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/na-cu001-c7-l13-targeted-continuation-v4.yml'

permissions:
  contents: read
  actions: read

# Intentionally share the v3 concurrency group. The new targeted continuation
# supersedes the stale queued v3 attempt instead of allowing duplicate compute.
concurrency:
  group: na-cu001-c7-l13-timeout-recovery-v3
  cancel-in-progress: true

env:
  FROZEN_SOURCE_COMMIT: '055b2f5d782c2a590e65ad429cefd0981f0dd37b'
  L13_RUN_ID: '31030768817'
  CHECKPOINT_SOURCE_RUN_ID: '31100987014'
  OMP_NUM_THREADS: '1'
  SEGMENT_MAX_SECONDS: '13500'
  PSEUDO_NAME: 'Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen continuation control code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            na_cu001_ci/slab_l13_checkpoint_recovery_v3.py \
            na_cu001_ci/test_slab_l13_checkpoint_recovery_v3.py
          (cd na_cu001_ci && python3 test_slab_l13_checkpoint_recovery_v3.py)

  resume-1:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - vacuum: 16
            kmesh: 22
            slug: v16_k22
            segment: 2
            source_artifact_id: 8974053358
            source_artifact_name: na-cu001-c7-l13-v3-v16_k22-stage-a
            source_artifact_digest: sha256:5489cc45bb3a431a19b82c9b4c9474da43abc77afef0b6dd0c3620b57b1e2b3d
          - vacuum: 24
            kmesh: 22
            slug: v24_k22
            segment: 3
            source_artifact_id: 8974082543
            source_artifact_name: na-cu001-c7-l13-v3-v24_k22-stage-a
            source_artifact_digest: sha256:1c29fbf8a6d82196b97ab741d5bd3174fd9b0283b088aba49cf577fbf485c09d
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_SOURCE_COMMIT }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.source_artifact_name }}
          path: work
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.CHECKPOINT_SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-base
          path: base_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.L13_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-qe
          path: qe_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.L13_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Install frozen runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev libopenblas-dev liblapack-dev libfftw3-dev python3-numpy
          test "$(git -C frozen rev-parse HEAD)" = "$FROZEN_SOURCE_COMMIT"
          chmod +x qe_bundle/bin/pw.x
      - name: Verify imported clean checkpoint identity
        shell: bash
        run: |
          set -euo pipefail
          status='work/stage_a_status_${{ matrix.slug }}.json'
          python3 - "$status" '${{ matrix.vacuum }}' '${{ matrix.kmesh }}' <<'PY'
          import json, sys
          path, vacuum, kmesh = sys.argv[1], float(sys.argv[2]), int(sys.argv[3])
          row = json.load(open(path))
          case = row.get('case') or {}
          assert row.get('frozen_source_commit') == '055b2f5d782c2a590e65ad429cefd0981f0dd37b'
          assert int(case.get('layers', -1)) == 13
          assert abs(float(case.get('vacuum_angstrom', -1)) - vacuum) <= 1e-12
          assert int(case.get('kmesh_inplane', -1)) == kmesh
          assert int(row.get('mpi_processes', -1)) == 2
          assert row.get('complete') is False
          state = row.get('new_restart_state') or {}
          assert int(state.get('file_count', 0)) > 0
          assert int(state.get('total_bytes', 0)) > 0
          assert len(str(state.get('manifest_sha256', ''))) == 64
          PY
          cat > 'work/continuation_source_${{ matrix.slug }}.json' <<JSON
          {
            "source_run_id": $CHECKPOINT_SOURCE_RUN_ID,
            "source_artifact_id": ${{ matrix.source_artifact_id }},
            "source_artifact_name": "${{ matrix.source_artifact_name }}",
            "source_artifact_digest": "${{ matrix.source_artifact_digest }}",
            "source_status": "stage_a_status_${{ matrix.slug }}.json",
            "reason": "resume from last clean controlled checkpoint; do not use interrupted stage-b state"
          }
          JSON
      - name: Resume clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 control/na_cu001_ci/slab_l13_checkpoint_recovery_v3.py segment \
            --source-dir frozen/na_cu001_ci \
            --segment '${{ matrix.segment }}' \
            --restart-mode restart \
            --max-seconds "$SEGMENT_MAX_SECONDS" \
            --layers 13 \
            --vacuum '${{ matrix.vacuum }}' \
            --kmesh '${{ matrix.kmesh }}' \
            --handoff base_bundle/base/BULK_HANDOFF.json \
            --bulk-result base_bundle/base/BULK_CONVERGENCE_RESULT.json \
            --pw qe_bundle/bin/pw.x \
            --pseudo-dir qe_bundle/pseudos \
            --out 'work/l13_outputs/l13_${{ matrix.slug }}' \
            --np 2 \
            --status-out 'work/resume1_status_${{ matrix.slug }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: na-cu001-c7-l13-v4-${{ matrix.slug }}-resume1
          path: work
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  resume-2:
    needs: resume-1
    if: always() && needs.resume-1.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - vacuum: 16
            kmesh: 22
            slug: v16_k22
            segment: 3
          - vacuum: 24
            kmesh: 22
            slug: v24_k22
            segment: 4
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_SOURCE_COMMIT }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v4-${{ matrix.slug }}-resume1
          path: work
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-base
          path: base_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.L13_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-qe
          path: qe_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.L13_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Install frozen runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev libopenblas-dev liblapack-dev libfftw3-dev python3-numpy
          test "$(git -C frozen rev-parse HEAD)" = "$FROZEN_SOURCE_COMMIT"
          chmod +x qe_bundle/bin/pw.x
      - name: Resume if still incomplete
        shell: bash
        run: |
          set -euo pipefail
          previous='work/resume1_status_${{ matrix.slug }}.json'
          current='work/resume2_status_${{ matrix.slug }}.json'
          complete="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["complete"]).lower())' "$previous")"
          if test "$complete" = true; then
            cp "$previous" "$current"
          else
            python3 control/na_cu001_ci/slab_l13_checkpoint_recovery_v3.py segment \
              --source-dir frozen/na_cu001_ci \
              --segment '${{ matrix.segment }}' \
              --restart-mode restart \
              --max-seconds "$SEGMENT_MAX_SECONDS" \
              --layers 13 \
              --vacuum '${{ matrix.vacuum }}' \
              --kmesh '${{ matrix.kmesh }}' \
              --handoff base_bundle/base/BULK_HANDOFF.json \
              --bulk-result base_bundle/base/BULK_CONVERGENCE_RESULT.json \
              --pw qe_bundle/bin/pw.x \
              --pseudo-dir qe_bundle/pseudos \
              --out 'work/l13_outputs/l13_${{ matrix.slug }}' \
              --np 2 \
              --status-out "$current"
          fi
          test "$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["complete"]).lower())' "$current")" = true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: na-cu001-c7-l13-v4-${{ matrix.slug }}-resume2
          path: work
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  publish-resumed:
    needs: resume-2
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: v16_k22
          - slug: v24_k22
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v4-${{ matrix.slug }}-resume2
          path: work
      - name: Compact and verify recovered evidence
        shell: bash
        run: |
          set -euo pipefail
          status='work/resume2_status_${{ matrix.slug }}.json'
          test "$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["complete"]).lower())' "$status")" = true
          case_root='work/l13_outputs/l13_${{ matrix.slug }}'
          find "$case_root" -type d \( -name tmp -o -name '*.save' \) -prune -exec rm -rf {} + 2>/dev/null || true
          find "$case_root" -type f \( -name '*.wfc*' -o -name charge-density.dat -o -name data-file-schema.xml -o -name RESTART_STATE.sha256 \) -delete 2>/dev/null || true
          mapfile -d '' compact_files < <(find "$case_root" -type f \( -name run_record.json -o -name 'cu001_*.in' -o -name 'cu001_*.out' \) -print0 | sort -z)
          test "${#compact_files[@]}" -eq 3
          printf '%s\0' "${compact_files[@]}" | xargs -0 sha256sum > "$case_root/COMPACT_EVIDENCE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c7-l13-v4-recovered-${{ matrix.slug }}
          path: |
            work/l13_outputs/**/run_record.json
            work/l13_outputs/**/*.in
            work/l13_outputs/**/*.out
            work/l13_outputs/**/COMPACT_EVIDENCE.sha256
            work/stage_a_status_${{ matrix.slug }}.json
            work/resume1_status_${{ matrix.slug }}.json
            work/resume2_status_${{ matrix.slug }}.json
            work/continuation_source_${{ matrix.slug }}.json
          retention-days: 90
          if-no-files-found: error

  publish-v24-k20:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v3-v24_k20-stage-a
          path: work
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.CHECKPOINT_SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify and compact already completed V24 K20
        shell: bash
        run: |
          set -euo pipefail
          status='work/stage_a_status_v24_k20.json'
          test "$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["complete"]).lower())' "$status")" = true
          python3 - "$status" <<'PY'
          import json, sys
          row = json.load(open(sys.argv[1]))
          case = row.get('case') or {}
          assert row.get('frozen_source_commit') == '055b2f5d782c2a590e65ad429cefd0981f0dd37b'
          assert int(case.get('layers', -1)) == 13
          assert abs(float(case.get('vacuum_angstrom', -1)) - 24.0) <= 1e-12
          assert int(case.get('kmesh_inplane', -1)) == 20
          assert int(row.get('mpi_processes', -1)) == 2
          assert row.get('complete') is True
          assert row.get('scf_converged') is True
          assert row.get('returncode') == 0
          assert row.get('final_energy_ev') is not None
          PY
          cat > work/continuation_source_v24_k20.json <<JSON
          {
            "source_run_id": $CHECKPOINT_SOURCE_RUN_ID,
            "source_artifact_id": 8972010073,
            "source_artifact_name": "na-cu001-c7-l13-v3-v24_k20-stage-a",
            "source_artifact_digest": "sha256:14678eceb79e2a0055675d28476b3f4269eaabb7d4a87d7f2d6dea73fe7b6216",
            "reason": "carry forward already completed converged case without recomputation"
          }
          JSON
          case_root='work/l13_outputs/l13_v24_k20'
          find "$case_root" -type d \( -name tmp -o -name '*.save' \) -prune -exec rm -rf {} + 2>/dev/null || true
          find "$case_root" -type f \( -name '*.wfc*' -o -name charge-density.dat -o -name data-file-schema.xml -o -name RESTART_STATE.sha256 \) -delete 2>/dev/null || true
          mapfile -d '' compact_files < <(find "$case_root" -type f \( -name run_record.json -o -name 'cu001_*.in' -o -name 'cu001_*.out' \) -print0 | sort -z)
          test "${#compact_files[@]}" -eq 3
          printf '%s\0' "${compact_files[@]}" | xargs -0 sha256sum > "$case_root/COMPACT_EVIDENCE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c7-l13-v4-recovered-v24_k20
          path: |
            work/l13_outputs/**/run_record.json
            work/l13_outputs/**/*.in
            work/l13_outputs/**/*.out
            work/l13_outputs/**/COMPACT_EVIDENCE.sha256
            work/bootstrap_status_v24_k20.json
            work/stage_a_status_v24_k20.json
            work/continuation_source_v24_k20.json
          retention-days: 90
          if-no-files-found: error

  recovery-summary:
    needs: [publish-resumed, publish-v24-k20]
    if: always() && needs.publish-resumed.result == 'success' && needs.publish-v24-k20.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write targeted continuation summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p summary
          cat > summary/RECOVERY_SUMMARY.json <<JSON
          {
            "schema": "na-cu001-l13-targeted-continuation-v0.1",
            "scientific_settings_changed": false,
            "frozen_source_commit": "$FROZEN_SOURCE_COMMIT",
            "original_l13_run_id": $L13_RUN_ID,
            "checkpoint_source_run_id": $CHECKPOINT_SOURCE_RUN_ID,
            "continuation_run_id": $GITHUB_RUN_ID,
            "supersedes_stale_recovery_run": true,
            "source_artifacts": [
              {"case":"v16_k22","artifact_id":8974053358,"digest":"sha256:5489cc45bb3a431a19b82c9b4c9474da43abc77afef0b6dd0c3620b57b1e2b3d"},
              {"case":"v24_k20","artifact_id":8972010073,"digest":"sha256:14678eceb79e2a0055675d28476b3f4269eaabb7d4a87d7f2d6dea73fe7b6216"},
              {"case":"v24_k22","artifact_id":8974082543,"digest":"sha256:1c29fbf8a6d82196b97ab741d5bd3174fd9b0283b088aba49cf577fbf485c09d"}
            ],
            "completed_cases": [
              {"layers":13,"vacuum_angstrom":16,"kmesh_inplane":22},
              {"layers":13,"vacuum_angstrom":24,"kmesh_inplane":20},
              {"layers":13,"vacuum_angstrom":24,"kmesh_inplane":22}
            ],
            "next_gate": "combine 13 original valid L13 artifacts with these 3 recovered artifacts and rerun the preregistered extension analysis"
          }
          JSON
          sha256sum summary/RECOVERY_SUMMARY.json > summary/RECOVERY_SUMMARY.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c7-l13-v4-recovery-summary
          path: summary
          retention-days: 90
          if-no-files-found: error

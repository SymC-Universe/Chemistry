name: CO Cu111 L15-L17 paid-runner exact restart qualification v1

on:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/co-cu111-l15-l17-restart-qualification-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: co-cu111-l15-l17-restart-qualification-v1
  cancel-in-progress: false

env:
  PROTOCOL: systems/co_cu111/SYSTEM2_PBE_L15_L17_SITE_DEPTH_DIAGNOSTIC_v0.2.json
  RUNNER: systems/co_cu111/pbe_l15_l17_site_depth_diagnostic_v2.py
  V1_RUNNER: systems/co_cu111/pbe_l15_l17_observable_sufficiency_v1.py
  SURFACE_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_SITE_ORDERING_PROTOCOL_v0.1.json
  BUNDLE: systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
  L15_RUN_ID: '33712992505'
  L15_ARTIFACT: co-cu111-l15-native-postrelax-reproduced-v1
  L17_RUN_ID: '33956049744'
  L17_RELAX_ARTIFACT: co-cu111-l17-exact-restart-relax-06
  L17_RESULT_ARTIFACT: co-cu111-l17-convergence-result-v1
  STAGE_A_RUN_ID: '31887006685'
  STAGE_A_ARTIFACT: co-cu111-pbe-stage-a-numerical-extension-decision-v1
  ENGINE_RUN_ID: '31371043888'
  ENGINE_ARTIFACT: co-cu111-pbe-stage-a-engine-v2
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  prepare:
    name: Verify frozen qualification inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify qualification firewall
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$V1_RUNNER" "$RUNNER"
          python3 "$RUNNER" self-test --protocol "$PROTOCOL"
          python3 - <<'PY'
          import json
          p=json.load(open('systems/co_cu111/SYSTEM2_PBE_L15_L17_SITE_DEPTH_DIAGNOSTIC_v0.2.json'))
          assert p['status']=='FROZEN_AFTER_V0_1_RESOURCE_HOLD_BEFORE_V0_2_RESULTS'
          assert p['matched_site_depth_diagnostic']['supercell']==[2,2]
          assert p['matched_site_depth_diagnostic']['kmesh']==8
          assert p['matched_site_depth_diagnostic']['nominal_coverage_ML']==0.25
          assert p['matched_site_depth_diagnostic']['slab_depth_sensitivity_max_ev_per_CO']==0.005
          assert p['execution']['checkpoint_mode']=='QE_CLEAN_MAX_SECONDS_EXACT_RESTART'
          assert p['execution']['qe_max_seconds_per_segment']==16200
          assert p['execution']['maximum_scf_segments']==6
          assert p['source_l17']['required_result_status']=='NUMERICAL_HOLD_L17_TERMINAL_UNDER_CURRENT_CONTRACT'
          assert p['source_l17']['original_surface_excess_gate_pass'] is False
          assert p['decision']['absolute_clean_surface_pass_claimed'] is False
          assert p['decision']['low_coverage_4x4_sufficiency_claimed'] is False
          assert p['decision']['automatic_l19_dispatch'] is False
          print('QUALIFICATION_FIREWALL_PASS')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.L15_ARTIFACT }}
          path: source_l15
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.L15_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.L17_RELAX_ARTIFACT }}
          path: source_l17_relax
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.L17_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.L17_RESULT_ARTIFACT }}
          path: source_l17_result
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.L17_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify immutable source evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" preflight --protocol "$PROTOCOL" --l15-root source_l15 --l17-root source_l17_relax --out preflight.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.load(open('systems/co_cu111/SYSTEM2_PBE_L15_L17_SITE_DEPTH_DIAGNOSTIC_v0.2.json'))
          result=Path('source_l17_result/L17_CONVERGENCE_RESULT.json')
          r=json.load(result.open())
          assert hashlib.sha256(result.read_bytes()).hexdigest()==p['source_l17']['result_json_sha256']
          assert r['status']=='NUMERICAL_HOLD_L17_TERMINAL_UNDER_CURRENT_CONTRACT'
          assert r['surface_excess_pass'] is False
          assert abs(r['l15_l17_delta_ev_per_surface_atom']-0.001106435876863543)<1e-15
          assert r['additional_scientific_rung_authorized'] is False
          print('ORIGINAL_L17_HOLD_PRESERVED')
          PY
          sha256sum -c engine/meta/STAGE_A_ENGINE.sha256
          chmod +x engine/bin/pw.x
      - uses: actions/upload-artifact@v4
        with:
          name: co-cu111-l15-l17-restart-qualification-inputs-v1
          path: |
            source_l15
            source_l17_relax
            source_l17_result
            stage_a_decision
            engine
            preflight.json
          retention-days: 30
          if-no-files-found: error

  segment_1:
    name: L15 top exact-restart qualification segment 1
    needs: prepare
    runs-on: ubuntu-latest-m
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify paid runner resource class
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "processors=$(nproc)"
          free -h
          python3 - <<'PY'
          from pathlib import Path
          total=None
          for line in Path('/proc/meminfo').read_text().splitlines():
              if line.startswith('MemTotal:'):
                  total=float(line.split()[1])/1024/1024
                  break
          assert total is not None
          print(f'runner_memtotal_gib={total:.3f}')
          if total < 48.0:
              raise SystemExit(f'MECHANICAL_HOLD: paid qualification runner exposes only {total:.3f} GiB')
          print('PAID_RUNNER_MEMORY_GATE_PASS')
          PY
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: co-cu111-l15-l17-restart-qualification-inputs-v1
          path: inputs
      - name: Run frozen L15 top segment 1 to completion or clean QE checkpoint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x inputs/engine/bin/pw.x
          python3 "$RUNNER" scf-segment \
            --protocol "$PROTOCOL" \
            --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result inputs/stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" \
            --pseudo-dir inputs/engine/pseudos \
            --pw inputs/engine/bin/pw.x \
            --l15-root inputs/source_l15 \
            --l17-root inputs/source_l17_relax \
            --depth L15 \
            --site top \
            --segment 1 \
            --out screen
      - name: Require admissible segment-1 state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.load(open('screen/L15_L17_SITE_SCF_STATE.json'))
          assert s['depth']=='L15' and s['site']=='top' and s['segment']==1
          assert s['restart_mode']=='from_scratch'
          assert s['checkpoint_semantics']=='QE_CLEAN_MAX_SECONDS_EXACT_RESTART'
          assert s['status'] in {'COMPLETE','CHECKPOINT'}, s
          assert s['wrapper_timeout'] is False
          assert s['original_l17_hold_preserved'] is True
          assert s['absolute_clean_surface_pass_claimed'] is False
          if s['status']=='CHECKPOINT':
              assert s['clean_max_seconds_stop'] is True
              assert s['checkpoint_manifest_sha256']
              assert Path('screen/qe_checkpoint').is_dir()
          else:
              assert s['job_done'] is True and s['scf_converged'] is True
          Path('screen/QUALIFICATION_SEGMENT1_OK').write_text(s['status']+'\n')
          print('SEGMENT1_ADMISSIBLE_'+s['status'])
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-l15-l17-restart-qualification-seg01-v1
          path: screen
          retention-days: 30
          if-no-files-found: error

  segment_2:
    name: L15 top exact restart or no-recompute carry qualification segment 2
    needs: segment_1
    runs-on: ubuntu-latest-m
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Verify paid runner resource class
        shell: bash
        run: |
          set -euo pipefail
          free -h
          python3 - <<'PY'
          from pathlib import Path
          total=None
          for line in Path('/proc/meminfo').read_text().splitlines():
              if line.startswith('MemTotal:'):
                  total=float(line.split()[1])/1024/1024
                  break
          assert total is not None and total >= 48.0, total
          print(f'PAID_RUNNER_MEMORY_GATE_PASS={total:.3f}_GiB')
          PY
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: co-cu111-l15-l17-restart-qualification-inputs-v1
          path: inputs
      - uses: actions/download-artifact@v4
        with:
          name: co-cu111-l15-l17-restart-qualification-seg01-v1
          path: prior
      - name: Verify prior state before continuation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          s=json.load(open('prior/L15_L17_SITE_SCF_STATE.json'))
          assert s['status'] in {'COMPLETE','CHECKPOINT'}
          assert s['segment']==1 and s['depth']=='L15' and s['site']=='top'
          assert s['checkpoint_semantics']=='QE_CLEAN_MAX_SECONDS_EXACT_RESTART'
          if s['status']=='CHECKPOINT':
              assert s['clean_max_seconds_stop'] is True
              assert s['checkpoint_manifest_sha256']
          print('PRIOR_STATE_VERIFIED_'+s['status'])
          PY
      - name: Resume exact QE checkpoint or carry COMPLETE without recomputation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x inputs/engine/bin/pw.x
          python3 "$RUNNER" scf-segment \
            --protocol "$PROTOCOL" \
            --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result inputs/stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" \
            --pseudo-dir inputs/engine/pseudos \
            --pw inputs/engine/bin/pw.x \
            --l15-root inputs/source_l15 \
            --l17-root inputs/source_l17_relax \
            --depth L15 \
            --site top \
            --segment 2 \
            --prior-root prior \
            --out screen
      - name: Prove exact restart or no-recompute carry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          prior=json.load(open('prior/L15_L17_SITE_SCF_STATE.json'))
          now=json.load(open('screen/L15_L17_SITE_SCF_STATE.json'))
          assert now['segment']==2 and now['depth']=='L15' and now['site']=='top'
          assert now['checkpoint_semantics']=='QE_CLEAN_MAX_SECONDS_EXACT_RESTART'
          assert now['original_l17_hold_preserved'] is True
          assert now['absolute_clean_surface_pass_claimed'] is False
          if prior['status']=='CHECKPOINT':
              assert now['restart_mode']=='restart', now
              assert now['carried_forward_without_recomputation'] is False
              text=Path('screen/site_scf.in').read_text()
              assert re.search(r"restart_mode\s*=\s*['\"]restart['\"]", text)
              assert now['status'] in {'COMPLETE','CHECKPOINT'}
              assert now['wrapper_timeout'] is False
              Path('screen/EXACT_RESTART_QUALIFIED').write_text('PASS\n')
              print('EXACT_QE_RESTART_QUALIFIED')
          else:
              assert prior['status']=='COMPLETE'
              assert now['status']=='COMPLETE'
              assert now['carried_forward_without_recomputation'] is True
              assert now['source_state_sha256']
              Path('screen/NO_RECOMPUTE_CARRY_QUALIFIED').write_text('PASS\n')
              print('FULL_CASE_COMPLETED_WITHIN_ONE_SEGMENT_AND_CARRY_QUALIFIED')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-l15-l17-restart-qualification-seg02-v1
          path: screen
          retention-days: 30
          if-no-files-found: error

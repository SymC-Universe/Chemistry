name: Na Cu001 route launch monitor

on:
  pull_request:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/na-cu001-route-monitor.yml'

permissions:
  contents: read
  actions: read

jobs:
  locate-launch-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Locate corrected route run
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCH_SHA: 1cd76ee2fb425bdb72b43c41c8e46e3e0ffdc94a
        shell: bash
        run: |
          set -euo pipefail
          result=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow 'Na Cu001 corrected computational closure route' \
            --branch agent/na-cu001-integration \
            --event push \
            --limit 30 \
            --json databaseId,headSha,status,conclusion,createdAt,url,name \
            --jq ".[] | select(.headSha == \"${LAUNCH_SHA}\")")
          [[ -n "$result" ]]
          printf '%s\n' "$result" | tee launch-run.json
          {
            echo '## Corrected V2 computation launch'
            echo
            echo '```json'
            cat launch-run.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: na-cu001-v2-launch-monitor
          path: launch-run.json
          retention-days: 7
          if-no-files-found: error

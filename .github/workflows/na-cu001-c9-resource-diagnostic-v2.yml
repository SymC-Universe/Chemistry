name: Na Cu001 C9 resource diagnostic v2

on:
  workflow_dispatch:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/na-cu001-c9-resource-diagnostic-v2.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: na-cu001-c9-resource-diagnostic-v2
  cancel-in-progress: false

env:
  SOURCE_C7_RUN_ID: '30949901790'
  SOURCE_C7_COMMIT: '8ca3f708537886050ef18210315e79a43595d3f3'
  SOURCE_BASE_ARTIFACT: 'na-cu001-c7-base'
  SOURCE_QE_ARTIFACT: 'na-cu001-c7-qe'
  PARITY_RUN_ID: '31230166557'
  PARITY_COMMIT: '66a3409469dd8559d11b145fb01c8e097bb693f2'
  PARITY_ARTIFACT: 'na-cu001-c7-electrostatic-consistency-recovery-v1'
  CLEAN_RUN_ID: '31292109177'
  CLEAN_COMMIT: 'd1a61eed0f75673ac5b4b451a2905bdcabc97c22'
  CLEAN_ARTIFACT: 'na-cu001-c8-clean-surface-timeout-recovery-v5'
  DIAGNOSTIC_MAX_SECONDS: '600'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  BLIS_NUM_THREADS: '1'
  VECLIB_MAXIMUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  resource-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Declare non-admissible diagnostic scope
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          DIAGNOSTIC_ONLY_NON_ADMISSIBLE
          Purpose: test whether limiting numerical-library/thread concurrency removes the C9 hosted-runner memory spike.
          The scientific C9 input is unchanged and this run is forbidden from contributing an adsorption energy,
          site ranking, convergence PASS, mechanism decision, or downstream scientific handoff.
          The only intentional change from resource diagnostic v1 is thread-count environment control.
          EOF

      - name: Checkout diagnostic control
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout exact frozen C7 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_C7_COMMIT }}
          path: source_code

      - name: Verify frozen scientific contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile control/na_cu001_ci/adsorption_screen_case_v1.py source_code/na_cu001_ci/closure_engine.py source_code/na_cu001_ci/closure_engine_v2.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('source_code/na_cu001_ci/method_protocol_v0.2.json').read_text())
          s=p['surface']; e=s['registered_electrostatic_convention']
          assert p['schema']=='na-cu001-method-protocol-v0.2'
          assert p['status']=='FROZEN_BEFORE_DOWNSTREAM_RESULTS'
          assert float(s['force_tolerance_ev_per_angstrom'])==0.02
          assert s['adsorption_supercell']==[4,4]
          assert float(s['coverage_ml'])==0.0625
          assert s['adsorption_starts']['sites']==['hollow','bridge','top']
          assert [float(x) for x in s['adsorption_starts']['heights_angstrom']]==[2.0,2.5,3.0]
          assert set(s['mobility_models'])=={'primary','expanded'}
          assert e['assume_isolated']=='esm' and e['esm_bc']=='bc1'
          PY

      - name: Verify thread-only delta from diagnostic v1
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "OMP_NUM_THREADS=$OMP_NUM_THREADS" \
            "OPENBLAS_NUM_THREADS=$OPENBLAS_NUM_THREADS" \
            "MKL_NUM_THREADS=$MKL_NUM_THREADS" \
            "BLIS_NUM_THREADS=$BLIS_NUM_THREADS" \
            "VECLIB_MAXIMUM_THREADS=$VECLIB_MAXIMUM_THREADS" \
            "NUMEXPR_NUM_THREADS=$NUMEXPR_NUM_THREADS"
          test "$OMP_NUM_THREADS" = 1
          test "$OPENBLAS_NUM_THREADS" = 1
          test "$MKL_NUM_THREADS" = 1
          test "$BLIS_NUM_THREADS" = 1
          test "$VECLIB_MAXIMUM_THREADS" = 1
          test "$NUMEXPR_NUM_THREADS" = 1

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gh openmpi-bin libopenmpi-dev libopenblas-dev liblapack-dev libfftw3-dev python3-numpy procps sysstat

      - name: Verify frozen upstream run identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic/run_meta
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_C7_RUN_ID}" > diagnostic/run_meta/source.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PARITY_RUN_ID}" > diagnostic/run_meta/parity.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CLEAN_RUN_ID}" > diagnostic/run_meta/clean.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          source=json.loads(Path('diagnostic/run_meta/source.json').read_text())
          parity=json.loads(Path('diagnostic/run_meta/parity.json').read_text())
          clean=json.loads(Path('diagnostic/run_meta/clean.json').read_text())
          assert source['status']=='completed' and source['conclusion']=='failure' and source['head_sha']==os.environ['SOURCE_C7_COMMIT']
          assert parity['status']=='completed' and parity['conclusion']=='success' and parity['head_sha']==os.environ['PARITY_COMMIT']
          assert clean['status']=='completed' and clean['conclusion']=='success' and clean['head_sha']==os.environ['CLEAN_COMMIT']
          PY

      - name: Download frozen C7 base
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_BASE_ARTIFACT }}
          path: base_upstream
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_C7_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download frozen C7 QE bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_QE_ARTIFACT }}
          path: qe_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.SOURCE_C7_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download electrostatic PASS evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT }}
          path: parity_upstream
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.PARITY_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download definitive clean-surface PASS
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CLEAN_ARTIFACT }}
          path: clean_upstream
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.CLEAN_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Bind exact production inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bound diagnostic
          cp "$(find clean_upstream -type f -name RELAXED_CLEAN_SURFACE_HANDOFF.json -print -quit)" bound/RELAXED_CLEAN_SURFACE_HANDOFF.json
          cp "$(find parity_upstream -type f -name ELECTROSTATIC_CONSISTENCY.json -print -quit)" bound/ELECTROSTATIC_CONSISTENCY.json
          cp "$(find base_upstream -type f -name NA_PSEUDO_HANDOFF.json -print -quit)" bound/NA_PSEUDO_HANDOFF.json
          test "$(tr -d '\r\n' < base_upstream/COMPUTATIONAL_SOURCE_COMMIT.txt)" = "$SOURCE_C7_COMMIT"
          chmod +x qe_bundle/bin/pw.x
          sha256sum -c qe_bundle/meta/engine_binaries.sha256
          echo 'b31028b2bae60cd9903260715a49b4c6d2b6dc654558c87023fa5206e427a16d  qe_bundle/pseudos/Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf' | sha256sum -c -
          echo '863f805310682887de6f2754858a1d3d2d3190107ea5b82aa9d0ab5ed5599139  qe_bundle/pseudos/Na.paw.pbe.z_9.ld1.psl.v0.2.upf' | sha256sum -c -
          sha256sum bound/RELAXED_CLEAN_SURFACE_HANDOFF.json bound/ELECTROSTATIC_CONSISTENCY.json bound/NA_PSEUDO_HANDOFF.json source_code/na_cu001_ci/method_protocol_v0.2.json control/na_cu001_ci/adsorption_screen_case_v1.py > diagnostic/DIAGNOSTIC_INPUTS.sha256
          ldd qe_bundle/bin/pw.x | tee diagnostic/pw_ldd.txt
          {
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "nproc=$(nproc)"
            echo "control_commit=$GITHUB_SHA"
            echo "diagnostic_case=primary_hollow_2.0"
            echo "np=1"
            echo "diagnostic_max_seconds=$DIAGNOSTIC_MAX_SECONDS"
            echo "OMP_NUM_THREADS=$OMP_NUM_THREADS"
            echo "OPENBLAS_NUM_THREADS=$OPENBLAS_NUM_THREADS"
            echo "MKL_NUM_THREADS=$MKL_NUM_THREADS"
            echo "BLIS_NUM_THREADS=$BLIS_NUM_THREADS"
            echo "VECLIB_MAXIMUM_THREADS=$VECLIB_MAXIMUM_THREADS"
            echo "NUMEXPR_NUM_THREADS=$NUMEXPR_NUM_THREADS"
            echo "scientific_admissibility=FORBIDDEN"
          } | tee diagnostic/DIAGNOSTIC_METADATA.txt

      - name: Run thread-capped one-case resource diagnostic
        shell: bash
        run: |
          set -euo pipefail
          echo '=== INITIAL RESOURCE STATE ==='
          date -u
          uname -a
          nproc
          free -h
          df -h
          ulimit -a
          env | grep -E '^(OMP|OPENBLAS|MKL|BLIS|VECLIB|NUMEXPR)_' | sort
          echo '=== END INITIAL RESOURCE STATE ==='

          (
            while true; do
              echo "=== RESOURCE_SAMPLE $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
              free -m
              df -h / /home/runner/work 2>/dev/null || true
              vmstat 1 2 | tail -n 2 || true
              ps -eLo pid,ppid,tid,psr,pcpu,pmem,rss,vsz,nlwp,comm --sort=-rss | head -n 35 || true
              echo '=== END_RESOURCE_SAMPLE ==='
              sleep 10
            done
          ) 2>&1 | tee diagnostic/resource_telemetry.log &
          telemetry_pid=$!

          set +e
          python3 control/na_cu001_ci/adsorption_screen_case_v1.py \
            --source-dir source_code/na_cu001_ci \
            --protocol source_code/na_cu001_ci/method_protocol_v0.2.json \
            --clean-handoff bound/RELAXED_CLEAN_SURFACE_HANDOFF.json \
            --na-handoff bound/NA_PSEUDO_HANDOFF.json \
            --parity-handoff bound/ELECTROSTATIC_CONSISTENCY.json \
            --pw qe_bundle/bin/pw.x \
            --pseudo-dir qe_bundle/pseudos \
            --mobility primary \
            --site hollow \
            --height 2.0 \
            --out-dir diagnostic_case \
            --np 1 \
            --max-seconds "$DIAGNOSTIC_MAX_SECONDS" \
            --source-run-id "$SOURCE_C7_RUN_ID" \
            --source-commit "$SOURCE_C7_COMMIT" \
            --clean-run-id "$CLEAN_RUN_ID" \
            --clean-commit "$CLEAN_COMMIT" \
            --parity-run-id "$PARITY_RUN_ID" \
            --parity-commit "$PARITY_COMMIT" \
            --control-commit "$GITHUB_SHA"
          rc=$?
          set -e

          kill "$telemetry_pid" 2>/dev/null || true
          wait "$telemetry_pid" 2>/dev/null || true
          printf '%s\n' "$rc" | tee diagnostic/DIAGNOSTIC_CASE_EXIT_CODE.txt
          echo "diagnostic_completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> diagnostic/DIAGNOSTIC_METADATA.txt
          echo "helper_exit_code=$rc" >> diagnostic/DIAGNOSTIC_METADATA.txt

          rm -rf diagnostic_case
          echo 'DIAGNOSTIC_ONLY_NON_ADMISSIBLE' > diagnostic/SCIENTIFIC_ADMISSION_FORBIDDEN.txt

      - name: Upload diagnostic telemetry only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c9-resource-diagnostic-v2
          path: diagnostic
          retention-days: 90
          if-no-files-found: warn

      - name: Mark diagnostic complete without scientific interpretation
        if: always()
        shell: bash
        run: |
          echo 'This workflow is diagnostic-only. No C9 case PASS/HOLD/mechanism state may be inferred from it.'

name: CO Cu111 PBE Stage A numerical extension v1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - '.github/workflows/co-cu111-pbe-stage-a-numerical-extension-v1.yml'
      - 'systems/co_cu111/SYSTEM2_PBE_STAGE_A_NUMERICAL_EXTENSION_v0.1.json'
      - 'systems/co_cu111/pbe_stage_a_bulk_extension_v1.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: co-cu111-pbe-stage-a-numerical-extension-v1
  cancel-in-progress: false

env:
  SOURCE_STAGE_A_RUN_ID: '31371043888'
  SOURCE_ENGINE_ARTIFACT: 'co-cu111-pbe-stage-a-engine-v2'
  SOURCE_ENGINE_ARTIFACT_ID: '9056061436'
  SOURCE_ENGINE_ARTIFACT_DIGEST: 'sha256:d08bdff49537bc987d741ab6c392a0226ebc71d3c0631f095ee9e1948926349e'

  PRIOR_DECISION_RUN_ID: '31884902290'
  PRIOR_DECISION_ARTIFACT: 'co-cu111-pbe-stage-a-recovered-decision-v1'
  PRIOR_DECISION_ARTIFACT_ID: '9246992223'
  PRIOR_DECISION_ARTIFACT_DIGEST: 'sha256:e0c7929041ccff4761f9a5f64aa3b9bb12d79cdda5c60e1550e86c946c0a9733'
  PRIOR_DECISION_JSON_SHA256: '4975a1316486155b04235fd4347c03af70f24851737ed78e656adf161fd622b5'

  PROTOCOL: 'systems/co_cu111/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json'
  BUNDLE: 'systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json'
  FROZEN_RUNNER: 'systems/co_cu111/pbe_stage_a_runner_v1.py'
  AMENDMENT: 'systems/co_cu111/SYSTEM2_PBE_STAGE_A_NUMERICAL_EXTENSION_v0.1.json'
  EXTENSION_RUNNER: 'systems/co_cu111/pbe_stage_a_bulk_extension_v1.py'

  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  prepare-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen extension contract and unchanged Stage A files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$FROZEN_RUNNER" "$EXTENSION_RUNNER"

          test "$(git hash-object "$PROTOCOL")" = "2e1816ca8b1eda9fac3a97fe5eb3cd73f76de336"
          test "$(git hash-object "$BUNDLE")" = "4a23d19bbd4374e250582fb1d02419828a06eb5d"
          test "$(git hash-object "$FROZEN_RUNNER")" = "13f457a7f8daaeb2ffccdb9fe6f01c1b0d3a1bdd"
          test "$(git hash-object "$AMENDMENT")" = "fb5bae726bb35bfaa10106714250d3e0ad458307"
          test "$(git hash-object "$EXTENSION_RUNNER")" = "a1b079bd0eea997456511409068549998ab35860"

          python3 "$EXTENSION_RUNNER" self-test --amendment "$AMENDMENT"

          python3 - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("systems/co_cu111/SYSTEM2_PBE_STAGE_A_NUMERICAL_EXTENSION_v0.1.json").read_text())
          assert a["triggering_stage_a_result"]["workflow_run_id"] == 31884902290
          assert a["triggering_stage_a_result"]["status"] == "NUMERICAL_HOLD"
          assert a["unchanged_gates"]["bulk_delta_a0_max_angstrom"] == 0.005
          assert a["unchanged_gates"]["bulk_delta_e0_max_ev_per_atom"] == 0.001
          assert a["provenance"]["scientific_settings_changed"] is False
          assert a["provenance"]["kinetic_inputs_used"] is False
          print("FROZEN_NUMERICAL_EXTENSION_VERIFIED")
          print("SCIENTIFIC_SETTINGS_CHANGED=false")
          print("KINETIC_INPUTS_USED=false")
          PY

      - name: Download exact Stage A engine
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify exact Stage A engine and pseudopotentials
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c engine/meta/STAGE_A_ENGINE.sha256
          cmp "$PROTOCOL" engine/meta/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json
          cmp "$BUNDLE" engine/meta/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
          cmp "$FROZEN_RUNNER" engine/meta/pbe_stage_a_runner_v1.py
          chmod +x engine/bin/pw.x
          test -x engine/bin/pw.x

      - name: Re-publish exact engine for extension matrix
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-numerical-extension-engine-v1
          path: engine
          retention-days: 14
          if-no-files-found: error

  extension-eos:
    needs: prepare-engine
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {ecutwfc: 90, ecutrho: 900, kmesh: 18, role: candidate}
          - {ecutwfc: 90, ecutrho: 900, kmesh: 20, role: candidate}
          - {ecutwfc: 100, ecutrho: 1000, kmesh: 12, role: candidate}
          - {ecutwfc: 100, ecutrho: 1000, kmesh: 14, role: candidate}
          - {ecutwfc: 100, ecutrho: 1000, kmesh: 16, role: candidate}
          - {ecutwfc: 100, ecutrho: 1000, kmesh: 18, role: candidate}
          - {ecutwfc: 100, ecutrho: 1000, kmesh: 20, role: candidate}
          - {ecutwfc: 110, ecutrho: 1100, kmesh: 12, role: candidate}
          - {ecutwfc: 110, ecutrho: 1100, kmesh: 14, role: candidate}
          - {ecutwfc: 110, ecutrho: 1100, kmesh: 16, role: candidate}
          - {ecutwfc: 110, ecutrho: 1100, kmesh: 18, role: candidate}
          - {ecutwfc: 110, ecutrho: 1100, kmesh: 20, role: candidate}
          - {ecutwfc: 120, ecutrho: 1200, kmesh: 12, role: candidate}
          - {ecutwfc: 120, ecutrho: 1200, kmesh: 14, role: candidate}
          - {ecutwfc: 120, ecutrho: 1200, kmesh: 16, role: candidate}
          - {ecutwfc: 120, ecutrho: 1200, kmesh: 18, role: candidate}
          - {ecutwfc: 120, ecutrho: 1200, kmesh: 20, role: candidate}
          - {ecutwfc: 130, ecutrho: 1300, kmesh: 12, role: candidate}
          - {ecutwfc: 130, ecutrho: 1300, kmesh: 14, role: candidate}
          - {ecutwfc: 130, ecutrho: 1300, kmesh: 16, role: candidate}
          - {ecutwfc: 130, ecutrho: 1300, kmesh: 18, role: candidate}
          - {ecutwfc: 130, ecutrho: 1300, kmesh: 20, role: candidate}
          - {ecutwfc: 140, ecutrho: 1400, kmesh: 22, role: reference}
          - {ecutwfc: 150, ecutrho: 1500, kmesh: 24, role: audit}

    steps:
      - uses: actions/checkout@v4

      - name: Install unchanged QE runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopenblas-dev \
            liblapack-dev \
            libfftw3-dev \
            libopenmpi-dev \
            openmpi-bin \
            python3-numpy

      - name: Download exact extension engine
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-numerical-extension-engine-v1
          path: engine

      - name: Verify exact extension engine
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c engine/meta/STAGE_A_ENGINE.sha256
          cmp "$PROTOCOL" engine/meta/SYSTEM2_PBE_STAGE_A_PROTOCOL_v0.1.json
          cmp "$BUNDLE" engine/meta/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
          chmod +x engine/bin/pw.x
          test -x engine/bin/pw.x

      - name: Run frozen bulk extension EOS case
        shell: bash
        run: |
          set -euo pipefail
          out="extension/extension_eos_E${{ matrix.ecutwfc }}_K${{ matrix.kmesh }}_${{ matrix.role }}"
          python3 "$EXTENSION_RUNNER" bulk-run \
            --amendment "$AMENDMENT" \
            --bundle "$BUNDLE" \
            --pseudo-dir engine/pseudos \
            --pw engine/bin/pw.x \
            --ecutwfc '${{ matrix.ecutwfc }}' \
            --ecutrho '${{ matrix.ecutrho }}' \
            --kmesh '${{ matrix.kmesh }}' \
            --role '${{ matrix.role }}' \
            --out "$out"

      - name: Upload immutable bulk extension EOS case
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-bulk-ext-v1-E${{ matrix.ecutwfc }}-K${{ matrix.kmesh }}-${{ matrix.role }}
          path: extension
          retention-days: 90
          if-no-files-found: error

  bulk-gate:
    needs: extension-eos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      status: ${{ steps.gate.outputs.status }}
      selected_ecutwfc: ${{ steps.gate.outputs.selected_ecutwfc }}
      selected_ecutrho: ${{ steps.gate.outputs.selected_ecutrho }}
      selected_kmesh: ${{ steps.gate.outputs.selected_kmesh }}
      need_co_check: ${{ steps.gate.outputs.need_co_check }}

    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependency
        run: sudo apt-get update && sudo apt-get install -y python3-numpy

      - name: Download all new bulk extension EOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-pbe-stage-a-bulk-ext-v1-*
          path: collected/new
          merge-multiple: false

      - name: Download archived reusable C2 k12
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-v2-bulk-C2-k12
          path: collected/reused/c2k12
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download archived reusable C2 k14
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-v2-bulk-C2-k14
          path: collected/reused/c2k14
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download archived reusable C2 k16
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-v2-bulk-C2-k16
          path: collected/reused/c2k16
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download executed Stage A NUMERICAL_HOLD decision
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRIOR_DECISION_ARTIFACT }}
          path: prior_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.PRIOR_DECISION_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify triggering decision hash
        shell: bash
        run: |
          set -euo pipefail
          echo "${PRIOR_DECISION_JSON_SHA256}  prior_decision/PBE_STAGE_A_RESULT.json" | sha256sum -c -
          python3 - <<'PY'
          import json
          r=json.load(open('prior_decision/PBE_STAGE_A_RESULT.json'))
          assert r['status']=='NUMERICAL_HOLD'
          assert r['next_gate']=='STAGE_A_HOLD_REVIEW'
          assert r['provenance']['scientific_settings_changed'] is False
          print('TRIGGERING_NUMERICAL_HOLD_VERIFIED')
          PY

      - name: Apply prospectively frozen bulk extension gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gate
          python3 "$EXTENSION_RUNNER" bulk-gate \
            --amendment "$AMENDMENT" \
            --stage-a-decision prior_decision/PBE_STAGE_A_RESULT.json \
            --root collected \
            --out gate/BULK_EXTENSION_GATE.json \
            > gate/BULK_EXTENSION_GATE_STDOUT.txt
          cat gate/BULK_EXTENSION_GATE_STDOUT.txt

      - name: Export bulk extension decision
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('gate/BULK_EXTENSION_GATE.json'))
          selected=r.get('selected')
          print('status='+r['status'])
          print('need_co_check='+('true' if r['conditional_co_combination_check_required'] else 'false'))
          if selected:
              print('selected_ecutwfc='+str(selected['ecutwfc_ry']))
              print('selected_ecutrho='+str(selected['ecutrho_ry']))
              print('selected_kmesh='+str(selected['kmesh']))
          else:
              print('selected_ecutwfc=')
              print('selected_ecutrho=')
              print('selected_kmesh=')
          PY

      - name: Upload frozen bulk extension gate
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-bulk-extension-gate-v1
          path: gate
          retention-days: 90
          if-no-files-found: error

  co-combination-check:
    needs: [prepare-engine, bulk-gate]
    if: ${{ needs.bulk-gate.outputs.need_co_check == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        box: [18, 26]

    steps:
      - uses: actions/checkout@v4

      - name: Install unchanged QE runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopenblas-dev \
            liblapack-dev \
            libfftw3-dev \
            libopenmpi-dev \
            openmpi-bin \
            python3-numpy

      - name: Download exact extension engine
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-numerical-extension-engine-v1
          path: engine

      - name: Download frozen bulk extension gate
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-bulk-extension-gate-v1
          path: gate

      - name: Verify exact extension engine
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c engine/meta/STAGE_A_ENGINE.sha256
          cmp "$BUNDLE" engine/meta/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
          chmod +x engine/bin/pw.x
          test -x engine/bin/pw.x

      - name: Run only required higher-cutoff CO combination scan
        shell: bash
        run: |
          set -euo pipefail
          out="co_extension/co_combination_L${{ matrix.box }}"
          python3 "$EXTENSION_RUNNER" co-run \
            --amendment "$AMENDMENT" \
            --bundle "$BUNDLE" \
            --bulk-gate gate/BULK_EXTENSION_GATE.json \
            --pseudo-dir engine/pseudos \
            --pw engine/bin/pw.x \
            --box '${{ matrix.box }}' \
            --out "$out"

      - name: Upload conditional CO combination scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-co-combination-ext-v1-L${{ matrix.box }}
          path: co_extension
          retention-days: 90
          if-no-files-found: error

  finalize-stage-a:
    needs: [bulk-gate, co-combination-check]
    if: ${{ always() && needs.bulk-gate.result == 'success' && (needs.co-combination-check.result == 'success' || needs.co-combination-check.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install analysis dependency
        run: sudo apt-get update && sudo apt-get install -y python3-numpy

      - name: Download executed Stage A NUMERICAL_HOLD decision
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PRIOR_DECISION_ARTIFACT }}
          path: prior_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.PRIOR_DECISION_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Download frozen bulk extension gate
        uses: actions/download-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-bulk-extension-gate-v1
          path: gate

      - name: Download conditional higher-cutoff CO scans
        if: ${{ needs.bulk-gate.outputs.need_co_check == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: co-cu111-pbe-stage-a-co-combination-ext-v1-*
          path: collected_co
          merge-multiple: false

      - name: Finalize prospective Stage A numerical extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final
          args=(
            --amendment "$AMENDMENT"
            --stage-a-decision prior_decision/PBE_STAGE_A_RESULT.json
            --bulk-gate gate/BULK_EXTENSION_GATE.json
            --out final/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json
          )
          if [ '${{ needs.bulk-gate.outputs.need_co_check }}' = 'true' ]; then
            args+=(--co-root collected_co)
          fi
          python3 "$EXTENSION_RUNNER" finalize "${args[@]}" \
            > final/PBE_STAGE_A_NUMERICAL_EXTENSION_STDOUT.txt
          cat final/PBE_STAGE_A_NUMERICAL_EXTENSION_STDOUT.txt

      - name: Record extension decision hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            "$PROTOCOL" \
            "$BUNDLE" \
            "$AMENDMENT" \
            "$EXTENSION_RUNNER" \
            prior_decision/PBE_STAGE_A_RESULT.json \
            gate/BULK_EXTENSION_GATE.json \
            final/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            > final/EXTENSION_DECISION_INPUTS_AND_RESULT.sha256

      - name: Upload final Stage A numerical extension decision
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-stage-a-numerical-extension-decision-v1
          path: final
          retention-days: 90
          if-no-files-found: error

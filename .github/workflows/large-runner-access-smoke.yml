name: Larger runner access smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - '.github/workflows/large-runner-access-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest-m
    timeout-minutes: 10

    steps:
      - name: Confirm larger runner
        shell: bash
        run: |
          set -euo pipefail
          echo "start=$(date -u +%FT%TZ)"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "Beginning 180-second runner lifetime test"
          sleep 180
          echo "end=$(date -u +%FT%TZ)"
          echo "LARGER_RUNNER_180_SECOND_LIFETIME_PASS"

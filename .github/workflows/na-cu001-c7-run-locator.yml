name: Na Cu001 C7 run locator
on:
  push:
    branches: [agent/na-cu001-integration]
    paths: ['.github/workflows/na-cu001-c7-run-locator.yml']
permissions:
  contents: write
  actions: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record C7 launch run
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCH_SHA: ace9fb7aa62aa5fd0ac9ec9a0caecccbdd5f636e
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Na Cu001 v0.4 audited clean-slab closure" --commit "$LAUNCH_SHA" --limit 10 --json databaseId,status,conclusion,headSha,url,createdAt --jq '.[0] // empty')
            if [[ -n "$result" ]]; then break; fi
            sleep 10
          done
          [[ -n "$result" ]]
          mkdir -p na_cu001_ci/checkpoints
          printf '%s\n' "$result" > na_cu001_ci/checkpoints/C7_ACTIVE_RUN.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add na_cu001_ci/checkpoints/C7_ACTIVE_RUN.json
          git commit -m 'chore(na-cu001): record C7 active run'
          git push

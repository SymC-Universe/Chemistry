name: Na Cu001 C7 L13 timeout recovery v3

on:
  workflow_dispatch:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/na-cu001-c7-l13-timeout-recovery-v3.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: na-cu001-c7-l13-timeout-recovery-v3
  cancel-in-progress: false

env:
  FROZEN_SOURCE_COMMIT: '055b2f5d782c2a590e65ad429cefd0981f0dd37b'
  L13_RUN_ID: '31030768817'
  V24_CHECKPOINT_RUN_ID: '31074611696'
  OMP_NUM_THREADS: '1'
  SEGMENT_MAX_SECONDS: '13500'
  PSEUDO_NAME: 'Cu.paw.pbe.z_11.ld1.psl.v1.0.0-low.upf'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery control code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            na_cu001_ci/slab_l13_checkpoint_recovery_v3.py \
            na_cu001_ci/test_slab_l13_checkpoint_recovery_v3.py
          (cd na_cu001_ci && python3 test_slab_l13_checkpoint_recovery_v3.py)

  stage-a:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - vacuum: 16
            kmesh: 22
            slug: v16_k22
            mode: fresh
            segment: 1
            source_artifact_id: 0
            source_artifact_name: unused
            source_artifact_digest: unused
          - vacuum: 24
            kmesh: 20
            slug: v24_k20
            mode: import
            segment: 2
            source_artifact_id: 8962575019
            source_artifact_name: na-cu001-c7-l13-v24_k20-checkpoint-segment1
            source_artifact_digest: sha256:94b86f350866e4d8bf92b0a05af0a727aa957da1dcbece35668dbb5b54cbc179
          - vacuum: 24
            kmesh: 22
            slug: v24_k22
            mode: import
            segment: 2
            source_artifact_id: 8962584438
            source_artifact_name: na-cu001-c7-l13-v24_k22-checkpoint-segment1
            source_artifact_digest: sha256:50e4fe86a11290cff86a28c089b6e7a9bc2d2f06add60e524cf68ff64ac46a24
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_SOURCE_COMMIT }}
          path: frozen
      - uses: actions/download-artifact@v4
        if: matrix.mode == 'import'
        with:
          name: ${{ matrix.source_artifact_name }}
          path: work
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.V24_CHECKPOINT_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-base
          path: base_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.L13_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-qe
          path: qe_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.L13_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Install frozen runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev libopenblas-dev liblapack-dev libfftw3-dev python3-numpy
          test "$(git -C frozen rev-parse HEAD)" = "$FROZEN_SOURCE_COMMIT"
          chmod +x qe_bundle/bin/pw.x
      - name: Bootstrap imported checkpoint
        if: matrix.mode == 'import'
        shell: bash
        run: |
          set -euo pipefail
          python3 control/na_cu001_ci/slab_l13_checkpoint_recovery_v3.py bootstrap \
            --source-dir frozen/na_cu001_ci \
            --layers 13 \
            --vacuum '${{ matrix.vacuum }}' \
            --kmesh '${{ matrix.kmesh }}' \
            --out 'work/l13_outputs/l13_${{ matrix.slug }}' \
            --status-out 'work/bootstrap_status_${{ matrix.slug }}.json' \
            --pseudo "qe_bundle/pseudos/$PSEUDO_NAME" \
            --source-run-id "$V24_CHECKPOINT_RUN_ID" \
            --source-artifact-id '${{ matrix.source_artifact_id }}' \
            --source-artifact-name '${{ matrix.source_artifact_name }}' \
            --source-artifact-digest '${{ matrix.source_artifact_digest }}'
      - name: Run first controlled stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          restart_mode=restart
          if test '${{ matrix.mode }}' = fresh; then restart_mode=from_scratch; fi
          python3 control/na_cu001_ci/slab_l13_checkpoint_recovery_v3.py segment \
            --source-dir frozen/na_cu001_ci \
            --segment '${{ matrix.segment }}' \
            --restart-mode "$restart_mode" \
            --max-seconds "$SEGMENT_MAX_SECONDS" \
            --layers 13 \
            --vacuum '${{ matrix.vacuum }}' \
            --kmesh '${{ matrix.kmesh }}' \
            --handoff base_bundle/base/BULK_HANDOFF.json \
            --bulk-result base_bundle/base/BULK_CONVERGENCE_RESULT.json \
            --pw qe_bundle/bin/pw.x \
            --pseudo-dir qe_bundle/pseudos \
            --out 'work/l13_outputs/l13_${{ matrix.slug }}' \
            --np 2 \
            --status-out 'work/stage_a_status_${{ matrix.slug }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: na-cu001-c7-l13-v3-${{ matrix.slug }}-stage-a
          path: work
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  stage-b:
    needs: stage-a
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - vacuum: 16
            kmesh: 22
            slug: v16_k22
            segment: 2
          - vacuum: 24
            kmesh: 20
            slug: v24_k20
            segment: 3
          - vacuum: 24
            kmesh: 22
            slug: v24_k22
            segment: 3
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_SOURCE_COMMIT }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v3-${{ matrix.slug }}-stage-a
          path: work
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-base
          path: base_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.L13_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-qe
          path: qe_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.L13_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Install frozen runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev libopenblas-dev liblapack-dev libfftw3-dev python3-numpy
          test "$(git -C frozen rev-parse HEAD)" = "$FROZEN_SOURCE_COMMIT"
          chmod +x qe_bundle/bin/pw.x
      - name: Resume or carry stage B
        shell: bash
        run: |
          set -euo pipefail
          previous='work/stage_a_status_${{ matrix.slug }}.json'
          current='work/stage_b_status_${{ matrix.slug }}.json'
          complete="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["complete"]).lower())' "$previous")"
          if test "$complete" = true; then
            cp "$previous" "$current"
          else
            python3 control/na_cu001_ci/slab_l13_checkpoint_recovery_v3.py segment \
              --source-dir frozen/na_cu001_ci \
              --segment '${{ matrix.segment }}' \
              --restart-mode restart \
              --max-seconds "$SEGMENT_MAX_SECONDS" \
              --layers 13 \
              --vacuum '${{ matrix.vacuum }}' \
              --kmesh '${{ matrix.kmesh }}' \
              --handoff base_bundle/base/BULK_HANDOFF.json \
              --bulk-result base_bundle/base/BULK_CONVERGENCE_RESULT.json \
              --pw qe_bundle/bin/pw.x \
              --pseudo-dir qe_bundle/pseudos \
              --out 'work/l13_outputs/l13_${{ matrix.slug }}' \
              --np 2 \
              --status-out "$current"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: na-cu001-c7-l13-v3-${{ matrix.slug }}-stage-b
          path: work
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  stage-c:
    needs: stage-b
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - vacuum: 16
            kmesh: 22
            slug: v16_k22
            segment: 3
          - vacuum: 24
            kmesh: 20
            slug: v24_k20
            segment: 4
          - vacuum: 24
            kmesh: 22
            slug: v24_k22
            segment: 4
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_SOURCE_COMMIT }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v3-${{ matrix.slug }}-stage-b
          path: work
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-base
          path: base_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.L13_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v2-qe
          path: qe_bundle
          repository: SymCUniverse/Chemistry
          run-id: ${{ env.L13_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Install frozen runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openmpi-bin libopenmpi-dev libopenblas-dev liblapack-dev libfftw3-dev python3-numpy
          test "$(git -C frozen rev-parse HEAD)" = "$FROZEN_SOURCE_COMMIT"
          chmod +x qe_bundle/bin/pw.x
      - name: Resume or carry stage C
        shell: bash
        run: |
          set -euo pipefail
          previous='work/stage_b_status_${{ matrix.slug }}.json'
          current='work/stage_c_status_${{ matrix.slug }}.json'
          complete="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["complete"]).lower())' "$previous")"
          if test "$complete" = true; then
            cp "$previous" "$current"
          else
            python3 control/na_cu001_ci/slab_l13_checkpoint_recovery_v3.py segment \
              --source-dir frozen/na_cu001_ci \
              --segment '${{ matrix.segment }}' \
              --restart-mode restart \
              --max-seconds "$SEGMENT_MAX_SECONDS" \
              --layers 13 \
              --vacuum '${{ matrix.vacuum }}' \
              --kmesh '${{ matrix.kmesh }}' \
              --handoff base_bundle/base/BULK_HANDOFF.json \
              --bulk-result base_bundle/base/BULK_CONVERGENCE_RESULT.json \
              --pw qe_bundle/bin/pw.x \
              --pseudo-dir qe_bundle/pseudos \
              --out 'work/l13_outputs/l13_${{ matrix.slug }}' \
              --np 2 \
              --status-out "$current"
          fi
          test "$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["complete"]).lower())' "$current")" = true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: na-cu001-c7-l13-v3-${{ matrix.slug }}-stage-c
          path: work
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: stage-c
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: v16_k22
          - slug: v24_k20
          - slug: v24_k22
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: na-cu001-c7-l13-v3-${{ matrix.slug }}-stage-c
          path: work
      - name: Compact and verify recovered evidence
        shell: bash
        run: |
          set -euo pipefail
          status='work/stage_c_status_${{ matrix.slug }}.json'
          test "$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["complete"]).lower())' "$status")" = true
          case_root='work/l13_outputs/l13_${{ matrix.slug }}'
          find "$case_root" -type d \( -name tmp -o -name '*.save' \) -prune -exec rm -rf {} + 2>/dev/null || true
          find "$case_root" -type f \( -name '*.wfc*' -o -name charge-density.dat -o -name data-file-schema.xml -o -name RESTART_STATE.sha256 \) -delete 2>/dev/null || true
          mapfile -d '' compact_files < <(find "$case_root" -type f \( -name run_record.json -o -name 'cu001_*.in' -o -name 'cu001_*.out' \) -print0 | sort -z)
          test "${#compact_files[@]}" -eq 3
          printf '%s\0' "${compact_files[@]}" | xargs -0 sha256sum > "$case_root/COMPACT_EVIDENCE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c7-l13-v3-recovered-${{ matrix.slug }}
          path: |
            work/l13_outputs/**/run_record.json
            work/l13_outputs/**/*.in
            work/l13_outputs/**/*.out
            work/l13_outputs/**/COMPACT_EVIDENCE.sha256
            work/bootstrap_status_${{ matrix.slug }}.json
            work/stage_a_status_${{ matrix.slug }}.json
            work/stage_b_status_${{ matrix.slug }}.json
            work/stage_c_status_${{ matrix.slug }}.json
          retention-days: 90
          if-no-files-found: error

  recovery-summary:
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write proof-carrying recovery summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p summary
          cat > summary/RECOVERY_SUMMARY.json <<JSON
          {
            "schema": "na-cu001-l13-timeout-recovery-summary-v0.1",
            "scientific_settings_changed": false,
            "frozen_source_commit": "$FROZEN_SOURCE_COMMIT",
            "original_l13_run_id": $L13_RUN_ID,
            "salvaged_v24_checkpoint_run_id": $V24_CHECKPOINT_RUN_ID,
            "recovery_run_id": $GITHUB_RUN_ID,
            "completed_cases": [
              {"layers": 13, "vacuum_angstrom": 16, "kmesh_inplane": 22},
              {"layers": 13, "vacuum_angstrom": 24, "kmesh_inplane": 20},
              {"layers": 13, "vacuum_angstrom": 24, "kmesh_inplane": 22}
            ],
            "next_gate": "combine 13 original valid L13 artifacts with 3 recovered artifacts and rerun the preregistered extension analysis"
          }
          JSON
          sha256sum summary/RECOVERY_SUMMARY.json > summary/RECOVERY_SUMMARY.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: na-cu001-c7-l13-v3-recovery-summary
          path: summary
          retention-days: 90
          if-no-files-found: error

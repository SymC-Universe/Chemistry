name: System3 shared H segmented recovery v0.2

on:
  push:
    branches: [bridge/h-ru0001-relax-pass-20260917]
    paths:
      - '.github/workflows/system3-shared-h-segmented-recovery-v02.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: system3-shared-h-segmented-recovery-v02
  cancel-in-progress: false

env:
  PROTOCOL: systems/shared/H_PSEUDOPOTENTIAL_QUALIFICATION_RECOVERY_v0.2.json
  RUNNER: systems/shared/shared_h_qualification_recovery_v2.py
  SOURCE_RUN_ID: '35295414137'
  SOURCE_ARTIFACT: system3-shared-h-pseudopotential-qualification-v1
  ENGINE_RUN_ID: '31371043888'
  ENGINE_ARTIFACT: co-cu111-pbe-stage-a-engine-v2
  PW_SHA256: 2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855
  H_SOURCE_COMMIT: 0fb07d89d13407b0f00a0a3b8c21d7e387fb56f9
  H_SOURCE_PATH: libraries-pbe/nc-sg15-oncvpsp4/H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf
  H_MD5: 39a7d154f04d65093d603a437119a874

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify additive post-HOLD recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool "$PROTOCOL" >/dev/null
          python3 -m py_compile "$RUNNER"
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['PROTOCOL']))
          assert p['status']=='FROZEN_AFTER_V0_1_HOLD_BEFORE_V0_2_RECOVERY_RESULTS'
          assert p['parent_run_id']==35295414137
          assert p['parent_disposition']=='SHARED_H_PSEUDOPOTENTIAL_HOLD'
          assert p['non_retroactivity']['v0_1_hold_remains_valid'] is True
          assert p['atom_recovery']['parameter_changes_from_v0_1']=='none'
          assert p['shared_electronic_settings']['conv_thr']==1e-12
          assert p['shared_electronic_settings']['mixing_beta']==0.3
          assert p['shared_electronic_settings']['electron_maxstep_per_segment']==200
          assert p['acceptance']['max_h2_final_force_ev_per_angstrom']==0.005
          assert p['h2_recovery']['forc_conv_thr_ev_per_angstrom'] < p['acceptance']['max_h2_final_force_ev_per_angstrom']
          assert all(v is False for v in p['firewall'].values())
          print('SHARED_H_RECOVERY_V02_FROZEN')
          PY

  atom:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        basis: ['70','80']
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y curl libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify runtime and fetch exact H pseudo
        shell: bash
        run: |
          set -euo pipefail
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          url="https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/$H_SOURCE_COMMIT/$H_SOURCE_PATH"
          curl -L --fail --retry 5 --retry-delay 3 "$url" -o H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf
          echo "$H_MD5  H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf" | md5sum -c -
      - name: Continue isolated-H exact checkpoint in bounded 200-step segments
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          python3 "$RUNNER"             --protocol "$PROTOCOL"             --mode atom             --basis "${{ matrix.basis }}"             --pw engine/bin/pw.x             --pseudo H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf             --source-root source             --out atom_result             --timeout-seconds 3600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-h-v02-atom-${{ matrix.basis }}
          path: atom_result
          retention-days: 90
          if-no-files-found: warn

  h2:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        basis: ['70','80']
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y curl libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify runtime and fetch exact H pseudo
        shell: bash
        run: |
          set -euo pipefail
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          url="https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/$H_SOURCE_COMMIT/$H_SOURCE_PATH"
          curl -L --fail --retry 5 --retry-delay 3 "$url" -o H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf
          echo "$H_MD5  H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf" | md5sum -c -
      - name: Continue H2 relaxation under the already-frozen force gate
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          python3 "$RUNNER"             --protocol "$PROTOCOL"             --mode h2             --basis "${{ matrix.basis }}"             --pw engine/bin/pw.x             --pseudo H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf             --source-root source             --out h2_result             --timeout-seconds 3600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-h-v02-h2-${{ matrix.basis }}
          path: h2_result
          retention-days: 90
          if-no-files-found: warn

  adjudicate:
    needs: [atom, h2]
    if: always() && needs.atom.result == 'success' && needs.h2.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shared-h-v02-*
          path: recovery_results
          merge-multiple: true
      - name: Adjudicate against unchanged v0.1 acceptance limits
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER"             --protocol "$PROTOCOL"             --mode adjudicate             --source-root recovery_results             --out adjudication
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-h-v02-adjudication
          path: adjudication
          retention-days: 90
          if-no-files-found: warn

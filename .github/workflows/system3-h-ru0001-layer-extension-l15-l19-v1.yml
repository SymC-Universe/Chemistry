name: System3 H Ru0001 bounded L15-L19 layer extension v1

on:
  push:
    branches: [bridge/h-ru0001-l15-l19-20260916]
    paths:
      - '.github/workflows/system3-h-ru0001-layer-extension-l15-l19-v1.yml'
      - 'systems/h_ru0001/SYSTEM3_CLEAN_RU0001_LAYER_EXTENSION_L15_L19_v0.1.json'
      - 'systems/h_ru0001/system3_ru_layer_extension_v1.py'
      - 'systems/h_ru0001/test_system3_ru_layer_extension_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: h-ru0001-layer-extension-l15-l19-v1
  cancel-in-progress: false

env:
  PROTOCOL: systems/h_ru0001/SYSTEM3_CLEAN_RU0001_LAYER_EXTENSION_L15_L19_v0.1.json
  RUNNER: systems/h_ru0001/system3_ru_layer_extension_v1.py
  TEST: systems/h_ru0001/test_system3_ru_layer_extension_v1.py
  BULK_ADJUDICATION: systems/h_ru0001/SYSTEM3_PBE_BULK_CANDIDATE_ADJUDICATION_v0.1.json
  BULK_PROTOCOL: systems/h_ru0001/SYSTEM3_PBE_BULK_CANDIDATE_PROTOCOL_v0.1.json
  SOURCE_RUN_ID: '33389260021'
  SOURCE_ARTIFACT: system3-h-ru0001-clean-surface-numerical-v2
  ENGINE_RUN_ID: '30949901790'
  ENGINE_ARTIFACT: na-cu001-c7-qe

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded extension contract and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool "$PROTOCOL" >/dev/null
          python3 -m py_compile "$RUNNER" "$TEST"
          python3 "$TEST" -v
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['PROTOCOL']))
          assert p['status']=='FROZEN_BEFORE_EXTENSION_RESULTS'
          assert p['extension']['new_layers']==[15,17,19]
          assert p['extension']['automatic_further_extension'] is False
          assert p['frozen_method']['absolute_surface_excess_tolerance_ev_per_surface_atom']==0.001
          assert all(v is False for v in p['evidence_firewall'].values())
          print('RU_LAYER_EXTENSION_PROTOCOL_FROZEN')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify source HOLD identity before new calculations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          hits=list(pathlib.Path('source').rglob('SYSTEM3_CLEAN_SURFACE_NUMERICAL_RESULT.json'))
          assert len(hits)==1, hits
          r=json.load(open(hits[0]))
          assert r['status']=='CLEAN_SURFACE_NUMERICAL_HOLD'
          assert r['failed_gate']=='layer_stage'
          assert r['selected_kmesh']
          assert r['selected_total_vacuum_angstrom'] is not None
          print('SOURCE_HOLD_VERIFIED', hits[0])
          PY

  extension_case:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        layers: [15, 17, 19]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Extract and verify unchanged QE/Ru pseudopotential
        shell: bash
        run: |
          set -euo pipefail
          echo '2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855  engine/bin/pw.x' | sha256sum -c -
          mkdir -p ru_pseudos
          tar -xOf engine/meta/SSSP-lib-pbe-eff-v2.tar.gz mix-sssp-pbe-eff-lib-v2/library/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf > ru_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf
          echo 'ed637e8481a2fddda6a93863a92f8b0b857379b9db23325a4664e3df0a6f45bd  ru_pseudos/Ru.nc.pbe.z_16.oncvpsp4.sg15.v0.upf' | sha256sum -c -
          chmod +x engine/bin/pw.x
      - name: Run prospectively frozen fixed-grid layer case
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" run-case \
            --protocol "$PROTOCOL" \
            --source-root source \
            --bulk-adjudication "$BULK_ADJUDICATION" \
            --layers '${{ matrix.layers }}' \
            --pw engine/bin/pw.x \
            --pseudo-dir ru_pseudos \
            --out case_${{ matrix.layers }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-ru0001-layer-extension-L${{ matrix.layers }}-v1
          path: case_${{ matrix.layers }}
          retention-days: 90
          if-no-files-found: error

  adjudicate:
    needs: extension_case
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: source
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with: {name: h-ru0001-layer-extension-L15-v1, path: cases/L15}
      - uses: actions/download-artifact@v4
        with: {name: h-ru0001-layer-extension-L17-v1, path: cases/L17}
      - uses: actions/download-artifact@v4
        with: {name: h-ru0001-layer-extension-L19-v1, path: cases/L19}
      - name: Adjudicate complete L5-L19 ladder without retuning
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER" adjudicate \
            --protocol "$PROTOCOL" \
            --source-root source \
            --bulk-adjudication "$BULK_ADJUDICATION" \
            --case-root cases \
            --out H_RU0001_LAYER_EXTENSION_ADJUDICATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-ru0001-layer-extension-adjudication-v1
          path: H_RU0001_LAYER_EXTENSION_ADJUDICATION.json
          retention-days: 90
          if-no-files-found: error

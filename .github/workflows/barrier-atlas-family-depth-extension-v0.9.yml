name: Barrier Atlas family depth extension v0.9

on:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - 'barrier_atlas/family_independence/FAMILY_DEPTH_EXTENSION_v0.9.json'
      - 'barrier_atlas/family_independence/MC08_CHLORIDE_METHYL_IODIDE_NONIDENTITY_SN2_SOURCE_AUDIT_v0.1.json'
      - 'barrier_atlas/family_independence/validate_family_depth_extension_v0_9.py'
      - 'barrier_atlas/family_independence/test_family_depth_extension_v0_9.py'
      - '.github/workflows/barrier-atlas-family-depth-extension-v0.9.yml'
  pull_request:
    paths:
      - 'barrier_atlas/family_independence/FAMILY_DEPTH_EXTENSION_v0.9.json'
      - 'barrier_atlas/family_independence/MC08_CHLORIDE_METHYL_IODIDE_NONIDENTITY_SN2_SOURCE_AUDIT_v0.1.json'
      - 'barrier_atlas/family_independence/validate_family_depth_extension_v0_9.py'
      - 'barrier_atlas/family_independence/test_family_depth_extension_v0_9.py'
      - '.github/workflows/barrier-atlas-family-depth-extension-v0.9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate additive MC08 family-depth extension
        run: python barrier_atlas/family_independence/validate_family_depth_extension_v0_9.py
      - name: Run regression tests
        run: python -m pytest -q barrier_atlas/family_independence/test_family_depth_extension_v0_9.py

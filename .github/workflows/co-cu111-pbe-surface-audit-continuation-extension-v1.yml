name: CO Cu111 PBE surface audit continuation extension v1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - '.github/workflows/co-cu111-pbe-surface-audit-continuation-extension-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: co-cu111-pbe-surface-audit-continuation-extension-v1
  cancel-in-progress: false

env:
  EXT_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_AUDIT_CONTINUATION_EXTENSION_v0.1.json
  EXT_RUNNER: systems/co_cu111/pbe_surface_audit_continuation_extension_v1.py
  EXT_TEST: systems/co_cu111/test_pbe_surface_audit_continuation_extension_v1.py
  PARENT_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_AUDIT_RANK_FALLBACK_RECOVERY_v0.1.json
  PARENT_RUNNER: systems/co_cu111/pbe_surface_audit_rank_fallback_recovery_v1.py
  SURFACE_PROTOCOL: systems/co_cu111/SYSTEM2_PBE_SURFACE_SITE_ORDERING_PROTOCOL_v0.1.json
  SURFACE_RUNNER: systems/co_cu111/pbe_surface_site_ordering_v1.py
  BUNDLE: systems/co_cu111/PBE_PSEUDOPOTENTIAL_BUNDLE_v0.1.json
  PARENT_RUN_ID: '32915640451'
  PARENT_SEG12_ARTIFACT: co-cu111-pbe-surface-audit-rank-fallback-L13-V28-K24-seg12
  SELECTION_ARTIFACT: co-cu111-pbe-surface-audit-rank-selection-v1
  ENGINE_RUN_ID: '31371043888'
  ENGINE_ARTIFACT: co-cu111-pbe-stage-a-engine-v2
  STAGE_A_RUN_ID: '31887006685'
  STAGE_A_ARTIFACT: co-cu111-pbe-stage-a-numerical-extension-decision-v1
  PARENT_RECOVERY_RUN_ID: '32435777875'
  COMPLETED_REFERENCE_ARTIFACT: co-cu111-pbe-clean-timeout-recovery-repro1-L11-V24-K20-reference
  COMPLETED_REFERENCE_SHA256: '88b0df1455d2d34963b6503a980fb79260e93c3785b94ba4cefab110fcfc0245'
  SOURCE_SURFACE_RUN_ID: '31922544540'
  CONTINUATION_RUNTIME_CAP_S: '16200'
  REPRO_RUNTIME_CAP_S: '7200'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen extension contract and hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$EXT_RUNNER" "$EXT_TEST"
          echo '5ce59d236bf77324d9ba52eff92b8f4d83d4f162e8d2f058bfbca4a8557656bd  '"$EXT_PROTOCOL" | sha256sum -c -
          echo '2e72878ec30ce233fd72d6f8aed9089efa0374c6b81ef99c4b1da4f3e89a5ed0  '"$EXT_RUNNER" | sha256sum -c -
          echo '6498f992df836e3632d78fb6f5acad3a82dbdc8028d1943763c93dd5b285be8b  '"$EXT_TEST" | sha256sum -c -
          echo '3a51d86a1f3d2698aace29b243c8ac4a85c7d30919aa6898400ac15cc3a833c5  '"$PARENT_PROTOCOL" | sha256sum -c -
          echo '00260df6730d3812b4d1543654b491a3eaeb118a196ed1b4f53a71cde74099b5  '"$PARENT_RUNNER" | sha256sum -c -
          python3 "$EXT_TEST" -v
          python3 "$EXT_RUNNER" self-test --protocol "$EXT_PROTOCOL"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARENT_SEG12_ARTIFACT }}
          path: parent
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify immutable segment-12 checkpoint
        shell: bash
        env:
          CO_CU111_SEG12_FIXTURE: ${{ github.workspace }}/parent
        run: |
          set -euo pipefail
          echo '5125935a70c5bcecf2980ae8e0d6175fef04340fa8bfa1166cc3120d7a1391ab  parent/RANK_FALLBACK_SEGMENT.json' | sha256sum -c -
          python3 "$EXT_RUNNER" verify-parent --protocol "$EXT_PROTOCOL" --parent-root parent
          python3 "$EXT_TEST" -v


  continue_1:
    name: continue-1 / logical-13
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.STAGE_A_ARTIFACT }}
          path: stage_a_decision
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.STAGE_A_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SELECTION_ARTIFACT }}
          path: selection
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARENT_SEG12_ARTIFACT }}
          path: prior
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Continue frozen L13 audit logical segment 13
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$EXT_RUNNER" continue \
            --protocol "$EXT_PROTOCOL" --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
            --selection selection/RANK_SELECTION_RESULT.json --prior-root prior --segment 1 \
            --runtime-cap-s "$CONTINUATION_RUNTIME_CAP_S" --out segment_out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-surface-audit-continuation-extension-L13-V28-K24-seg13
          path: segment_out
          retention-days: 90
          if-no-files-found: error



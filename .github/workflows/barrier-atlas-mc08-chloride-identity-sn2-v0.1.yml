name: Barrier Atlas MC08 chloride identity SN2 v0.1

on:
  push:
    branches:
      - agent/na-cu001-integration
    paths:
      - 'barrier_atlas/family_independence/MC08_CHLORIDE_METHYL_CHLORIDE_IDENTITY_SN2_SOURCE_AUDIT_v0.1.json'
      - 'barrier_atlas/family_independence/validate_mc08_chloride_identity_sn2_v0_1.py'
      - 'barrier_atlas/family_independence/test_mc08_chloride_identity_sn2_v0_1.py'
      - '.github/workflows/barrier-atlas-mc08-chloride-identity-sn2-v0.1.yml'
  pull_request:
    paths:
      - 'barrier_atlas/family_independence/MC08_CHLORIDE_METHYL_CHLORIDE_IDENTITY_SN2_SOURCE_AUDIT_v0.1.json'
      - 'barrier_atlas/family_independence/validate_mc08_chloride_identity_sn2_v0_1.py'
      - 'barrier_atlas/family_independence/test_mc08_chloride_identity_sn2_v0_1.py'
      - '.github/workflows/barrier-atlas-mc08-chloride-identity-sn2-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate MC08 comparator quarantine
        run: |
          python barrier_atlas/family_independence/validate_mc08_chloride_identity_sn2_v0_1.py \
            --audit barrier_atlas/family_independence/MC08_CHLORIDE_METHYL_CHLORIDE_IDENTITY_SN2_SOURCE_AUDIT_v0.1.json
      - name: Run regression tests
        run: python -m pytest -q barrier_atlas/family_independence/test_mc08_chloride_identity_sn2_v0_1.py

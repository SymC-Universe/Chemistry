          path: prior
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.PARENT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Continue frozen L13 audit logical segment 25
        shell: bash
        run: |
          set -euo pipefail
          chmod +x engine/bin/pw.x
          python3 "$EXT2_RUNNER" continue \
            --protocol "$EXT2_PROTOCOL" --surface-protocol "$SURFACE_PROTOCOL" \
            --stage-a-result stage_a_decision/PBE_STAGE_A_NUMERICAL_EXTENSION_RESULT.json \
            --bundle "$BUNDLE" --pseudo-dir engine/pseudos --pw engine/bin/pw.x \
            --selection selection/RANK_SELECTION_RESULT.json --prior-root prior --segment 1 \
            --runtime-cap-s "$CONTINUATION_RUNTIME_CAP_S" --out segment_out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: co-cu111-pbe-surface-audit-continuation-extension-v2-L13-V28-K24-seg25
          path: segment_out
          retention-days: 90
          if-no-files-found: error



name: Na Cu001 prune superseded C7 runs

on:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/na-cu001-c7-cancel-miscentered.yml'

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel all pre-fix source runs
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SOURCE_SHA: 'PENDING_LAUNCHER_SCOPE_FIX'
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "Na Cu001 v0.4 audited clean-slab closure" \
            --branch agent/na-cu001-integration \
            --limit 30 \
            --json databaseId,headSha,status,conclusion \
            > runs.json
          jq -c '.[] | select((.status=="in_progress" or .status=="queued") and .headSha != env.FINAL_SOURCE_SHA)' runs.json \
            | while read -r row; do
                run_id=$(jq -r '.databaseId' <<<"$row")
                head_sha=$(jq -r '.headSha' <<<"$row")
                echo "cancelling superseded C7 run $run_id at $head_sha"
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"
              done

name: Na Cu001 bulk extension launch monitor

on:
  pull_request:
    branches: [agent/na-cu001-integration]
    paths:
      - '.github/workflows/na-cu001-bulk-extension-monitor.yml'

permissions:
  contents: read
  actions: read

jobs:
  locate-extension-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Locate audited bulk extension run
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCH_SHA: ec0e18c86ead22e7062047fdff68e43ead72945f
        shell: bash
        run: |
          set -euo pipefail
          result=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow 'Na Cu001 audited bulk convergence extension v1' \
            --branch agent/na-cu001-integration \
            --event push \
            --limit 30 \
            --json databaseId,headSha,status,conclusion,createdAt,url,name \
            --jq ".[] | select(.headSha == \"${LAUNCH_SHA}\")")
          [[ -n "$result" ]]
          printf '%s\n' "$result" | tee extension-run.json
      - uses: actions/upload-artifact@v4
        with:
          name: na-cu001-bulk-extension-launch-monitor
          path: extension-run.json
          retention-days: 7
          if-no-files-found: error

# Trusted same-repository monitor trigger only.

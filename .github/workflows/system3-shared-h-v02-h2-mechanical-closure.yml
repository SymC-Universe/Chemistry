name: System3 shared H v0.2 H2 mechanical closure

on:
  push:
    branches: [bridge/h-ru0001-relax-pass-20260917]
    paths:
      - '.github/workflows/system3-shared-h-v02-h2-mechanical-closure.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PROTOCOL: systems/shared/H_PSEUDOPOTENTIAL_QUALIFICATION_RECOVERY_v0.2.json
  RUNNER: systems/shared/shared_h_qualification_recovery_v2.py
  SOURCE_RUN_ID: '35295414137'
  SOURCE_ARTIFACT: system3-shared-h-pseudopotential-qualification-v1
  ENGINE_RUN_ID: '31371043888'
  ENGINE_ARTIFACT: co-cu111-pbe-stage-a-engine-v2
  PW_SHA256: 2b1ede22d276b1d4dab3e31212f306e88ae57e00f33ce6b532b849493a457855
  H_SOURCE_COMMIT: 0fb07d89d13407b0f00a0a3b8c21d7e387fb56f9
  H_SOURCE_PATH: libraries-pbe/nc-sg15-oncvpsp4/H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf
  H_MD5: 39a7d154f04d65093d603a437119a874

jobs:
  extract-parent-h2-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen v0.2 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RUNNER"
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.environ['PROTOCOL']))
          assert p['status']=='FROZEN_AFTER_V0_1_HOLD_BEFORE_V0_2_RECOVERY_RESULTS'
          assert p['parent_run_id']==35295414137
          assert p['parent_disposition']=='SHARED_H_PSEUDOPOTENTIAL_HOLD'
          assert p['h2_recovery']['forc_conv_thr_ry_per_bohr']==0.00015
          assert p['acceptance']['max_h2_final_force_ev_per_angstrom']==0.005
          assert p['h2_recovery']['forc_conv_thr_ev_per_angstrom'] < 0.005
          assert all(v is False for v in p['firewall'].values())
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT }}
          path: parent
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Extract only structured H2 source evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compact/h2_70 compact/h2_80
          cp parent/H_PSEUDOPOTENTIAL_QUALIFICATION_RESULT.json compact/
          cp parent/h2_70/H2_70.out compact/h2_70/
          cp parent/h2_80/H2_80.out compact/h2_80/
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('compact/H_PSEUDOPOTENTIAL_QUALIFICATION_RESULT.json')
          r=json.loads(p.read_text())
          assert r['status']=='SHARED_H_PSEUDOPOTENTIAL_HOLD'
          for tag in ('70','80'):
              h=r['records'][tag]['h2']
              pts=h['final_positions_angstrom']
              assert isinstance(pts,list) and len(pts)==2
              assert all(isinstance(row,list) and len(row)==3 for row in pts)
              assert h['bond_angstrom'] is not None
          print('COMPACT_PARENT_H2_SOURCE_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shared-h-v02-compact-parent-h2-source
          path: compact
          retention-days: 90
          if-no-files-found: error

  h2:
    needs: extract-parent-h2-source
    strategy:
      fail-fast: false
      matrix:
        basis: ['70','80']
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged QE runtime dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y curl libopenblas-dev liblapack-dev libfftw3-dev libopenmpi-dev openmpi-bin
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ENGINE_ARTIFACT }}
          path: engine
          repository: SymC-Universe/Chemistry
          run-id: ${{ env.ENGINE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: shared-h-v02-compact-parent-h2-source
          path: source
      - name: Verify runtime and exact H pseudo
        shell: bash
        run: |
          set -euo pipefail
          echo "$PW_SHA256  engine/bin/pw.x" | sha256sum -c -
          chmod +x engine/bin/pw.x
          url="https://raw.githubusercontent.com/unkcpz/sssp-verify-scripts/$H_SOURCE_COMMIT/$H_SOURCE_PATH"
          curl -L --fail --retry 5 --retry-delay 3 "$url" -o H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf
          echo "$H_MD5  H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf" | md5sum -c -
      - name: Run H2 recovery from preserved v0.1 structured geometry
        shell: bash
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          python3 "$RUNNER"             --protocol "$PROTOCOL"             --mode h2             --basis "${{ matrix.basis }}"             --pw engine/bin/pw.x             --pseudo H.nc.pbe.z_1.oncvpsp4.sg15.v0.upf             --source-root source             --out h2_result             --timeout-seconds 3600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-h-v02-h2-${{ matrix.basis }}-mechanical-closure
          path: h2_result
          retention-days: 90
          if-no-files-found: warn

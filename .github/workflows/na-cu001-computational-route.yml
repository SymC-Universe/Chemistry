name: Na Cu001 complete computational closure route

on:
  push:
    branches: [agent/na-cu001-integration]
    paths:
      - 'na_cu001_ci/closure_engine.py'
      - 'na_cu001_ci/test_closure_engine.py'
      - 'na_cu001_ci/run_computational_stage.sh'
      - 'na_cu001_ci/downstream_protocol.json'
      - 'na_cu001_ci/integration_closure_plan.json'
      - 'na_cu001_ci/validate_integration_chain.py'
      - '.github/workflows/na-cu001-computational-route.yml'
  workflow_dispatch:
    inputs:
      bulk_run_id:
        description: Successful or currently running bulk workflow run ID
        required: true
        default: '30803996866'

permissions: {contents: read, actions: read}
concurrency:
  group: na-cu001-computational-route-${{ github.ref }}
  cancel-in-progress: true
env:
  BULK_RUN_ID: ${{ inputs.bulk_run_id || '30803996866' }}
  OMP_NUM_THREADS: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Acquire bulk, build QE, resolve Na, and test engine
        env: {GH_TOKEN: '${{ github.token }}'}
        run: bash na_cu001_ci/run_computational_stage.sh prepare
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-qe-bundle, path: qe_bundle, retention-days: 30, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-closure-base, path: base, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage4-na-reference-raw, path: stage4_raw, retention-days: 30, if-no-files-found: error}

  slab-cases:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {layers: 5, vacuum: 12, tag: l5_v12}
          - {layers: 5, vacuum: 16, tag: l5_v16}
          - {layers: 5, vacuum: 20, tag: l5_v20}
          - {layers: 5, vacuum: 24, tag: l5_v24}
          - {layers: 7, vacuum: 12, tag: l7_v12}
          - {layers: 7, vacuum: 16, tag: l7_v16}
          - {layers: 7, vacuum: 20, tag: l7_v20}
          - {layers: 7, vacuum: 24, tag: l7_v24}
          - {layers: 9, vacuum: 12, tag: l9_v12}
          - {layers: 9, vacuum: 16, tag: l9_v16}
          - {layers: 9, vacuum: 20, tag: l9_v20}
          - {layers: 9, vacuum: 24, tag: l9_v24}
          - {layers: 11, vacuum: 12, tag: l11_v12}
          - {layers: 11, vacuum: 16, tag: l11_v16}
          - {layers: 11, vacuum: 20, tag: l11_v20}
          - {layers: 11, vacuum: 24, tag: l11_v24}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-qe-bundle, path: qe_bundle}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-closure-base, path: base}
      - run: bash na_cu001_ci/run_computational_stage.sh slab-case '${{ matrix.layers }}' '${{ matrix.vacuum }}' '${{ matrix.tag }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'na-cu001-stage2-slab-raw-${{ matrix.tag }}', path: slab_outputs, retention-days: 30, if-no-files-found: error}

  slab-gate:
    needs: [prepare, slab-cases]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-closure-base, path: base}
      - uses: actions/download-artifact@v4
        with: {pattern: 'na-cu001-stage2-slab-raw-*', path: slab_outputs, merge-multiple: true}
      - run: bash na_cu001_ci/run_computational_stage.sh slab-analyze
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage2-slab, path: stage2, retention-days: 90, if-no-files-found: error}

  clean:
    needs: [prepare, slab-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-qe-bundle, path: qe_bundle}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage2-slab, path: stage2}
      - run: bash na_cu001_ci/run_computational_stage.sh clean
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage3-clean, path: stage3, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage3-clean-raw, path: stage3_raw, retention-days: 30}

  adsorption-cases:
    needs: [prepare, clean]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {site: hollow, height: 2.0, tag: hollow_h20}
          - {site: hollow, height: 2.5, tag: hollow_h25}
          - {site: hollow, height: 3.0, tag: hollow_h30}
          - {site: bridge, height: 2.0, tag: bridge_h20}
          - {site: bridge, height: 2.5, tag: bridge_h25}
          - {site: bridge, height: 3.0, tag: bridge_h30}
          - {site: top, height: 2.0, tag: top_h20}
          - {site: top, height: 2.5, tag: top_h25}
          - {site: top, height: 3.0, tag: top_h30}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-qe-bundle, path: qe_bundle}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-closure-base, path: base}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage3-clean, path: stage3}
      - run: bash na_cu001_ci/run_computational_stage.sh adsorption-case '${{ matrix.site }}' '${{ matrix.height }}' '${{ matrix.tag }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'na-cu001-stage5-ads-${{ matrix.tag }}', path: ads_records, retention-days: 30, if-no-files-found: error}

  adsorption-gate:
    needs: [prepare, clean, adsorption-cases]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'na-cu001-stage5-ads-*', path: ads_records, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-closure-base, path: base}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage3-clean, path: stage3}
      - run: bash na_cu001_ci/run_computational_stage.sh adsorption-analyze
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage5-adsorption, path: stage5, retention-days: 90}

  endpoints:
    needs: [prepare, adsorption-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-qe-bundle, path: qe_bundle}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-closure-base, path: base}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage5-adsorption, path: stage5}
      - run: bash na_cu001_ci/run_computational_stage.sh endpoints
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage6-endpoints, path: stage6, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage6-endpoints-raw, path: stage6_raw, retention-days: 30}

  neb-cases:
    needs: [prepare, endpoints]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy: {fail-fast: false, matrix: {images: [5, 7, 9]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-qe-bundle, path: qe_bundle}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-closure-base, path: base}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage6-endpoints, path: stage6}
      - run: bash na_cu001_ci/run_computational_stage.sh neb-case '${{ matrix.images }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'na-cu001-stage7-neb-${{ matrix.images }}', path: neb_records, retention-days: 30, if-no-files-found: error}

  neb-gate:
    needs: [prepare, endpoints, neb-cases]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: 'na-cu001-stage7-neb-*', path: neb_records, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-closure-base, path: base}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage6-endpoints, path: stage6}
      - run: bash na_cu001_ci/run_computational_stage.sh neb-analyze
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage7-path, path: stage7, retention-days: 90}

  ci-neb:
    needs: [prepare, endpoints, neb-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-qe-bundle, path: qe_bundle}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-closure-base, path: base}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage6-endpoints, path: stage6}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage7-path, path: stage7}
      - run: bash na_cu001_ci/run_computational_stage.sh ci
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage8-ci-neb, path: stage8, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage8-ci-neb-raw, path: stage8_raw, retention-days: 30}

  saddle:
    needs: [prepare, endpoints, ci-neb]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-qe-bundle, path: qe_bundle}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-closure-base, path: base}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage6-endpoints, path: stage6}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage8-ci-neb, path: stage8}
      - run: bash na_cu001_ci/run_computational_stage.sh saddle
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage9-saddle, path: stage9, retention-days: 90}
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-stage9-saddle-raw, path: stage9_raw, retention-days: 30}

  finalize:
    needs: [prepare, slab-gate, clean, adsorption-gate, endpoints, neb-gate, ci-neb, saddle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-closure-base, path: base}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage2-slab, path: stage2}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage3-clean, path: stage3}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage5-adsorption, path: stage5}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage6-endpoints, path: stage6}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage7-path, path: stage7}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage8-ci-neb, path: stage8}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage9-saddle, path: stage9}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage4-na-reference-raw, path: raw/stage4}
      - uses: actions/download-artifact@v4
        with: {pattern: 'na-cu001-stage2-slab-raw-*', path: raw/stage2, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage3-clean-raw, path: raw/stage3}
      - uses: actions/download-artifact@v4
        with: {pattern: 'na-cu001-stage5-ads-*', path: raw/stage5, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage6-endpoints-raw, path: raw/stage6}
      - uses: actions/download-artifact@v4
        with: {pattern: 'na-cu001-stage7-neb-*', path: raw/stage7, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage8-ci-neb-raw, path: raw/stage8}
      - uses: actions/download-artifact@v4
        with: {name: na-cu001-stage9-saddle-raw, path: raw/stage9}
      - run: bash na_cu001_ci/run_computational_stage.sh finalize
      - name: Publish decision
        run: cat closure/INTEGRATION_READINESS.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-complete-computational-closure, path: closure, retention-days: 90, if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        with: {name: na-cu001-complete-computational-raw, path: raw, retention-days: 30, if-no-files-found: error}
